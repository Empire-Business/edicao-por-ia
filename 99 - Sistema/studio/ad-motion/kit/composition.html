<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Ad motion kit</title>
<style>
@font-face{font-family:Manrope;src:url(assets/manrope-variable.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:Baskerville;src:url(assets/libre-baskerville-variable.ttf) format("truetype");font-weight:400 700}
@font-face{font-family:JBM;src:url(assets/jetbrains-mono-variable.ttf) format("truetype");font-weight:100 900}
:root{
  /* ID05 Roxo: primary #820AD1, muted #5C0F8B, text #17092C, surface #FFF, bg #F7F4FB */
  --p:#820AD1; --pm:#5C0F8B; --ink:#17092C; --paper:#F7F4FB; --white:#FFFFFF;
  --p-hi:#B26CFF;            /* tint of primary, for contrast on dark */
  --deep:#0D0419;            /* shade of ink */
  --glass:rgba(247,244,251,.055); --line:rgba(178,108,255,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:Manrope,sans-serif;color:var(--white)}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.mono{font-family:JBM,monospace}
/* ---------- full-screen motion background ---------- */
.bg{position:absolute;inset:0;background:radial-gradient(1100px 900px at 50% 38%,rgba(130,10,209,.42),rgba(92,15,139,.16) 45%,transparent 70%),linear-gradient(180deg,#140726 0%,var(--deep) 60%,#07020F 100%);opacity:0}
.bg .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5}
.floor{position:absolute;left:-400px;right:-400px;bottom:-40px;height:560px;transform:perspective(700px) rotateX(62deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(178,108,255,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(178,108,255,.35) 2px,transparent 2px);background-size:120px 120px;opacity:.55;
  -webkit-mask-image:linear-gradient(0deg,#000 10%,transparent 85%);mask-image:linear-gradient(0deg,#000 10%,transparent 85%)}
.beam{position:absolute;left:50%;top:-200px;width:900px;height:1300px;margin-left:-450px;background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(178,108,255,.10) 180deg,transparent 200deg);filter:blur(10px)}
/* ---------- glass panel ---------- */
.panel{position:absolute;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1.5px solid var(--line);border-radius:30px;
  box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset,0 0 80px rgba(130,10,209,.25);backdrop-filter:blur(6px)}
.winbar{height:64px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1.5px solid rgba(178,108,255,.18);font-family:JBM;font-size:20px;color:rgba(247,244,251,.6);letter-spacing:.04em}
.dot{width:14px;height:14px;border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;font-family:JBM;font-size:22px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--line);background:rgba(130,10,209,.18);color:#E9D9FF}
.live{width:12px;height:12px;border-radius:50%;background:#3BE38A;box-shadow:0 0 14px #3BE38A}
/* ---------- kinetic titles ---------- */
.ttl{position:absolute;left:64px;right:380px;text-align:left;pointer-events:none}
.ttl.full{right:64px}
.ttl .lab{font-family:JBM;font-size:25px;font-weight:600;letter-spacing:.28em;color:rgba(247,244,251,.9);text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.ttl .big{font-weight:900;font-size:104px;line-height:1;letter-spacing:-.025em;text-transform:uppercase;margin-top:10px;display:table;
  color:#FFFFFF;text-shadow:0 4px 0 rgba(13,4,25,.35),0 0 34px rgba(130,10,209,.55),0 2px 12px rgba(0,0,0,.45)}
.ttl .big.alt{color:#fff;background:var(--p);padding:2px 22px 8px;border-radius:14px;margin-top:10px;text-shadow:none;box-shadow:0 14px 40px rgba(130,10,209,.45)}
.ttl .ch{display:inline-block;will-change:transform}
/* ---------- captions ---------- */
.cap{position:absolute;left:0;right:0;text-align:center;opacity:0}
.cap .pill{display:inline-block;padding:0 40px;color:#fff;font-weight:900;font-size:68px;line-height:1.15;letter-spacing:-.015em;
  text-shadow:0 4px 0 rgba(13,4,25,.45),0 6px 24px rgba(0,0,0,.7)}
.cap .w{display:inline-block;margin:0 .04em;padding:0 .14em 4px;border-radius:14px}
.cap .w.key{color:#D9B8FF}
.cap .w.on{background:var(--p);color:#fff;text-shadow:none;box-shadow:0 8px 24px rgba(130,10,209,.55)}
/* ---------- misc UI ---------- */
.ui-txt{font-size:30px;font-weight:600;color:#F2EAFF}
.ui-sub{font-family:JBM;font-size:20px;letter-spacing:.12em;color:rgba(242,234,255,.55);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border-radius:999px;font-weight:800;font-size:32px;padding:22px 40px}
.btn.p{background:linear-gradient(180deg,#9B2BEA,#820AD1);color:#fff;box-shadow:0 10px 40px rgba(130,10,209,.6),0 0 0 1.5px rgba(255,255,255,.18) inset}
.btn.g{background:rgba(255,255,255,.06);border:1.5px solid var(--line);color:#E9D9FF}
.check{width:40px;height:40px;border-radius:50%;border:2.5px solid rgba(178,108,255,.45);display:flex;align-items:center;justify-content:center;flex:none}
.check svg{width:24px;height:24px;opacity:0}
.check.done{background:var(--p);border-color:var(--p-hi);box-shadow:0 0 20px rgba(178,108,255,.7)}
.check.done svg{opacity:1}
.cursor{position:absolute;width:46px;height:46px;z-index:50;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.ring{position:absolute;width:90px;height:90px;border-radius:50%;border:3px solid var(--p-hi);opacity:0;z-index:49}
.tile{position:absolute;width:212px;height:150px;border-radius:20px;border:1.5px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));padding:16px;overflow:hidden}
.tile .n{font-family:JBM;font-size:17px;color:rgba(233,217,255,.6);letter-spacing:.1em}
.tile .t{font-weight:800;font-size:23px;line-height:1.1;margin-top:8px;color:#F4ECFF}
.tile .bar{position:absolute;left:16px;right:16px;bottom:16px;height:30px;border-radius:8px;background:linear-gradient(90deg,rgba(178,108,255,.35),rgba(178,108,255,.08))}
.tag{position:absolute;padding:8px 18px;border-radius:12px;font-family:JBM;font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.track{position:absolute;left:150px;height:42px;border-radius:10px}
.blk{position:absolute;top:0;height:42px;border-radius:9px;background:linear-gradient(180deg,#A34CF5,#7C14C9);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset;font-family:JBM;font-size:15px;color:#fff;padding:11px 10px;overflow:hidden;white-space:nowrap}
.tlab{position:absolute;left:28px;font-family:JBM;font-size:17px;letter-spacing:.14em;color:rgba(233,217,255,.55)}
.phone{position:absolute;border-radius:62px;background:#07020F;border:10px solid #231238;box-shadow:0 50px 140px rgba(0,0,0,.7),0 0 0 2px rgba(178,108,255,.35),0 0 120px rgba(130,10,209,.45);overflow:hidden}
.shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(-120%)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:screen}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(5,0,12,.35) 100%);opacity:0}
.topshade{position:absolute;left:0;right:0;top:0;height:560px;background:linear-gradient(180deg,rgba(9,2,20,.62),rgba(9,2,20,.22) 60%,transparent);opacity:0}
.botshade{position:absolute;left:0;right:0;bottom:0;height:700px;background:linear-gradient(0deg,rgba(9,2,20,.55),rgba(9,2,20,.15) 60%,transparent);opacity:0}
.progress{position:absolute;left:0;bottom:0;height:8px;background:linear-gradient(90deg,#820AD1,#B26CFF);box-shadow:0 0 16px #B26CFF;width:0}
</style>
<link rel="stylesheet" href="identity.css"></head>
<body><div id="stage"></div>
<script src="assets/gsap.min.js"></script>
<script>
/* PLAN is injected by build_motion.py:  {fps,duration,segs:[{id,type,start,end}],words:[{w,s,e}],still:"..."} */
const PLAN = window.PLAN;
const pr=(sg,k,d)=>(sg.props&&sg.props[k]!=null)?sg.props[k]:d;   // scene props with defaults
const S = document.getElementById('stage');
const tl = gsap.timeline({paused:true});
window.SFX=[];const sfx=(type,t,extra={})=>{if(t!=null&&isFinite(t))window.SFX.push(Object.assign({type,t:+t.toFixed(3)},extra))};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CURSOR = '<svg viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.3 3.9 7.4-3 1.6-3.9-7.4L4 19z" fill="#fff" stroke="#17092C" stroke-width="1.2"/></svg>';
const SPARK = '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 0c.9 6.6 4.8 10.6 12 12-7.2 1.4-11.1 5.4-12 12-.9-6.6-4.8-10.6-12-12C7.2 10.6 11.1 6.6 12 0z" fill="currentColor"/></svg>';
const seg = id => PLAN.segs.find(s=>s.id===id);
const el = (html,parent=S)=>{const d=document.createElement('div');d.innerHTML=html.trim();const n=d.firstElementChild;parent.appendChild(n);return n};
const wordAt = (txt,from,to)=>{ // first word time containing txt inside [from,to]
  const n=txt.toLowerCase(); const w=PLAN.words.find(w=>w.s>=from-0.05&&w.s<=to&&w.w.toLowerCase().replace(/[^\p{L}\d]/gu,'').startsWith(n)); return w?w.s:null };
const at = (txt,sg,fb)=>{const al=(sg.props&&sg.props.anchors||{})[txt];if(al!=null)txt=al;const v=wordAt(txt,sg.start,sg.end);return v==null?(sg.start+fb):v};   // props.anchors remaps a default anchor word

/* ================= reusable builders ================= */
function stars(parent,n=70,seed=7){const box=el('<div class="stars abs" style="inset:0"></div>',parent);let x=seed;
  const r=()=>{x=(x*9301+49297)%233280;return x/233280};
  for(let i=0;i<n;i++){const s=el(`<i style="left:${r()*1080}px;top:${r()*1500}px;transform:scale(${.4+r()*1.4});opacity:${.15+r()*.6}"></i>`,box);
    tl.to(s,{opacity:.1+r()*.8,duration:.6+r()*1.4,repeat:Math.floor(PLAN.duration/1.2),yoyo:true,ease:'sine.inOut'},r()*2);}
  return box}
function bgScene(t0,t1,opts={}){ // dark purple world, fades in/out
  const b=el('<div class="bg"></div>'); stars(b); if(opts.beam!==false) el('<div class="beam"></div>',b); el('<div class="floor"></div>',b);
  if(opts.instant)b.style.opacity=1;else tl.fromTo(b,{opacity:0},{opacity:1,duration:.25,ease:'none',immediateRender:false},t0); tl.to(b,{opacity:0,duration:.2,ease:'none'},t1-.2); sfx('whoosh',t0);
  tl.fromTo(b.querySelector('.floor'),{backgroundPositionY:0},{backgroundPositionY:240,duration:t1-t0,ease:'none'},t0);
  tl.fromTo(b,{scale:1},{scale:1.045,transformOrigin:'50% 42%',duration:t1-t0,ease:'none',immediateRender:false},t0);
  return b}
function kinetic(parent,text,cls,t,stagger=.035){ // splits text in chars and pops them
  const d=el(`<div class="big ${cls||''}"></div>`,parent);
  text.split(' ').forEach((word,wi,arr)=>{const wd=document.createElement('span');wd.style.whiteSpace='nowrap';wd.style.display='inline-block';   // break lines only between words
    word.split('').forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c;wd.appendChild(s)});d.appendChild(wd);
    if(wi<arr.length-1)wd.style.marginRight='.26em';});
  tl.set(d,{visibility:'hidden'},0);tl.set(d,{visibility:'visible'},t);
  if(cls==='alt')tl.from(d,{clipPath:'inset(0 100% 0 0)',duration:.35,ease:'power3.inOut'},t);
  tl.from(d.querySelectorAll('.ch'),{yPercent:55,opacity:0,scale:.85,filter:'blur(8px)',duration:.5,ease:'power3.out',stagger},t);
  return d}
function title(t0,t1,label,lines,y=170,opts={}){
  const box=el(`<div class="ttl" style="top:${y}px"></div>`);
  if(label){const l=el(`<div class="lab">${label}</div>`,box);tl.from(l,{opacity:0,letterSpacing:'0.9em',duration:.55,ease:'power3.out'},t0);}
  lines.forEach((ln,i)=>{const tt=(opts.times&&opts.times[i]!=null)?opts.times[i]:t0+.12+i*.32;kinetic(box,ln.text,ln.alt?'alt':'',tt);});
  if(opts.strike!=null){}
  tl.to(box,{opacity:0,y:-40,filter:'blur(10px)',duration:.3,ease:'power2.in'},t1-.3); tl.set(box,{display:'none'},t1);
  tl.set(box,{display:'none'},0); tl.set(box,{display:'block'},t0-.01);
  return box}
function shades(t0,t1){const a=el('<div class="topshade"></div>'),b=el('<div class="botshade"></div>'),v=el('<div class="vignette"></div>');
  [a,b,v].forEach(n=>{tl.to(n,{opacity:1,duration:t0===0?0.01:.25},t0);tl.to(n,{opacity:0,duration:.2},t1-.2)})}
function cursorPath(points,t0){ // [{x,y,t,click}]
  const c=el(`<div class="cursor">${CURSOR}</div>`);const ring=el('<div class="ring"></div>');
  tl.set(c,{x:points[0].x,y:points[0].y,opacity:0},0);tl.to(c,{opacity:1,duration:.2},points[0].t);
  for(let i=1;i<points.length;i++){const p=points[i];tl.to(c,{x:p.x,y:p.y,duration:Math.max(.25,p.t-points[i-1].t-.05),ease:'power3.inOut'},points[i-1].t+.05);
    if(p.click){sfx('click',p.t);tl.to(c,{scale:.82,duration:.08,yoyo:true,repeat:1},p.t);tl.fromTo(ring,{x:p.x-22,y:p.y-22,scale:.3,opacity:.9},{scale:1.4,opacity:0,duration:.5,ease:'power2.out',immediateRender:false},p.t);}}
  tl.to(c,{opacity:0,duration:.2},points[points.length-1].t+.6);return c}
function typeInto(node,text,t,dur){sfx('type',t,{dur});const o={n:0};tl.to(o,{n:text.length,duration:dur,ease:'none',onUpdate:()=>{node.textContent=text.slice(0,Math.round(o.n))}},t);tl.set(node,{textContent:''},0)}
function flash(t,a=.35){return;const f=el('<div class="flash"></div>');tl.fromTo(f,{opacity:a},{opacity:0,duration:.35,ease:'power2.out',immediateRender:false},t)}
function pop(node,t,from={}){sfx('pop',t);tl.from(node,Object.assign({opacity:0,scale:.9,y:30,filter:'blur(8px)',duration:.5,ease:'power3.out'},from),t)}
function stepBadge(parent,n,t){const b=el(`<div class="abs" style="left:0;right:0;top:150px;text-align:center"><span class="chip"><span class="live" style="background:var(--p-hi);box-shadow:0 0 14px #B26CFF"></span>passo ${n} de 3</span></div>`,parent);pop(b,t,{y:-30});return b}

/* ================= captions (all speech) ================= */
function captions(){
  const KEYS=/^(cortez|cortês|claude|cláudio|editor|vídeos?|ia|bruto|erros|pausas|repetições|modelos?|20|roxo|vertical|legendas|resultado|aprovar|ajuste|versão|passos|três|3|saiba|mais|celular|tempo)$/i;
  const groups=[];let g=[];
  PLAN.words.forEach((w,i)=>{const prev=PLAN.words[i-1];
    const brk=g.length>=3||(prev&&(w.s-prev.e>.35))||(prev&&/[.,?!]$/.test(prev.w.trim())&&g.length>=2)||(prev&&prev.segEnd);
    if(brk&&g.length){groups.push(g);g=[]} g.push(w)});
  if(g.length)groups.push(g);
  groups.forEach((gr,i)=>{const sg=PLAN.segs.find(s=>gr[0].s>=s.start-.01&&gr[0].s<s.end);if(!sg||sg.noCaptions)return;
    const y=sg.type==='face'?1440:1560;
    const c0=el(`<div class="cap" style="top:${y}px"></div>`);const c=el('<div class="pill"></div>',c0);
    gr.forEach(w=>{const s=document.createElement('span');const clean=w.w.trim().replace(/^[—-]/,'');s.className='w'+(KEYS.test(clean.replace(/[^\p{L}\d]/gu,''))?' key':'');s.textContent=clean;c.appendChild(s)});
    const t0=gr[0].s-.04, next=groups[i+1]; let t1=Math.min(next?next[0].s-.04:sg.end, gr[gr.length-1].e+.6, sg.end);
    if(t1<=t0+.05)t1=t0+.3;   // never hide before showing (groups sharing a start time)
    tl.set(c0,{opacity:1},t0);tl.from(c,{scale:.94,y:10,opacity:0,duration:.16,ease:'power2.out'},t0);
    [...c.children].forEach((sp,k)=>{const base=sp.className;tl.set(sp,{display:'none'},0);tl.set(sp,{display:'inline-block'},Math.max(t0,gr[k].s-.06));
      tl.set(sp,{className:base+' on'},Math.max(t0,gr[k].s-.06));tl.set(sp,{className:base},Math.min(t1,gr[k+1]?gr[k+1].s-.06:t1));});
    tl.set(c0,{opacity:0},t1);
  })}

/* ================= SCENES ================= */
function sceneT5(sg){ // PASSO 2: send raw video
  const b=bgScene(sg.start,sg.end);
  stepBadge(b,2,sg.start+.05);
  const drop=el(`<div class="panel" style="left:110px;top:330px;width:860px;height:560px;border-style:dashed;border-width:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
    <div style="font-size:70px;color:#C99BFF">⇪</div><div class="ui-txt">Solte o vídeo bruto aqui</div><div class="ui-sub">do jeito que você gravou</div></div>`,b);
  pop(drop,sg.start+.15,{y:80});
  const file=el(`<div class="panel" style="left:280px;top:1160px;width:520px;padding:22px;display:flex;gap:22px;align-items:center;border-radius:24px">
     <div style="width:110px;height:150px;border-radius:16px;background:linear-gradient(160deg,#3B1C63,#140726);display:flex;align-items:center;justify-content:center;font-size:40px">▶</div>
     <div><div style="font-size:32px;font-weight:800">video_bruto.mov</div><div class="ui-sub" style="margin-top:8px">4K · 2:03 · sem edição</div></div></div>`,b);
  const tv=at('vídeo',sg,.9);
  tl.from(file,{y:400,opacity:0,rotate:-10,duration:.5,ease:'power3.out'},tv-.3);
  tl.to(file,{y:-640,scale:.9,rotate:2,duration:.6,ease:'power3.inOut'},tv+.6);
  tl.to(drop,{borderColor:'rgba(178,108,255,.9)',boxShadow:'0 0 120px rgba(178,108,255,.6)',duration:.3},tv+.7);
  // waveform with problem tags
  const wf=el(`<div class="panel" style="left:70px;top:960px;width:940px;height:300px;padding:30px"><div class="ui-sub">sua gravação</div><div class="bars abs" style="left:30px;right:30px;top:80px;height:180px;display:flex;align-items:center;gap:5px"></div></div>`,b);
  const bars=wf.querySelector('.bars');let x=3;for(let i=0;i<120;i++){x=(x*1103515245+12345)%2147483648;const h=(i%23<4)?6:20+(x/2147483648)*150;el(`<i style="flex:1;height:${h}px;border-radius:4px;background:${(i%23<4)?'rgba(255,255,255,.15)':'rgba(178,108,255,.85)'}"></i>`,bars)}
  tl.from(wf,{opacity:0,y:60,duration:.5,ease:'power3.out'},tv+1.0);
  tl.from(bars.children,{scaleY:0,duration:.3,stagger:.004,ease:'power2.out'},tv+1.1);
  const tags=[['erro','erros',120,1300,'#FF9FB2','rgba(255,80,110,.2)'],['pausa','pausas',430,1310,'#FFD58A','rgba(255,190,60,.18)'],['repetição','repetições',700,1300,'#9FD7FF','rgba(60,170,255,.18)']];
  tags.forEach(([lab,word,lx,ly,fg,bgc])=>{const tg=el(`<div class="tag" style="left:${lx}px;top:${ly}px;color:${fg};background:${bgc};border:1.5px solid ${fg}">✕ ${lab}</div>`,b);pop(tg,at(word.slice(0,5),sg,2)-.05,{y:-30,rotate:-8})});
}
function sceneT6(sg){ // 20 models: 3D tilted plane of cards + dial counter, then chosen card, then prompt
  const b=bgScene(sg.start,sg.end,{beam:false});
  const ICON={
    person:'<circle cx="24" cy="17" r="8"/><path d="M8 42c2-10 9-14 16-14s14 4 16 14"/>',
    chart:'<path d="M8 40V26M18 40V16M28 40V22M38 40V9"/>',
    chat:'<path d="M7 10h26a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H17l-8 7v-7H7a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"/>',
    list:'<path d="M14 12h26M14 24h26M14 36h18"/><circle cx="7" cy="12" r="2"/><circle cx="7" cy="24" r="2"/><circle cx="7" cy="36" r="2"/>',
    cols:'<rect x="5" y="8" width="16" height="32" rx="3"/><rect x="27" y="8" width="16" height="32" rx="3"/>',
    play:'<rect x="4" y="9" width="40" height="30" rx="5"/><path d="M20 17l10 7-10 7z"/>',
    doc:'<path d="M12 5h17l9 9v29H12z"/><path d="M18 22h14M18 29h14M18 36h9"/>',

function sceneNumbersBars(sg){ // total bar minus deductions -> result; props: title, total_label, total, items:[{label,value,anchor}], result_label, result_anchor, unit
  const b=bgScene(sg.start,sg.end);
  const total=pr(sg,'total',100),items=pr(sg,'items',[]),unit=pr(sg,'unit','mil');
  const head=el(`<div class="ttl full" style="top:150px"><div class="lab">${pr(sg,'title','na prática')}</div></div>`,b);
  tl.from(head.firstChild,{opacity:0,x:-20,duration:.3},sg.start);
  const card=el(`<div class="panel" style="left:60px;top:300px;width:960px;padding:40px;border-radius:32px"></div>`,b);
  const row=(label,val,color,extra='')=>el(`<div style="margin:0 0 26px"><div style="display:flex;justify-content:space-between;font-size:30px;font-weight:800"><span>${label}</span><span class="v mono" style="color:${color}">0</span></div>
     <div style="height:34px;border-radius:12px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden"><div class="bar" style="height:100%;width:0;border-radius:12px;background:${color};${extra}"></div></div></div>`,card);
  const tr=row(pr(sg,'total_label','faturamento'),total,'#E9D9FF','box-shadow:0 0 20px rgba(233,217,255,.4)');
  const t0=at(pr(sg,'total_anchor','faturou'),sg,.6);
  const animRow=(r,val,t,neg)=>{const o={v:0};tl.to(r.querySelector('.bar'),{width:(Math.abs(val)/total*100)+'%',duration:.6,ease:'power2.out'},t);
    tl.to(o,{v:val,duration:.6,ease:'power2.out',onUpdate:()=>r.querySelector('.v').textContent=(neg?'− ':'')+Math.round(Math.abs(o.v))+' '+unit},t);tl.from(r,{opacity:0,y:20,duration:.3},t-.05)};
  animRow(tr,total,t0,false);
  let left=total;
  const ranking=pr(sg,'mode','deduct')==='ranking';
  items.forEach((it,i)=>{const r=row(it.label,it.value,ranking?'var(--p-hi)':'#FF8FA3');animRow(r,it.value,at(it.anchor||it.label.split(' ')[0],sg,1.4+i*.7),!ranking);left-=it.value;});
  if(ranking)return;   // ranking: bars only, no subtraction/result
  const res=row(pr(sg,'result_label','lucro'),left,'var(--p-hi)','box-shadow:0 0 30px rgba(178,108,255,.8)');
  const tres=at(pr(sg,'result_anchor','lucro'),sg,(sg.end-sg.start)*.8);
  animRow(res,left,tres,false);sfx('ding',tres+.4);
  tl.to(res,{scale:1.04,transformOrigin:'0 50%',duration:.3,yoyo:true,repeat:1},tres+.6);
}
