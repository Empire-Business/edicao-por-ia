:root{--paper:#07030D;--surface:#1B0F2E;--ink:#F4EEFB;--muted:#B9A8CF;--line:rgba(200,139,247,.2);--accent:#C88BF7;--accent-soft:rgba(130,10,209,.2);--navy:#C88BF7;--green:#5BE49B;--radius:16px;--ease:cubic-bezier(.2,.7,.2,1);--grad:linear-gradient(120deg,#C88BF7 0%,#B96CEF 45%,#AD5EE3 100%);font-family:Manrope,sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:94px}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:inherit;text-decoration:none}button{color:inherit}svg{flex-shrink:0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}main:focus,h1:focus{outline:none}::selection{background:var(--accent-soft);color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.skip-link{position:fixed;z-index:10;left:20px;top:-70px;padding:14px;background:#820AD1;color:#F4EEFB}.skip-link:focus{top:10px}
.site-header{height:80px;max-width:1720px;margin:auto;padding:0 64px;display:flex;align-items:center;justify-content:space-between;gap:32px;border-bottom:1px solid var(--line)}.site-title{font-size:19px;font-weight:800;line-height:1.05;letter-spacing:-.8px}.site-title span{display:block;font-weight:500;font-size:15px;letter-spacing:-.2px;margin-top:4px}.site-header nav{display:flex;align-items:center;gap:36px}.site-header nav a{font-size:13px;font-weight:650;min-height:44px;display:flex;align-items:center;position:relative;gap:5px}.site-header nav a[aria-current=page]::after{content:'';height:2px;background:var(--accent);position:absolute;bottom:-18px;left:0;right:0}.header-note{font:10px 'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.7px}
main{max-width:1720px;margin:auto;padding:0 64px 80px;min-height:70vh}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:48px;padding:32px 0 28px}.eyebrow{font:10px/1.5 'JetBrains Mono',monospace;letter-spacing:1.1px;font-weight:400;color:var(--muted)}.intro-eyebrow{margin-bottom:18px}.intro h1,.page-intro h1{font-size:50px;line-height:1.065;letter-spacing:-2.9px;font-weight:650}.intro h1 em,.page-intro h1 em{font-family:Manrope,sans-serif;color:var(--accent);font-style:normal;font-weight:800;letter-spacing:-3px}.intro-aside{max-width:440px;padding-bottom:5px}.intro-aside>p{font-size:15px;line-height:1.75;color:var(--muted)}.text-link{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:9px;min-height:44px;font-size:13px;font-weight:700}.text-link:hover{color:var(--accent)}.intro-aside .text-link{margin-top:5px}.intro-note{display:flex;align-items:center;gap:8px;margin-top:20px;font-size:11px;color:var(--muted)}.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.library-toolbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:24px;border-top:1px solid var(--line)}.search-field{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);height:50px;padding:0 16px;max-width:545px;flex:1;border-radius:8px}.search-field:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}.search-field>svg{color:var(--muted)}.search-field input{border:0;background:transparent;outline:none!important;width:100%;height:100%;font-size:13px;min-width:0}.search-field input::placeholder{color:var(--muted)}.search-field kbd{border:1px solid var(--line);font:11px 'JetBrains Mono',monospace;padding:3px 6px;border-radius:3px;color:var(--muted)}.toolbar-actions{display:flex;align-items:center;gap:18px}.filter-favorite,.autoplay-toggle{display:flex;align-items:center;gap:9px;min-height:44px;border:0;background:none;font-size:12px;font-weight:650;padding:6px 10px;border-radius:6px}.filter-favorite:hover,.autoplay-toggle:hover{background:var(--surface)}.filter-favorite[aria-pressed=true]{color:var(--accent);background:var(--accent-soft)}.count{font:10px 'JetBrains Mono',monospace;display:grid;place-items:center;border-radius:50%;min-width:21px;height:21px;background:var(--line);color:var(--ink)}.filter-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:19px}.categories{display:flex;gap:8px;flex-wrap:wrap}.categories button{border:1px solid transparent;background:transparent;border-radius:6px;min-height:44px;padding:10px 14px;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:650;white-space:nowrap}.categories button>span{font:10px 'JetBrains Mono',monospace;opacity:.7}.categories button:hover{background:var(--surface)}.categories button[aria-pressed=true]{background:#820AD1;color:#F4EEFB}#result-count{font:11px 'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap}.library-hint{font-size:11px;line-height:1.5;display:flex;align-items:center;gap:6px;color:var(--muted);margin:15px 0 25px}.library-hint svg{width:13px;height:13px}

.install-warning{display:flex;flex-direction:column;gap:6px;max-width:900px;padding:18px 22px;border-radius:14px;border:1px solid #E5B84D;background:#FFF6DC;color:#4A3500;font-size:14px;line-height:1.7}.install-warning strong{font-size:15px;color:#2E2000}
.install-steps{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:20px;max-width:900px}
.install-step{display:grid;grid-template-columns:64px minmax(0,1fr);gap:24px;padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:0 2px 14px rgba(60,25,110,.06)}
.install-number{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font:700 20px 'JetBrains Mono',monospace}
.install-step h2{font-size:24px;letter-spacing:-.7px;line-height:1.25;margin:4px 0 10px}
.install-step p{font-size:15px;line-height:1.75;color:var(--muted);margin:0 0 12px}
.install-list{margin:0 0 16px;padding-left:22px;font-size:15px;line-height:1.75}.install-list li+li{margin-top:8px}.install-list a,.install-step p a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.install-note{font-size:13px!important;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--ink)!important}
.install-buttons{display:flex;flex-wrap:wrap;gap:12px;margin:4px 0 16px}
.license-card{max-width:900px;padding:26px 28px;border:1px solid rgba(130,10,209,.3);border-radius:20px;background:#F1E8FB}.license-card ul{margin:0;padding-left:20px;font-size:15px;line-height:1.75}.license-card li+li{margin-top:10px}
.install-extra{max-width:900px}
.license-block{max-width:900px}
@media(max-width:720px){.install-step{grid-template-columns:minmax(0,1fr);gap:14px;padding:22px 20px}.install-number{width:44px;height:44px;font-size:17px}.install-callout{flex-direction:column;align-items:flex-start}.install-step h2{font-size:21px}}


/* Home organizada e Ajuda */
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 20px}
.home-block{padding-top:72px}
.home-steps li{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.models-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.models-strip a{display:block;min-width:0}.models-strip img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#EDE4F7;transition:transform 180ms var(--ease)}.models-strip a:hover img{transform:translateY(-3px)}.models-strip span{display:block;margin-top:8px;font:11px/1.4 'JetBrains Mono',monospace;color:var(--muted)}
.group-tile h3{margin:8px 0 6px}.group-tile p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.home-help{margin-top:56px;padding:22px 26px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:14px;line-height:1.8}.home-help a,.page-intro a,.help-block p a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.home-help p{margin:0}
.help-nav{display:flex;flex-wrap:wrap;gap:8px;max-width:900px;margin-bottom:8px}.help-nav a{padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;background:var(--surface)}.help-nav a:hover{border-color:var(--accent);color:var(--accent)}
.help-block{max-width:900px;padding-top:44px;scroll-margin-top:100px}.help-block h2{font-size:26px;letter-spacing:-.8px;margin:0 0 16px}.help-block>p{font-size:15px;line-height:1.75;color:var(--muted)}
@media(max-width:1279px){.models-strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.home-block{padding-top:52px}.models-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-actions{grid-column:1 / -1;grid-row:4;flex-direction:column}.hero-actions .button{width:100%}.home-intro .intro-note{grid-row:5}.help-nav{flex-wrap:nowrap;overflow-x:auto}.help-nav a{white-space:nowrap}}
.tutorial-grid{grid-template-columns:minmax(0,880px)}

/* Complementos mínimos para o catálogo nativo de efeitos. A estrutura e os
   componentes de interface vêm dos estilos compartilhados de Modelos. */
.fx-card .media-stage canvas,.fx-detail-media .media-stage canvas{display:block;width:100%;height:100%;aspect-ratio:9/16;background:var(--navy);}
.fx-card .media-stage{aspect-ratio:9/16;}
.fx-detail-media .media-stage{aspect-ratio:9/16;}
.fx-player{display:grid;grid-template-columns:auto auto;gap:8px;width:100%;max-width:390px;margin-top:12px;}
.fx-player .button{min-height:42px;justify-content:center;}
.fx-player label{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);min-width:0;align-items:center;gap:12px;padding-top:8px;font-size:11px;color:var(--muted);}
.fx-player input[type=range]{width:100%;min-width:0;accent-color:var(--accent);}
.fx-detail-layout{align-items:start;}
.fx-detail-layout>.detail-left{min-width:0;max-width:100%;}
.fx-caution{border-top:1px solid var(--line);padding-top:16px;}
.fx-sources{font-size:12px;line-height:1.9;color:var(--muted);}
.fx-sources a{color:var(--accent);text-underline-offset:3px;}
.fx-source{display:grid;gap:5px;padding:12px 0;border-bottom:1px solid var(--line);}
.fx-source .eyebrow{font-size:9px;color:var(--muted);}
.fx-source>span:last-child{font-size:11px;line-height:1.75;color:var(--muted);}
.fx-edit-label{display:block;margin:18px 0 8px;font-size:11px;font-weight:700;}
.fx-detail-layout [data-fx-text],.fx-detail-layout [data-fx-prompt]{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:12px;line-height:1.7;}
.fx-detail-layout [data-fx-accent]{display:block;width:64px;height:42px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);}
.fx-detail-layout [data-fx-prompt]{min-height:180px;margin-top:12px;resize:vertical;color:var(--muted);}
@media(max-width:720px){.fx-detail-layout{grid-template-columns:minmax(0,1fr);}.fx-player{max-width:min(100%,310px);}.fx-player .button{font-size:10px;padding:8px;}}
</style>

ualmente.","inspection":"text-only","notes":"Referência textual para investigar depois; não conta como evidência visual de line-chart. A demo não carregou durante a inspeção."},{"id":"codrops-horizontal-parallax-demo","title":"Horizontal Parallax Gallery — demo original","url":"https://tympanus.net/Tutorials/HorizontalParallaxGallery/index.html","author":"David Faure / Codrops","kind":"visual-demo","observed":"Na demo hospedada, foram observados estados antes e depois de rolar: as imagens mudam de posição horizontal com deslocamentos relativos.","inspection":"frames-observed","notes":"Observação de estados por interação, sem revisão de playback completo. O estudo do Cortez é uma interpretação original."},{"id":"w3schools-magnifier-demo","title":"Image Magnifier Glass — demo original","url":"https://www.w3schools.com/howto/tryit.asp?filename=tryhow_js_image_magnifier_glass","author":"W3Schools","kind":"visual-demo","observed":"Na demo hospedada, a lupa circular acompanha o ponteiro e mostra uma área ampliada da mesma fotografia. O código textual consultado confirma a relação entre posição e escala.","inspection":"frames-observed","notes":"Referência do mecanismo de ampliação. O Cortez usa implementação própria controlada pelo tempo, sem interação de ponteiro no render."},{"id":"d3-line-chart-reference","title":"Line chart — referência oficial D3","url":"https://observablehq.com/@d3/line-chart/2","author":"D3 / Observable","kind":"documentation","observed":"Página oficial identificada como Line chart, com autoria D3 e visualização incorporada. A aparência e a animação não foram confirmadas nesta consulta.","inspection":"text-only","notes":"Referência documental de gráfico. Não comprova movimento nem fidelidade visual do componente; o estudo do Cortez exige revisão própria."},{"id":"gsap-drawsvg-stroke-reference","title":"DrawSVG — revelação progressiva de traços","url":"https://gsap.com/docs/v3/Plugins/DrawSVGPlugin/","author":"GSAP","kind":"documentation","observed": <script>/* Cortez Effects — deterministic, dependency-free Canvas 2D studies.

 * These are editorial demonstrations; supplied still assets are never fabricated.

(function (root) {
  'use strict';

  const IDS = Object.freeze([
    'connect-hook','gravity-drop','giant-caption','prompt-bar','storyboard','impact-icon',
    'dragged-file','editor-timeline','jiggle-delete','color-slider','color-picker',
    'cinematic-look','phone-frame','video-grid','reels-feed','video-card','comment-cta',
    'falling-comments','counter','word-highlight','punch-in','lower-third','notification',
    'cursor-click','bar-chart','map-pin','price-badge','countdown','checklist','before-after',
    'transition-flash','typewriter','hand-circle','chat','numbered-list','logo-reveal',
    'search-bar','news-ticker','social-post','progress-bar','split-screen','confetti',

  function validate(id, options={}) {

    if (options.duration!=null && (!Number.isFinite(+options.duration)||+options.duration<=0)) issues.push('duration precisa ser maior que zero');
    if (options.value!=null && !Number.isFinite(Number(options.value))) issues.push('value precisa ser numérico');
    if (options.countdownFrom!=null && (!Number.isInteger(Number(options.countdownFrom))||Number(options.countdownFrom)<1||Number(options.countdownFrom)>10)) issues.push('countdownFrom precisa ser um inteiro entre 1 e 10');

  function render(canvas,id,time,options={}) {

      bg:o.background||'#111A1D',font:o.fontFamily||'Manrope, ui-sans-serif, system-ui, sans-serif',
      text:o.text||o.title||'Uma ideia merece destaque',title:o.title||o.text||'Uma ideia merece destaque',
      subtitle:o.subtitle||'Exemplo visual • conteúdo demonstrativo', seed:Number.isFinite(+o.seed)?+o.seed:hash(id),

    ctx.save(); ctx.setTransform(width/W,0,0,height/H,0,0); ctx.clearRect(0,0,W,H);

  function rounded(ctx,x,y,w,h,r,fill,stroke,sw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2));if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.stroke()}}

  function text(c,str,x,y,size=30,color=c.fg,weight=700,align='left',maxWidth=470){const {ctx}=c;ctx.font=`${weight} ${size}px ${c.font}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;const s=fitText(ctx,String(str),maxWidth);ctx.fillText(s,x,y,maxWidth);return s}
  function fitText(ctx,s,w){if(ctx.measureText(s).width<=w)return s;while(s.length>2&&ctx.measureText(s+'…').width>w)s=s.slice(0,-2);return s+'…'}
  function wrap(c,str,x,y,w,size=25,color=c.fg,weight=600,lineH=size*1.25,maxLines=3){const words=String(str).split(/\s+/),lines=[];let cur='';c.ctx.font=`${weight} ${size}px ${c.font}`;for(const word of words){const next=cur?cur+' '+word:word;if(cur&&c.ctx.measureText(next).width>w){lines.push(cur);cur=word}else cur=next}if(cur)lines.push(cur);lines.slice(0,maxLines).forEach((s,i)=>text(c,s,x,y+i*lineH,size,color,weight,'left',w));return Math.min(lines.length,maxLines)}

  function dotGrid(c,x,y,n=3,gap=16,r=3,color=c.accent){for(let i=0;i<n;i++)circle(c.ctx,x+i*gap,y,r,color)}
  function icon(c,name,x,y,r,color=c.accent){const q=c.ctx;q.save();q.translate(x,y);q.strokeStyle=color;q.fillStyle=color;q.lineWidth=Math.max(2,r*.1);q.lineCap='round';q.lineJoin='round';if(name==='play'){q.beginPath();q.moveTo(-r*.35,-r*.48);q.lineTo(r*.48,0);q.lineTo(-r*.35,r*.48);q.closePath();q.fill()}else if(name==='check'){q.beginPath();q.moveTo(-r*.5,0);q.lineTo(-r*.12,r*.36);q.lineTo(r*.5,-r*.4);q.stroke()}else if(name==='spark'){for(let i=0;i<4;i++){q.rotate(Math.PI/4);q.beginPath();q.moveTo(-r,0);q.quadraticCurveTo(0,-r*.13,r,0);q.quadraticCurveTo(0,r*.13,-r,0);q.fill()}}else if(name==='search'){q.beginPath();q.arc(-r*.12,-r*.12,r*.5,0,Math.PI*2);q.stroke();q.beginPath();q.moveTo(r*.24,r*.24);q.lineTo(r*.65,r*.65);q.stroke()}else{q.beginPath();q.arc(0,0,r*.5,0,Math.PI*2);q.stroke()}q.restore()}
  function footer(c,label='DEMONSTRAÇÃO'){pill(c,label,36,904,{size:11,h:26,fill:'#202E31',color:'#AAB8B5'})}
  function demoBackdrop(c){const q=c.ctx;q.fillStyle=c.bg;q.fillRect(0,0,W,H);q.save();q.globalAlpha=.16;circle(q,470,105,115,c.accent);circle(q,35,790,150,c.o.secondaryAccent||'#C8E779');q.globalAlpha=.06;for(let y=0;y<H;y+=32)line(q,0,y,W,y,'#E8E6DD',.5);q.restore();text(c,'ESTUDO DE EFEITO',36,52,12,'#9DAEAA',800,'left',240)}
  function begin(c){return out(c.p/.2)}
  function wordsFor(c){return (Array.isArray(c.o.words)&&c.o.words.length?c.o.words:String(c.text).trim().split(/\s+/)).map(String)}
  function cueTime(c,index,total){const cues=c.o.wordCues;if(Array.isArray(cues)&&cues[index]!=null){const cue=cues[index];const value=typeof cue==='number'?cue:Number(cue.start??cue.time);if(Number.isFinite(value))return clamp(value/c.duration)}return total<=1?0.10:0.10+(index/Math.max(1,total-1))*.50}

  function slide(c,axis='x',distance=70){const e=begin(c);return axis==='x'?distance*(1-e):axis==='y'?distance*(1-e):0}
  function asset(c,id,x,y,w,h,fit='cover'){const img=c.assets[id];if(!img)return false;const q=c.ctx;try{const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih)return false;q.save();q.beginPath();q.roundRect(x,y,w,h,16);q.clip();if(fit==='contain'){const s=Math.min(w/iw,h/ih),dw=iw*s,dh=ih*s;q.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}else{let sx=0,sy=0,sw=iw,sh=ih;const ar=w/h,iar=iw/ih;if(iar>ar){sw=ih*ar;sx=(iw-sw)/2}else{sh=iw/ar;sy=(ih-sh)/2}q.drawImage(img,sx,sy,sw,sh,x,y,w,h)}q.restore();return true}catch(_){return false}}
  function emptyAsset(c,x,y,w,h,label='adicione uma imagem'){

    pill(c,'ASSET AUSENTE',x+12,y+12,{size:9,h:22,fill:'#29383A',color:'#D2D8D2'});

  }
  function drawIllustration(c,x,y,w,h,label){
    const q=c.ctx,baseAlpha=q.globalAlpha,key=String(label).toLowerCase().replace(/antes|depois/g,'par').replace(/[•·]/g,' ').trim(),seed=hash(`${c.seed}:${key}`),unit=(n)=>((hash(`${seed}:${n}`)%1000)/1000);
    const ui=/captura|screenshot|tela|interface|feed|quadro|cena|clipe|imagem|mídia|foto|post|vídeo|asset|reveal|zoom|parallax/i.test(label);

    q.globalAlpha=baseAlpha*.18;for(let i=0;i<5;i++){const xx=x+w*unit(`light${i}`),yy=y+h*unit(`lightY${i}`),r=Math.min(w,h)*(.16+unit(`r${i}`)*.22);const glow=q.createRadialGradient(xx,yy,0,xx,yy,r);glow.addColorStop(0,i%2?c.accent:'#C9E779');glow.addColorStop(1,'rgba(20,30,32,0)');q.fillStyle=glow;q.fillRect(xx-r,yy-r,r*2,r*2)}q.globalAlpha=baseAlpha;
    if(ui){
      // Abstract interface study: panels and glyphs only, no copied product UI.
      rounded(q,x+w*.08,y+h*.09,w*.84,h*.82,Math.max(7,Math.min(w,h)*.035),'rgba(12,20,22,.48)','rgba(230,236,225,.16)',1);
      rounded(q,x+w*.12,y+h*.15,w*.23,h*.10,5,c.accent);
      for(let i=0;i<3;i++){const yy=y+h*(.34+i*.15),ww=w*(.48+unit(`line${i}`)*.28);rounded(q,x+w*.13,yy,ww,h*.035,4,'rgba(235,239,229,.72)')}

      q.beginPath();q.moveTo(x,y+h*.66);q.lineTo(x+w*.17,y+h*(.43+unit('peak1')*.12));q.lineTo(x+w*.39,y+h*.69);q.lineTo(x+w*.63,y+h*(.4+unit('peak2')*.12));q.lineTo(x+w*.84,y+h*.64);q.lineTo(x+w,y+h*.49);q.lineTo(x+w,y+h);q.lineTo(x,y+h);q.closePath();q.fillStyle='#6D8880';q.fill();
      q.beginPath();q.moveTo(x,y+h*.78);q.lineTo(x+w*.3,y+h*.63);q.lineTo(x+w*.52,y+h*.82);q.lineTo(x+w*.76,y+h*.61);q.lineTo(x+w,y+h*.75);q.lineTo(x+w,y+h);q.lineTo(x,y+h);q.closePath();q.fillStyle='#344D4A';q.fill();
      for(let i=0;i<5;i++){const xx=x+w*(.09+i*.19),yy=y+h*(.86+unit(`ground${i}`)*.08);line(q,xx,yy,xx+w*.1,yy-h*.025,'rgba(224,231,211,.3)',1.5)}
    }

    const categories = [...new Set(effects.map(effect => effect.category))], shown = filtered();
    main.innerHTML = `<section class="intro" aria-labelledby="fx-title"><div><p class="eyebrow intro-eyebrow">BIBLIOTECA DE MOTION · ${effects.length} EFEITOS</p><h1 id="fx-title">Dê forma à<br>sua <em>mensagem.</em></h1></div><div class="intro-aside"><p>Explore estudos visuais e escolha o movimento que combina com a fala.</p><span class="intro-note"><span class="status-dot" aria-hidden="true"></span> Prévias ilustrativas · F e ID continuam escolhas do trabalho</span></div></section><section class="library" aria-label="Biblioteca de efeitos"><div class="library-toolbar"><div class="search-field">${icon('search')}<label class="sr-only" for="fx-search">Buscar efeitos</label><input id="fx-search" type="search" data-fx-search placeholder="Buscar por nome, código ou uso…" value="${escape(query)}" autocomplete="off"><kbd aria-hidden="true">/</kbd></div><div class="toolbar-actions"><button class="filter-favorite" data-fx-favorites aria-pressed="${favoritesOnly}">${icon('heart')}<span>Favoritos</span><span id="fx-favorite-count" class="count">${favorites.length}</span></button><button class="autoplay-toggle" data-fx-autoplay aria-pressed="${globalPlaying}" title="${globalPlaying ? 'Pausar' : 'Reproduzir'} prévias">${icon(globalPlaying ? 'pause' : 'play')}<span>${globalPlaying ? 'Pausar prévias' : 'Reproduzir prévias'}</span></button></div></div><div class="filter-row"><div class="categories" role="group" aria-label="Filtrar por categoria"><button data-fx-category="all" aria-pressed="${category === 'all'}">Todos<span>${effects.length}</span></button>${categories.map(name => `<button data-fx-category="${escape(name)}" aria-pressed="${category === name}">${escape(name)}<span>${effects.filter(effect => effect.category === name).length}</span></button>`).join('')}</div><span role="status" aria-live="polite">${shown.length} ${shown.length === 1 ? 'efeito' : 'efeitos'}</span></div><p class="library-hint">Cada quadro é uma ilustração de demonstração. Confira fonte e cuidados antes de usar.</p><div id="fx-grid" class="model-grid">${shown.length ? shown.map(card).join('') : `<div class="empty-state"><h2>Nenhum efeito encontrado.</h2><p>Altere a busca ou a categoria selecionada.</p><button class="button button-primary" data-fx-reset>Ver todos os efeitos ${icon('arrow')}</button></div>`}</div></section>`;
    mountVisible();
  }

  function promptFor(effect) {
    const context = getPromptContext() || {};
    const choices = [context.format && `Formato de edição: ${context.format}.`, context.identity && `Identidade visual: ${context.identity}.`].filter(Boolean).join(' ');
    const missing = [!context.format && 'formato F', !context.identity && 'identidade visual ID'].filter(Boolean);
    const selection = `Este efeito complementa o formato F e a identidade visual ID escolhidos para o trabalho. ${choices}${missing.length ? ` Antes de editar, pergunte pela escolha de ${missing.join(' e ')}; não escolha códigos automaticamente.` : ' Preserve essas escolhas.'}`;
    return `Cortez, aplique o efeito ${effect.code} — ${effect.name}. ${effect.production_note || effect.description} Sincronize com as palavras da montagem final. ${selection} Preserve originais. Logotipos só entram se eu pedir explicitamente nesta edição.`;
  }

  const favoriteButton = effect => {
    const saved = favorites.includes(effect.code);
    return `<button class="favorite-button ${saved ? 'is-favorite' : ''}" data-fx-favorite="${escape(effect.code)}" aria-pressed="${saved}" aria-label="${saved ? 'Remover' : 'Salvar'} ${escape(effect.name)} ${saved ? 'dos' : 'nos'} favoritos" title="${saved ? 'Remover dos favoritos' : 'Salvar nos favoritos'}">${icon('heart')}</button>`;
  };
  const card = effect => {
    const on = isPlaying(effect.code);
    return `<article class="model-card fx-card" data-fx-card="${escape(effect.code)}"><div class="media fx-media"><div class="media-stage"><canvas data-fx-canvas="${escape(effect.code)}" aria-label="Prévia ilustrativa: ${escape(effect.name)}"></canvas></div><a class="media-open" href="#efeito=${encodeURIComponent(effect.code)}" aria-label="Ver detalhes de ${escape(effect.name)}"></a><span class="media-label"><strong class="preview-code">${escape(effect.code)}</strong><span>${escape(effect.status_label || 'Estudo')}</span></span><div class="media-controls"><button class="icon-button" data-fx-play="${escape(effect.code)}" aria-label="${on ? 'Pausar' : 'Reproduzir'} prévia" title="${on ? 'Pausar' : 'Reproduzir'} prévia">${icon(on ? 'pause' : 'play')}</button></div><span class="media-expand" aria-hidden="true">${icon('expand')} Ver efeito</span></div><div class="card-code-row"><strong class="model-code">${escape(effect.code)}</strong><button class="quick-code-copy" data-fx-copy="${escape(effect.code)}">${icon('copy')}<span>Copiar pedido</span></button></div><div class="card-heading"><div><span class="eyebrow">${escape(effect.category)}</span><h2><a href="#efeito=${encodeURIComponent(effect.code)}">${escape(effect.name)}</a></h2></div>${favoriteButton(effect)}</div><p class="card-description">${escape(effect.description)}</p><div class="card-bottom"><a class="card-action" href="#efeito=${encodeURIComponent(effect.code)}">Ver efeito ${icon('arrow')}</a><span class="evidence-badge">${escape(effect.status_label || 'Estudo')}</span></div></article>`;
  };
  function filtered() {
    const terms = normalize(query).trim().split(/\s+/).filter(Boolean);
    return effects.filter(effect => (category === 'all' || effect.category === category) && (!favoritesOnly || favorites.includes(effect.code)) && terms.every(term => normalize([effect.code, effect.id, effect.name, effect.category, effect.description, effect.use_when, effect.caution].join(' ')).includes(term)));
  }

  function referenceMarkup(effect) {
    return (effect.reference_ids || []).map(id => {
      const ref = refFor(id);
      if (!ref || ref.visibility === 'internal' || ref.local_path || !safeUrl(ref.url || ref.href)) return '';
      const href = safeUrl(ref.url || ref.href), label = inspectionLabels[ref.inspection] || 'Referência documental';
      return `<div class="fx-source"><span class="eyebrow">${escape(label)}</span>${href ? `<a href="${escape(href)}" target="_blank" rel="noopener noreferrer">${escape(ref.title || ref.name || id)} ↗</a>` : `<strong>${escape(ref.title || ref.name || id)}</strong>`}<span>${escape(ref.observed || ref.notes || 'A referência contextualiza o efeito; não comprova o resultado desta demonstração.')}</span></div>`;
    }).join('') || '<p>Nenhuma referência pública vinculada a este efeito.</p>';
  }
  function detail(code) {
    activate();
    const effect = find(code);
    if (!effect) { current = null; main.innerHTML = `<div class="empty-state"><h1>Esse efeito não está na biblioteca.</h1><a href="#efeitos" class="button button-primary">Ver efeitos ${icon('arrow')}</a></div>`; return; }
    current = effect;
    const prompt = promptFor(effect), on = isPlaying(effect.code);
    main.innerHTML = `<div class="detail-top"><a href="#efeitos" class="text-link">${icon('back')} Voltar à biblioteca</a><span class="eyebrow">${escape(effect.code)} / ${escape(effect.status_label || 'ESTUDO')}</span></div><div class="detail-layout fx-detail-layout"><div class="detail-left"><div class="media detail-media fx-detail-media"><div class="media-stage"><canvas data-fx-canvas="${escape(effect.code)}" aria-label="Prévia ilustrativa: ${escape(effect.name)}"></canvas></div><span class="media-label"><strong class="preview-code">${escape(effect.code)}</strong><span>DEMONSTRAÇÃO</span></span></div><div class="fx-player"><button class="button button-outline" data-fx-toggle aria-pressed="${on}">${icon(on ? 'pause' : 'play')} ${on ? 'Pausar' : 'Reproduzir'}</button><button class="button button-outline" data-fx-restart>${icon('arrow')} Reiniciar</button><label>Momento<input data-fx-scrub type="range" min="0" max="${durationOf(effect)}" step="0.01" value="${on ? 0 : stillTime(effect)}" aria-label="Posição da prévia"></label></div><p class="reference-caption">${escape(effect.evidence || library.demo_notice || 'Demonstração ilustrativa.')}</p></div><div class="detail-content"><div class="detail-title"><div><span class="eyebrow">${escape(effect.category)} · ${escape(effect.code)}</span><h1 tabindex="-1">${escape(effect.name)}</h1></div>${favoriteButton(effect)}</div><p class="detail-lead">${escape(effect.description)}</p><div class="model-fit"><h2>Quando funciona</h2><p>${escape(effect.use_when || 'Use quando o movimento reforçar uma ideia da fala.')}</p></div><div class="model-fit fx-caution"><h2>Cuidados</h2><p>${escape(effect.caution || 'Revise a leitura e a posição na montagem final.')}</p></div><div class="format-facts">${originLabels[effect.origin] ? `<div><span>Origem</span><strong>${escape(originLabels[effect.origin])}</strong></div>` : ''}<div><span>Aplicação</span><strong>${escape(supportLabels[effect.production_support] || 'Revisão editorial')}</strong></div></div><div class="model-fit"><h2>Fontes e referências</h2><div class="fx-sources">${referenceMarkup(effect)}</div></div><label class="fx-edit-label" for="fx-demo-text">Texto de demonstração</label><textarea id="fx-demo-text" data-fx-text rows="2">${escape(effect.demo.text || effect.demo.title || '')}</textarea><label class="fx-edit-label" for="fx-demo-accent">Cor de demonstração</label><input id="fx-demo-accent" data-fx-accent type="color" value="${PALETTE.accent}"><div class="prompt-area"><p>O pedido combina este efeito às escolhas atuais de F e ID.</p><button class="button button-primary" data-fx-copy-prompt>${icon('copy')} Copiar pedido</button><textarea data-fx-prompt readonly aria-label="Pedido completo para copiar">${escape(prompt)}</textarea></div></div></div>`;
    mountVisible();
  }

  function updateFavorites(code) {
    favorites = favorites.includes(code) ? favorites.filter(value => value !== code) : [...favorites, code];
    try { storage.setItem(FAVORITES_KEY, JSON.stringify(favorites)); } catch { notify('Não foi possível salvar os favoritos neste navegador.'); }
    if (current?.code === code) detail(code);
    else if (favoritesOnly && !favorites.includes(code)) gallery();
    else {
      const old = main.querySelector(`[data-fx-card="${CSS.escape(code)}"]`), effect = find(code);
      if (old && effect) { const holder = document.createElement('div'); holder.innerHTML = card(effect); old.replaceWith(holder.firstElementChild); mountVisible(); }
      const count = main.querySelector('#fx-favorite-count'); if (count) count.textContent = String(favorites.length);
    }
  }
  function onInput(event) {
    if (event.target.matches('[data-fx-search]')) {
      query = event.target.value;
      const position = event.target.selectionStart;
      gallery();
      const input = main.querySelector('[data-fx-search]'); input?.focus(); input?.setSelectionRange(position, position);
    } else if (event.target.matches('[data-fx-text],[data-fx-accent]') && current) {
      const canvas = main.querySelector('[data-fx-canvas]'), item = active.get(canvas);
      if (canvas) renderFrame(canvas, current, item?.time ?? stillTime(current), demoOptions(current));
    } else if (event.target.matches('[data-fx-scrub]') && current) {
      const canvas = main.querySelector('[data-fx-canvas]'), item = active.get(canvas), time = Number(event.target.value);
      if (item) { item.running = false; item.time = time; }
      overrides.set(current.code, false);
      if (canvas) renderFrame(canvas, current, time, demoOptions(current));
      if (![...active.values()].some(value => value.running)) cancelLoop();
      updatePlaybackButtons();
    }
  }
  async function onClick(event) {
    const target = event.target.closest('[data-fx-category],[data-fx-favorites],[data-fx-autoplay],[data-fx-favorite],[data-fx-copy],[data-fx-copy-prompt],[data-fx-play],[data-fx-reset],[data-fx-toggle],[data-fx-restart]');
    if (!target || !main.contains(target)) return;
    if (target.hasAttribute('data-fx-category')) { category = target.dataset.fxCategory; gallery(); }
    else if (target.hasAttribute('data-fx-favorites')) { favoritesOnly = !favoritesOnly; gallery(); }
    else if (target.hasAttribute('data-fx-autoplay')) {
      globalPlaying = !globalPlaying; overrides.clear();
      for (const [canvas, item] of active) {
        item.running = globalPlaying; item.time = globalPlaying ? 0 : stillTime(item.effect); item.started = globalPlaying ? performance.now() : 0;
        if (!globalPlaying) renderFrame(canvas, item.effect, item.time, canvas.closest('.fx-detail-media') ? demoOptions(item.effect) : {});
      }
      if (globalPlaying) scheduleLoop(); else cancelLoop();
      const button = main.querySelector('[data-fx-autoplay]'); if (button) { button.setAttribute('aria-pressed', String(globalPlaying)); button.title = `${globalPlaying ? 'Pausar' : 'Reproduzir'} prévias`; button.innerHTML = `${icon(globalPlaying ? 'pause' : 'play')}<span>${globalPlaying ? 'Pausar prévias' : 'Reproduzir prévias'}</span>`; }
      updatePlaybackButtons();
    } else if (target.hasAttribute('data-fx-favorite')) updateFavorites(target.dataset.fxFavorite);
    else if (target.hasAttribute('data-fx-copy') || target.hasAttribute('data-fx-copy-prompt')) {
      const field = target.hasAttribute('data-fx-copy-prompt') ? main.querySelector('[data-fx-prompt]') : null;
      const effect = find(target.dataset.fxCopy || target.closest('[data-fx-copy-prompt]')?.dataset.fxCopyPrompt || current?.code);
      if (effect) { const text = field ? field.value : promptFor(effect); await copyText(text, field); }
    } else if (target.hasAttribute('data-fx-play')) setPlayback(target.dataset.fxPlay, !isPlaying(target.dataset.fxPlay));
    else if (target.hasAttribute('data-fx-reset')) { query = ''; category = 'all'; favoritesOnly = false; gallery(); }
    else if (target.hasAttribute('data-fx-toggle') && current) setPlayback(current.code, !isPlaying(current.code));
    else if (target.hasAttribute('data-fx-restart') && current) setPlayback(current.code, true, { restart: true });
  }
  function onKeydown(event) {
    if (event.key !== '/' || event.metaKey || event.ctrlKey || event.altKey) return;
    const target = event.target;
    if (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)) return;
    const input = main.querySelector('[data-fx-search]');
    if (input) { event.preventDefault(); input.focus(); }
  }
  function onVisibility() {
    if (document.hidden) cancelLoop();
    else { for (const item of active.values()) if (item.running) item.started = performance.now() - item.time * 1000; scheduleLoop(); }
  }
  function onReducedMotion(event) {
    globalPlaying = !event.matches; overrides.clear();
    for (const [canvas, item] of active) {
      item.running = globalPlaying; item.time = globalPlaying ? 0 : stillTime(item.effect); item.started = globalPlaying ? performance.now() : 0;
      if (!globalPlaying) renderFrame(canvas, item.effect, item.time, canvas.closest('.fx-detail-media') ? demoOptions(item.effect) : {});
    }
    if (globalPlaying) scheduleLoop(); else cancelLoop();
    updatePlaybackButtons();
    const button = main.querySelector('[data-fx-autoplay]');
    if (button) { button.setAttribute('aria-pressed', String(globalPlaying)); button.title = `${globalPlaying ? 'Pausar' : 'Reproduzir'} prévias`; button.innerHTML = `${icon(globalPlaying ? 'pause' : 'play')}<span>${globalPlaying ? 'Pausar prévias' : 'Reproduzir prévias'}</span>`; }
  }
  return {
    gallery,
    detail,
    destroy() { destroyed = true; deactivate(); }
  };
}

const main=document.querySelector('main');
const library=JSON.parse(document.getElementById('catalog-data').textContent);
const references=JSON.parse(document.getElementById('reference-data').textContent);
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let storage;try{storage=localStorage}catch{storage={getItem:()=>null,setItem:()=>{}}}
let toastTimer;
function notify(message){const toast=document.getElementById('toast');toast.textContent=message;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true},4000)}
async function copyText(text,fallback){try{await navigator.clipboard.writeText(text);notify('Copiado. Cole o pedido na conversa com o Cortez.')}catch{const previous=document.activeElement;const input=fallback||document.createElement('textarea');input.value=text;if(!fallback){input.style.cssText='position:fixed;left:-9999px';document.body.append(input)}input.focus();input.select();let copied=false;try{copied=document.execCommand('copy')}catch{}if(!fallback)input.remove();previous?.focus({preventScroll:true});notify(copied?'Pedido copiado.':'Selecione o pedido e copie para a conversa.')}}
const view=createEffectsView({main,library,references,notify,copyText,storage,reducedMotion,icon});
function route(){view.destroy();if(location.hash.startsWith('#efeito='))view.detail(location.hash.slice('#efeito='.length));else view.gallery();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);window.addEventListener('pagehide',()=>view.destroy());
route();
</script>
</body></html>
