const card=new THREE.Mesh(new THREE.PlaneGeometry(250,444),new THREE.MeshBasicMaterial({map:TX.raw,transparent:true,alphaMap:roundMask(125,222,12),depthWrite:false}));
card.visible=false; S.add(card);
const cardEdge=new THREE.Mesh(ring(250,444,14,3),new THREE.MeshBasicMaterial({color:goldC,transparent:true,opacity:.9,depthWrite:false})); card.add(cardEdge); cardEdge.position.z=.5;

// ---------- desenho das telas internas (2D, deterministas) ----------
const VENV=DATA.venv, MENV=DATA.menv, ER=DATA.envRate;
function envAt(arr,t){ const i=Math.floor(t*ER); return (i<0||i>=arr.length)?0:arr[i]; }
function drawAnim(L,p,alpha,t,pop){ const g=L.g; g.clearRect(0,0,CW,CH); L.t.needsUpdate=true; if(alpha<=0.001) return; g.save(); g.globalAlpha=alpha;
  const x0=86,x1=634,y0=470,y1=150;
  g.strokeStyle='rgba(185,198,211,.18)'; g.lineWidth=2; for(let k=0;k<=4;k++){ const y=y1+(y0-y1)*k/4; g.beginPath(); g.moveTo(x0,y); g.lineTo(x1,y); g.stroke(); }
  for(let k=0;k<=6;k++){ const x=x0+(x1-x0)*k/6; g.beginPath(); g.moveTo(x,y1-10); g.lineTo(x,y0+10); g.stroke(); }
  const B=(u,a,b,c,d)=>{ const v=1-u; return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d; };
  const P=(u)=>[B(u,x0,x0+260,x1-260,x1),B(u,y0,y0,y1,y1)];

  g.strokeStyle=GOLD; g.lineWidth=9; g.beginPath(); for(let k=0;k<=n;k++){ const q=P(k/N); k?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]); } g.stroke();
  [[0,0],[0.5,0.18],[1,0.36]].forEach(([u,d])=>{ if(p<u-0.02) return; const s=1+0.6*Math.exp(-Math.pow((p-u-0.05)/0.06,2))*pop; const [x,y]=P(u);
    g.save(); g.translate(x,y); g.rotate(Math.PI/4); g.fillStyle=INK; g.strokeStyle=GOLD2; g.lineWidth=4; g.fillRect(-13*s,-13*s,26*s,26*s); g.strokeRect(-13*s,-13*s,26*s,26*s); g.restore(); });
  if(p>=0.999){ const u=(t*0.42)%1, e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2; const [x,y]=P(e); g.fillStyle=GOLD; g.beginPath(); g.arc(x,y,17,0,Math.PI*2); g.fill();
    g.fillStyle='rgba(244,206,101,.25)'; g.beginPath(); g.arc(x,y,34,0,Math.PI*2); g.fill(); }
  g.font='700 26px Inter'; g.fillStyle=MUTED; g.fillText('POSIÇÃO',x0,y1-36); g.fillStyle=GOLD; g.fillText('EASE IN-OUT',x1-190,y1-36);
  g.restore(); L.t.needsUpdate=true; }
function drawCaption(L,cap,t,alpha){ const g=L.g; g.clearRect(0,0,CW,CH); L.t.needsUpdate=true; if(alpha<=0.001||!cap) return; g.save(); g.globalAlpha=alpha;
  g.font='800 62px Inter'; g.textAlign='left'; g.textBaseline='alphabetic';
  const lines=cap.lines; const lh=76, top=880-((lines.length-1)*lh)/2;
  lines.forEach((ln,li)=>{ const ws=ln.map(w=>w.w); const full=ws.join(' '); const tw=g.measureText(full).width; let x=(CW-tw)/2; const y=top+li*lh;
    ln.forEach(w=>{ const on=t>=w.s-0.02; const k=clamp((t-w.s+0.02)/0.12,0,1); const s=on?1+0.12*(1-k):1;
      g.save(); g.globalAlpha=alpha*(on?1:0.16); const wd=g.measureText(w.w).width; g.translate(x+wd/2,y); g.scale(s,s);
      g.fillStyle='rgba(2,4,4,.55)'; g.fillText(w.w,-wd/2+3,5); g.fillStyle=w.k?GOLD:INK; g.fillText(w.w,-wd/2,0); g.restore();
      x+=wd+g.measureText(' ').width; }); });
  g.restore(); L.t.needsUpdate=true; }
function tc(t){ const f=Math.floor(t*30+1e-6); const s=Math.floor(f/30), fr=f%30; return '00:'+String(s).padStart(2,'0')+':'+String(fr).padStart(2,'0'); }
function drawBars(L,arr,t,alpha,y,h,hot,label){ const g=L.g; g.clearRect(0,0,CW,CH); L.t.needsUpdate=true; if(alpha<=0.001) return; g.save(); g.globalAlpha=alpha;
  const bw=5, gap=4, step=bw+gap, n=Math.floor(CW/step)+2, cx=360, rate=25;
  for(let k=0;k<n;k++){ const x=k*step-((t*rate*step)%step); const tt=t+(x-cx)/(rate*step); const v=Math.max(0.04,envAt(arr,tt)); const bh=v*h;
    g.fillStyle=(tt<=t)?hot:'rgba(185,198,211,.32)'; g.fillRect(x,y-bh/2,bw,bh); }
  g.fillStyle=INK; g.fillRect(cx-1.5,y-h/2-26,3,h+52);
  g.font='700 24px Inter'; g.fillStyle=MUTED; g.fillText(label,40,y-h/2-38); g.fillStyle=GOLD; g.textAlign='right'; g.fillText(tc(t),CW-40,y-h/2-38);
  g.restore(); L.t.needsUpdate=true; }

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.ready, document.fonts.load('800 62px Inter'), document.fonts.load('700 30px Inter')];
  Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  READY=Promise.all(jobs).then(()=>{ LAYERS.forEach((g,i)=>{ g.userData.tag.material.map=tagTex(...NAMES[i]); }); drawPh(); BUILT=true; }); return READY; }

function capAt(t){ const cs=DATA.l3; for(let i=cs.length-1;i>=0;i--) if(t>=cs[i].s-0.05) return cs[i]; return cs[0]; }

function render(t){
  const ex=T.explode, CO=T.col, FU=T.full, CT=T.cta0;
  // ----- espaçamento das camadas (explode com mola, colapsa no "pronto", reabre no fundo do CTA)
  let sp=230*spring((t-ex)/1.0);
  sp*=1-eio((t-CO)/(FU-CO-0.05));
  sp+=170*eio((t-CT-0.1)/1.1);
  // ----- câmera (órbita em volta da pilha)
  const st={yaw:0,pitch:0,dist:D*0.82,ty:118,tx:0};
  const mix=(s,u)=>{ for(const k in s) st[k]=lerp(st[k],s[k],u); };
  mix({yaw:.42,pitch:.11,dist:D*1.0,ty:-50,tx:-60},eio((t-ex)/0.95));
  mix({yaw:.50,pitch:.09,dist:D*0.97,ty:-50,tx:-60},sm(T.cortez,T.voz,t));
  mix({yaw:.36,pitch:.07,dist:D*0.98,ty:-50,tx:-40},eio((t-T.voz+0.1)/0.7));
  mix({yaw:.44,pitch:.10,dist:D*1.0,ty:-50,tx:-50},eio((t-T.corte0)/0.45));
  mix({yaw:.54,pitch:.13,dist:D*1.05,ty:-50,tx:-60},eio((t-T.fiz0)/0.7));
  mix({yaw:.30,pitch:.06,dist:D*0.98,ty:-60,tx:-50},eio((t-T.seus)/0.9));
  mix({yaw:.14,pitch:.05,dist:D*1.0,ty:-110,tx:-20},eio((t-T.pasta)/0.6));
  mix({yaw:.44,pitch:.10,dist:D*1.0,ty:-50,tx:-60},eio((t-T.fill)/0.6));
  mix({yaw:0,pitch:0,dist:D*LH/1920,ty:0,tx:0},eio((t-CO)/(FU-CO)));
  mix({yaw:.50,pitch:.12,dist:D*1.15,ty:-60,tx:-60},eio((t-CT-0.1)/1.2));
  const yaw=st.yaw+0.035*Math.sin(t*0.45)*sm(ex,ex+1,t)*(1-sm(CO-0.3,CO,t)), pitch=st.pitch;
  const tgt=new THREE.Vector3(st.tx,st.ty,0);
  C.position.set(tgt.x+st.dist*Math.sin(yaw)*Math.cos(pitch), tgt.y+st.dist*Math.sin(pitch), tgt.z+st.dist*Math.cos(yaw)*Math.cos(pitch)); C.lookAt(tgt);
  // ----- estados de conteúdo
  const empty=sm(T.seus,T.seus+0.4,t);                      // camadas esvaziam para o "seu vídeo"
  const dim=win(t,T.pasta,T.fill+0.15,0.35);                  // pilha recua enquanto a pasta aparece
  const fade=1-sm(FU-0.55,FU-0.1,t);                          // camadas de cima somem no remonte final
  const ctaDim=1-0.62*sm(CT,CT+0.8,t);
  const back=Math.max(fade,0.8*sm(CT+0.2,CT+1.0,t));         // molduras vazias voltam no fundo do CTA
  // pull-outs (camada sai da pilha para ser "editada")
  const pulls=[Math.min(1,win(t,T.corte0,T.legenda0,0.32)+0.45*win(t,T.seus+0.1,T.grava+0.15,0.45)+0.6*win(t,T.grava,T.pasta+0.2,0.3)), win(t,T.anim0,T.fiz0,0.3), win(t,T.legenda0,T.anim0,0.3), win(t,T.voz,T.corte0,0.4), 0];
  const fills=[T.fill, T.fill+0.28, T.fill+0.56, T.fill+0.84, T.fill+1.12];
  const toCam=C.position.clone().sub(tgt).normalize(), spot=tgt.clone().addScaledVector(toCam,760).add(new THREE.Vector3(0,40,0));
  LAYERS.forEach((g,i)=>{ const k=i-2; const pu=pulls[i]; const e=sp/220;
    const base=new THREE.Vector3(-k*44*e, k*40*e, k*sp);
    g.position.copy(base).lerp(spot,eio(pu)); g.rotation.set(-pitch*0.6*eio(pu),yaw*eio(pu),0); g.scale.setScalar(1-0.06*eio(pu));
    const u=g.userData; const flash=gauss(t,T.fiz+0.06,0.12)+gauss(t,fills[i]+0.05,0.1)*sm(T.fill-0.1,T.fill,t)+0.6*gauss(t,ex+0.25,0.18);
    u.edge.material.opacity=clamp((0.45+0.55*pu+0.6*flash)*(1-0.6*dim),0,1)*(i===0?1-sm(CO,FU-0.1,t)+sm(CT,CT+0.8,t):back)*ctaDim;
    u.tag.material.opacity=clamp((sp-40)/120,0,1)*(1-0.6*dim)*ctaDim*(1-sm(CO-0.2,CO+0.2,t)+sm(CT+0.4,CT+1,t));
    u.panel.material.opacity=(i===0?1:0.30+0.62*eio(pu))*(1-0.5*dim)*(i===0?1:back)*ctaDim;
    const ord=(i+10*eio(pu))*4; g.renderOrder=ord; u.panel.renderOrder=ord; u.content.renderOrder=ord+1; u.edge.renderOrder=ord+2; u.tag.renderOrder=ord+3; if(i===0) ph.renderOrder=ord+1.5; });
  // camada 01 — cenas: apresentador → corte → cena do escritório; vazia; gravação bruta; vídeo final
  let ta=TX.sa, tb=TX.sb, wipe=-1, alpha=1;
  sceneMat.uniforms.rad.value=26*(1-sm(CO,FU,t))+26*sm(CT,CT+0.6,t);
  setFrame(TX.sa, loopOf('sa',t,0)); setFrame(TX.sb, loopOf('sb',t,T.corte));
  if(t>=T.corte) wipe=eio((t-T.corte)/0.3)*1.02;
  alpha*=1-empty;
  if(t>=T.grava-0.3){ ta=TX.raw; setFrame(TX.raw, loopOf('raw',t,T.grava)); tb=t>=T.fill?TX.fin:TX.raw; wipe=-1; alpha=sm(T.grava-0.05,T.grava+0.25,t); }
  if(t>=T.fill){ setFrame(TX.fin, frameOf('fin',t,T.fill)); wipe=eio((t-T.fill)/0.32)*1.02; alpha=1; }
  ph.material.opacity=sm(T.seus+0.15,T.seus+0.55,t)*(1-sm(T.grava-0.15,T.grava+0.2,t))*(1-0.5*dim);
  sceneMat.uniforms.ta.value=ta; sceneMat.uniforms.tb.value=tb; sceneMat.uniforms.wipe.value=wipe; sceneMat.uniforms.alpha.value=alpha*(1-0.55*dim)*(1-0.7*sm(CT,CT+0.8,t));
  // camada 02 — animação (curva de keyframes; redesenha no "cada animação"; some no "seu vídeo"; volta no preenchimento)
  let p=1; if(t>=T.anim0-0.1) p=t<T.anim ? 1-sm(T.anim0-0.1,T.anim0+0.05,t) : eio((t-T.anim)/0.6);
  let aA=1-empty; if(t>=fills[1]){ p=eio((t-fills[1])/0.5); aA=1; }
  drawAnim(CAN[1],p,aA*fade*(1-0.55*dim),t,1);
  // camada 03 — legenda deste vídeo (palavra por palavra)
  let aL=1-empty; if(t>=fills[2]) aL=sm(fills[2],fills[2]+0.2,t);
  drawCaption(CAN[2],capAt(t),t,aL*fade*(1-0.55*dim));
  // camadas 04/05 — voz de IA e trilha (ondas reais, cabeça de leitura no centro)
  let aV=1-empty; if(t>=fills[3]) aV=sm(fills[3],fills[3]+0.2,t);
  drawBars(CAN[3],VENV,t,aV*fade*(1-0.55*dim),lerp(1060,840,eio(pulls[3])),lerp(130,300,eio(pulls[3])),GOLD,'VOZ GERADA POR IA');
  let aM=1-empty; if(t>=fills[4]) aM=sm(fills[4],fills[4]+0.2,t);
  drawBars(CAN[4],MENV,t,aM*fade*(1-0.55*dim),1190,70,'rgba(244,206,101,.75)','TRILHA');
  // pasta + cartão da gravação bruta
  const fv=win(t,T.pasta-0.15,T.fill+0.1,0.45); folder.visible=fv>0.002;
  if(folder.visible){ folder.position.set(50,lerp(-1600,-330,fv),560); folder.rotation.set(-0.14,0.10+0.08*(1-fv),0); folder.scale.setScalar(1.3);
    const shut=eio((t-T.drop-0.05)/0.3); folder.userData.fr.rotation.x=lerp(0.5,0,shut); }
  const cu=clamp((t-T.pasta)/(T.drop-T.pasta),0,1); card.visible=t>=T.pasta && t<T.drop+0.12;
  if(card.visible){ const a=eio(cu); const p0=LAYERS[0].position.clone(), p2=new THREE.Vector3(50,-330+20,546);
    const p1=new THREE.Vector3(160,260,520); const v=1-a; card.position.set(v*v*p0.x+2*v*a*p1.x+a*a*p2.x, v*v*p0.y+2*v*a*p1.y+a*a*p2.y, v*v*p0.z+2*v*a*p1.z+a*a*p2.z);
    card.scale.setScalar(lerp(2.0,0.8,a)); card.rotation.set(lerp(0,-0.5,a),lerp(-0.2,0.25,a),lerp(0,0.2,a)); setFrame(TX.raw, loopOf('raw',t,T.grava));
    card.material.opacity=1-sm(T.drop-0.04,T.drop+0.1,t); cardEdge.material.opacity=card.material.opacity*.9; }
  // foco e brilho
  const subj=new THREE.Vector3(); if(pulls[0]>0.5) LAYERS[0].getWorldPosition(subj); else if(pulls[3]>0.5) LAYERS[3].getWorldPosition(subj);
  else if(pulls[2]>0.5) LAYERS[2].getWorldPosition(subj); else if(pulls[1]>0.5) LAYERS[1].getWorldPosition(subj); else subj.copy(tgt);
  if(folder.visible && fv>0.5) folder.getWorldPosition(subj);
  bokeh.uniforms.focus.value=C.position.distanceTo(subj);
  bokeh.uniforms.aperture.value=0.0000045*sm(ex,ex+0.8,t)*(1-sm(CO-0.2,CO+0.3,t))+0.0000035*sm(CT+0.2,CT+1,t);
  bloom.strength=0.12+0.16*gauss(t,T.fiz+0.06,0.14)+0.12*gauss(t,ex+0.25,0.2);
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!BUILT){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
