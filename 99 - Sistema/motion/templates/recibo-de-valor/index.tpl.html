  plL=plinth(PX,560,'CORTEZ','#D6B46A'); plR=plinth(560,520,'EDITOR POR FORA','#B6B09F');

  // ---------- impressora do Cortez + recibo ----------
  printer=new THREE.Group(); printer.position.set(PX,-275,0); S.add(printer);
  const pb=new THREE.Mesh(new RoundedBoxGeometry(440,110,300,5,18),BLACK); pb.castShadow=true; pb.receiveShadow=true; printer.add(pb);
  const trim=new THREE.Mesh(new RoundedBoxGeometry(446,12,306,2,5),GOLD); trim.position.y=50; printer.add(trim);
  const slot=new THREE.Mesh(new THREE.PlaneGeometry(PW+30,14),new THREE.MeshBasicMaterial({color:0x050505})); slot.rotation.x=-Math.PI/2; slot.position.set(0,56.5,-20); printer.add(slot);
  const led=new THREE.Mesh(new THREE.CircleGeometry(6,24),new THREE.MeshBasicMaterial({color:0xD6B46A,toneMapped:false})); led.position.set(170,10,150.6); printer.add(led);
  // recibo: o conteúdo (de cima para baixo) sobe da fenda; linha nova aparece rente à impressora
  LINES={}; const y0={v:0};
  const rt=ctex(PW*2,PH*2,(g,w,h)=>{ paperBg(g,w,h,'#f1ebdd'); g.scale(2,2); const W=PW;
    // borda serrilhada no topo
    g.fillStyle='#121110'; g.beginPath(); g.moveTo(0,0); for(let x=0;x<=W;x+=12){ g.lineTo(x,0); g.lineTo(x+6,7); } g.lineTo(W,0); g.closePath(); g.fill();
    const ink='#1c1a16', gold='#a8833a';
    const dash=(y)=>{ g.strokeStyle='rgba(28,26,22,.55)'; g.lineWidth=1.4; g.setLineDash([6,6]); g.beginPath(); g.moveTo(22,y); g.lineTo(W-22,y); g.stroke(); g.setLineDash([]); };
    g.fillStyle=ink; g.font=`700 46px ${SERIF}`; g.textAlign='center'; g.fillText('Cortez',W/2,74); g.textAlign='left';
    g.font=`500 12.5px ${MONO}`; g.fillStyle='rgba(28,26,22,.75)'; spaced(g,'O AGENTE QUE EDITA SEUS VÍDEOS',W/2,100,2.2,'center'); LINES.head=118;
    dash(124); g.fillStyle=gold; g.font=`500 15px ${MONO}`; spaced(g,'O QUE ELE ENTREGA',24,154,3.5,'left'); LINES.sub=166;
    const items=['Corta silêncios e erros','Limpa o áudio','Legendas','Pesquisa as cenas','Música e efeitos','Animações','Vídeo longo e cortes'];
    LINES.items=[]; items.forEach((it,i)=>{ const y=194+i*40; g.fillStyle=ink; g.font=`500 19px ${MONO}`; g.fillText(it,24,y);
      const tw=g.measureText(it).width; g.fillStyle='rgba(28,26,22,.35)'; for(let x=24+tw+10;x<W-50;x+=9) g.fillRect(x,y-4,2.2,2.2);
      g.fillStyle=gold; g.font=`700 22px ${SANS}`; g.fillText('✓',W-44,y+1); LINES.items.push(y+14); });
    dash(476); LINES.d1=482;
    g.fillStyle=ink; g.font=`700 27px ${SERIF}`; g.fillText('Só a edição',24,528); g.fillStyle=gold; g.font=`700 24px ${SANS}`; g.fillText('✓',W-46,527); LINES.only=548; LINES.onlyY=518;
    dash(564);
    g.fillStyle=ink; g.font=`500 17px ${MONO}`; spaced(g,'+ OUTRAS FERRAMENTAS',24,602,1.5,'left'); g.fillStyle=gold; g.font=`700 22px ${SANS}`; g.fillText('✓',W-44,603); LINES.others=620;
    dash(636);
    g.fillStyle='rgba(28,26,22,.8)'; g.font=`500 11.5px ${MONO}`; spaced(g,'VOCÊ GRAVA · O CORTEZ EDITA · VOCÊ APROVA',W/2,666,1.6,'center');
    g.strokeStyle=gold; g.lineWidth=1.4; g.beginPath(); g.moveTo(70,690); g.lineTo(W-70,690); g.moveTo(70,695); g.lineTo(W-70,695); g.stroke(); LINES.foot=712; });
  rt.anisotropy=16;
  paperMat=new THREE.MeshStandardMaterial({map:rt,color:0xcfc8b9,roughness:.9,metalness:0,side:THREE.DoubleSide,clippingPlanes:[new THREE.Plane(new THREE.Vector3(0,1,0),-SLOT_Y)]});
  paperMat.onBeforeCompile=(sh)=>{ sh.uniforms.uSlot={value:SLOT_Y}; sh.vertexShader='uniform float uSlot;\n'+sh.vertexShader.replace('#include <begin_vertex>',
    '#include <begin_vertex>\n vec4 wp0=modelMatrix*vec4(transformed,1.0); float hh=max(0.0,wp0.y-uSlot); transformed.z += -0.00011*hh*hh - 0.012*hh; transformed.x += 6.0*sin(hh/260.0);'); };
  paper=new THREE.Mesh(new THREE.PlaneGeometry(PW,PH,1,90),paperMat); paper.castShadow=true; paper.position.set(PX,SLOT_Y-PH/2,-20); S.add(paper);
  marker=new THREE.Mesh(new THREE.PlaneGeometry(PW-34,40),new THREE.MeshBasicMaterial({color:0xD6B46A,transparent:true,opacity:.42,depthWrite:false,toneMapped:false,clippingPlanes:paperMat.clippingPlanes}));
  marker.renderOrder=2; S.add(marker);

  // ---------- polaroides (entregas reais editadas pelo Cortez) ----------
  const pola=(seq,label)=>{ const g=new THREE.Group(); S.add(g); const W=232,H=412,B=14,BB=58;
    const fr=ctex((W+2*B)*2,(H+B+BB)*2,(c,w,h)=>{ paperBg(c,w,h,'#f4efe4'); c.fillStyle='#1c1a16'; c.font=`500 26px ${MONO}`; spaced(c,label,w/2,h-44,4,'center'); });
    const m=new THREE.Mesh(new THREE.BoxGeometry(W+2*B,H+B+BB,3),[PAPERSIDE,PAPERSIDE,PAPERSIDE,PAPERSIDE,new THREE.MeshStandardMaterial({map:fr,color:0xc8c2b4,roughness:.9,transparent:true}),PAPERSIDE]);
    m.castShadow=true; g.add(m);
    const tx=videoTex(); const v=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshBasicMaterial({map:tx,toneMapped:false,transparent:true}));
    v.position.set(0,(BB-B)/2,1.8); g.add(v); g.userData={tx,seq,mats:[m.material[4],v.material]}; polas.push(g); return g; };
  pola('pA','EDITADO PELO CORTEZ');

  // ---------- notas do editor por fora ----------
  const SERV=['EDIÇÃO','CORTES','LEGENDAS','CENAS','TRILHA','ANIMAÇÃO','CORREÇÕES','VÍDEO LONGO'];
  const sheetTex=(name)=>ctex(800,600,(c,w,h)=>{ paperBg(c,w,h,'#ece6d8'); c.fillStyle='#5b5346'; c.font=`500 26px ${MONO}`; spaced(c,'NOTA · EDITOR POR FORA',44,68,4,'left');
    c.fillStyle='#2a2722'; c.font=`700 ${name.length>9?70:84}px ${SERIF}`; c.fillText(name.charAt(0)+name.slice(1).toLowerCase(),44,200);
    c.fillStyle='rgba(42,39,34,.22)'; for(let i=0;i<4;i++) c.fillRect(44,262+i*46,w-88-(i%3)*120,10);
    c.fillStyle='#2a2722'; c.font=`500 28px ${MONO}`; spaced(c,'VALOR',44,h-58,4,'left'); c.fillStyle='rgba(42,39,34,.85)'; c.fillRect(200,h-86,300,34); });
  const STOP=new THREE.MeshStandardMaterial({map:sheetTex('EDIÇÃO'),color:0xb3ad9f,roughness:.95});
  const st=[T.se, T.edicoes, T.faco-.25, T.faco+.35, T.cortez+.1, T.pagar+.2, T.muito-.1, T.oferta2-.15];
  st.forEach((t0,i)=>{ const TOP=new THREE.MeshStandardMaterial({map:sheetTex(SERV[i]),color:0xb8b2a4,roughness:.95});
    const m=new THREE.Mesh(new THREE.BoxGeometry(400,14,300),[PAPERSIDE,PAPERSIDE,TOP,PAPERSIDE,PAPERSIDE,PAPERSIDE]); m.castShadow=true; m.receiveShadow=true; S.add(m);
    m.userData={t0, x:560+(rnd()-.5)*26, y:-330+7+i*14.4, z:(rnd()-.5)*22, ry:(rnd()-.5)*.16, sx:(rnd()-.5)*240, sr:(rnd()-.5)*1.2}; sheets.push(m); });
  const bundle=(label,t0,yb,ry)=>{ const side=ctex(420,150,(c,w,h)=>{ c.fillStyle='#e6dfcf'; c.fillRect(0,0,w,h); for(let y=2;y<h;y+=3){ c.fillStyle=`rgba(60,50,35,${.10+.12*rnd()})`; c.fillRect(0,y,w,1); }
      c.fillStyle='#1d1c19'; c.fillRect(0,h/2-34,w,68); c.fillStyle='#E8DFC9'; c.font=`500 25px ${MONO}`; spaced(c,label,w/2,h/2+9,5,'center'); });
    const sideX=ctex(320,150,(c,w,h)=>{ c.fillStyle='#e6dfcf'; c.fillRect(0,0,w,h); for(let y=2;y<h;y+=3){ c.fillStyle=`rgba(60,50,35,${.10+.12*rnd()})`; c.fillRect(0,y,w,1); } c.fillStyle='#1d1c19'; c.fillRect(0,h/2-34,w,68); });
    const SM=new THREE.MeshStandardMaterial({map:side,color:0xc4beb0,roughness:.95}), SX=new THREE.MeshStandardMaterial({map:sideX,color:0xb3ad9f,roughness:.95});
    const m=new THREE.Mesh(new THREE.BoxGeometry(420,150,320),[SX,SX,STOP,PAPERSIDE,SM,SX]); m.castShadow=true; m.receiveShadow=true; S.add(m);
    m.userData={t0,y:yb,ry}; bundles.push(m); };
  const base=-330+st.length*14.4;
  bundle('EDITOR · MÊS 1',T.um+.12,base+75,-.05); bundle('EDITOR · MÊS 2',T.dois+.12,base+75+152,.06);
}

function prepare(){ if(READY) return READY;
  const fonts=[`500 30px ${MONO}`,`700 60px ${SERIF}`,`400 60px ${SERIF}`,`600 30px ${SANS}`,`800 30px ${SANS}`].map(f=>document.fonts.load(f));
  const jobs=[document.fonts.ready,...fonts];
  Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  READY=Promise.all(jobs).then(()=>build()); return READY; }

// câmera: quadros-chave (posição, alvo), cada um assume numa transição suave
function cam(t){
  const K=[
    [-9,   [0,40,D],             [0,40,0]],
    [T.pelo-.25, [-118,63,D/1.2],    [-118,63,0]],
    [T.pile0,    [560,806,1738],     [560,-280,0]],
    [T.fora-.3,  [560,655,1602],     [560,-270,0]],
    [T.apresentador-.1, [560,816,2147],     [560,-140,0]],
    [T.convidado2+.05,[-170,120,D+150],   [-170,100,0]],
    [T.wide,     [150,1150,D+1500],  [150,-60,0]],
    [T.cta0,     [150,1250,D+2300],  [150,-120,0]],
  ];
  const DUR=[0,.85,1.0,1.6,.8,.9,1.1,1.2];
  let p=K[0][1].slice(), q=K[0][2].slice();
  for(let i=1;i<K.length;i++){ const u=eio((t-K[i][0])/DUR[i]); if(u<=0) break;
    for(let k=0;k<3;k++){ p[k]=lerp(p[k],K[i][1][k],u); q[k]=lerp(q[k],K[i][2][k],u); } }
  // vida lenta: deriva sutil, e órbita leve no plano aberto
  const w=eio((t-T.wide)/1.1)*(1-eio((t-T.cta0)/1.2));
  p[0]+=Math.sin(t*.37)*10 + 260*w*Math.sin((t-T.wide)*.22); p[1]+=Math.sin(t*.29)*7;
  // tremor curtíssimo no impacto dos maços
  bundles.forEach(b=>{ const u=t-(b.userData.t0+.42); if(u>0&&u<.35){ const a=7*Math.exp(-u*14); p[1]+=a*Math.sin(u*90); q[1]+=a*Math.sin(u*90); } });
  C.position.set(p[0],p[1],p[2]); C.lookAt(q[0],q[1],q[2]);
}

function printL(t){
  // comprimento impresso (px do recibo para fora da fenda) — cada trecho impresso na palavra que o pede
  const L=LINES, it=L.items;
  const keys=[[T.pelo-.1,0],[T.pelo+.35,L.sub-6]];
  const a=T.entrega-.05, b=T.negocio+.55; it.forEach((y,i)=>keys.push([lerp(a,b,(i+1)/it.length),y]));
  keys.push([T.so-.05,L.d1],[T.so+.35,L.only],[T.agora+.1,L.only],[T.outras+.25,L.others],[T.ferr+.55,L.foot]);
  if(t<=keys[0][0]) return 0;
  for(let i=1;i<keys.length;i++){ if(t<=keys[i][0]){ const [t0,l0]=keys[i-1],[t1,l1]=keys[i]; return lerp(l0,l1,sm(t0,t1,t)); } }
  return keys[keys.length-1][1];
}

function render(t){
  cam(t);
  { const dl=-1000*(1-eo3((t-(T.pelo-.95))/.85)), dr=-1000*(1-eo3((t-T.pile0)/.9));
    plL.position.y=-330+dl; printer.position.y=-275+dl; plR.position.y=-330+dr; plL.visible=dl>-990; printer.visible=dl>-990; plR.visible=dr>-990; }
  // etiqueta: entra do alto já em movimento, balança e gira no "graça"; depois sobe para pendurar sobre a impressora
  { const u=eo3((t+.35)/1.15); const m=eio((t-T.pelo+.25)/.9), z=eio((t-T.wide)/1.0);
    const j=eio((t-T.convidado2+.2)/.8);
    const x=lerp(lerp(lerp(205,130,m),110,j),70,z), y=lerp(lerp(lerp(lerp(1700,400,u),330,m),420,j),640,z)+1500*eio((t-T.cta0)/1.1)+900*(sm(T.so-.3,T.so+.3,t)-sm(T.convidado2-.3,T.convidado2+.4,t)), zz=lerp(120,90,m);
    tagG.position.set(x,y,zz); tagG.scale.setScalar(lerp(1.3,.8,m)); CORD.value=y+lerp(150,20,m);
    const s0=t+.35; const sw=0.16*Math.exp(-s0*1.5)*Math.sin(s0*5.4) + 0.05*Math.exp(-Math.max(0,t-T.pelo)*1.4)*Math.sin((t-T.pelo)*5)*(t>T.pelo?1:0);
    tagSwing.rotation.z=sw + 0.012*Math.sin(t*1.3);
    const f=eob((t-T.graca+.16)/.62); tagFlip.rotation.y = Math.PI*f + 0.22*Math.sin(t*.8)*sm(T.graca+.6,T.graca+1.6,t) - 0.18*(1-sm(-.3,.6,t)); }
  // recibo
  const L=printL(t);
  paper.position.y = SLOT_Y + L - PH/2;
  paper.visible = L>0.5;
  { const yLine=SLOT_Y+L-LINES.onlyY; marker.position.set(PX+2, yLine, -20+4 - 0.00011*Math.pow(Math.max(0,yLine-SLOT_Y),2) - 0.012*Math.max(0,yLine-SLOT_Y));
    const s=sm(T.so+.25,T.so+.75,t); const pulse=sm(T.so2-.05,T.so2+.3,t)*(1-sm(T.so2+.9,T.so2+1.3,t));
    marker.scale.x=Math.max(.001,s); marker.position.x=PX+2-(PW-34)/2*(1-s); marker.visible=L>LINES.onlyY+20; marker.material.opacity=.38+.22*pulse; }
  // polaroides: entram no "entrega" e no "negócio"; saem quando a câmera abre para a pilha
  polas.forEach((g,i)=>{ const t0=T.so-.1, out=eio((t-T.pile0-.1)/.6);
    const u=eob((t-t0)/.7); const P=[120,-20,60,-.06];
    g.visible=t>t0-.02 && out<1; const foc=sm(T.so+.4,T.so+.9,t)*(1-sm(T.pile0-.3,T.pile0,t));
    g.position.set(P[0]+ (1-u)*160 + out*120, P[1]+(1-u)*-120 - out*260, P[2]+(1-u)*500 - out*300);
    g.rotation.set((1-u)*.5, (1-u)*-.6 - .12, P[3]*(1+ (1-u)*2) + .01*Math.sin(t*1.1+i));
    g.scale.setScalar(.82*(1+.08*foc)*(1-.3*out));
    g.userData.mats.forEach(m=>m.opacity=1-out);
    if(g.visible) setFrame(g.userData.tx, frameOf(g.userData.seq,t,t0,i*23)); });
  // notas: caem a cada edição paga por fora
  sheets.forEach((m,i)=>{ const d=m.userData; const u=clamp((t-d.t0)/.5,0,1); m.visible=t>d.t0;
    const fall=eo3(u); m.position.set(d.x + d.sx*(1-fall)*.25, lerp(d.y+760,d.y,fall*fall*(3-2*fall)), d.z + (1-fall)*90);
    m.rotation.set((1-fall)*.35, d.ry + d.sr*(1-fall), (1-fall)*d.sr*.4); });
  // maços "mês 1" e "mês 2" (fala do Apresentador): caem pesados e a pilha balança
  let wob=0;
  bundles.forEach((m,i)=>{ const d=m.userData; const u=clamp((t-d.t0)/.42,0,1); m.visible=t>d.t0;
    const y=lerp(d.y+650,d.y,u*u); m.position.set(560 + (i?-8:10), y, (i?10:-6)); const land=t-(d.t0+.42);
    const w=land>0? .045*Math.exp(-land*6)*Math.sin(land*26):0; wob+=w; m.rotation.set(w*.6,d.ry+(1-u)*.25,w); });
  // luz e bloom: pulso dourado no giro da etiqueta
  const g1=Math.exp(-Math.pow((t-T.graca-.35)/.35,2)), g2=Math.exp(-Math.pow((t-T.injusta-.2)/.45,2));
  rim.intensity=2.2+2.4*g1+1.2*g2; bloom.strength=.16+.2*g1+.1*g2;
  composer.render();
  const fidx=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((fidx*97)%64))+'px,'+(-((fidx*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!tagG){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
