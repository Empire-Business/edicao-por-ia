function pose(t){ let i=0; while(i<K.length-2 && t>=K[i+1][0]) i++;
  const a=K[i], b=K[i+1]; const u=eio((t-a[0])/(b[0]-a[0]));

function placeCamera(t){ const [_,tx,ty,tz,dd,ti,ya]=pose(t); const th=ti*DEG, ph=ya*DEG, dist=dd*D;
  camT.set(tx,ty,tz);
  C.position.set(tx+Math.sin(ph)*dist*Math.sin(th), ty-Math.cos(ph)*dist*Math.sin(th), tz+dist*Math.cos(th));
  C.up.set(-Math.sin(ph)*Math.cos(th), Math.cos(ph)*Math.cos(th), Math.sin(th)); C.lookAt(camT); C.updateMatrixWorld();
  key.target.position.set(tx,ty,0); key.position.set(tx-1100,ty-900,2600); key.target.updateMatrixWorld();

  const h1=eo((t-T.editar+0.05)/0.85), h2=eio((t-T.prof+0.1)/0.8);
  const ctilt=(pose(t)[5])*DEG;

    hero.position.set(lerp(cx,0,h1), lerp(cy,-30,h1)+40*h2, lerp(60,330,h1)+30*h2);
    hero.rotation.set(lerp(0,ctilt,h1), 0, lerp(-0.4,0,h1));
    hero.scale.setScalar(lerp(0.22,1,h1)*lerp(1,0.9,h2));
    setFrame(hero.userData.tx, loopOf('e117a',t,T.editar)); }
  [fanL,fanR].forEach((p,i)=>{ const sg=i?1:-1; const u=eo((t-T.prof-0.05-i*0.12)/0.8);
    p.visible = t>T.prof-0.1 && t<T.pr0;
    if(p.visible){ p.position.set(sg*lerp(560,400,u), lerp(-260,60,u), lerp(2,250,u)); p.rotation.set(lerp(0,ctilt,u), -sg*lerp(0,0.32,u), sg*lerp(20,2,u)*DEG); p.scale.setScalar(lerp(0.6,0.95,u));

  // ===== cena 2: calendário — 2 dias + correção =====
  const flips=[T.dois-0.05, T.dois+0.42, T.pedir+0.05, T.correcao+0.45, T.pr0+0.15, T.pr0+0.45];
  pages.forEach((pv,i)=>{ const f=i<flips.length?eio((t-flips[i])/0.42):0; pv.rotation.x=-(200+i*1.6)*DEG*f; pv.visible = f<0.999 || t<T.pr0+1.2; });
  const nu=eo((t-T.correcao+0.25)/0.35);
  note.visible = nu>0.001 && t<T.pr0+1.0;
  note.position.set(lerp(40,190,nu), lerp(700,540,nu), lerp(420,24,nu)); note.rotation.set(0,0,lerp(-24,7,nu)*DEG); note.scale.setScalar(lerp(1.3,1,nu));
  // ===== cena 3: tela real + relógio de 20–30 min + cópia pronta =====
  const lv0=T.pr0+0.1, lv1=T.termina2+0.35;
  setFrame(liveTx, SEQ.live[Math.min(SEQ.live.length-1, Math.floor(clamp((t-lv0)/(lv1-lv0),0,1)*(SEQ.live.length-1)))]);
  const B20=eio((t-T.v20+0.05)/0.5)*120*DEG, B30=eio((t-T.v30+0.05)/0.5)*60*DEG;
  setDial(dialB, Math.max(0.0001, B20+B30));
  const o=eio((t-T.termina2+0.1)/0.85);
  outP.visible = t>T.termina2-0.15 && t<T.jo0+0.9;
  if(outP.visible){ const arc=Math.sin(o*Math.PI)*150;
    outP.position.set(lerp(3000,3000,o), lerp(300,-330,o), lerp(380,1.5,o)+arc*0.4);
    const fl=eio((t-T.manda2+0.05)/0.55);
    outP.rotation.set(lerp(Math.PI/2-SLEAN,0,o), fl*Math.PI*2, lerp(0,7,o)*DEG); outP.scale.setScalar(lerp(0.45,1,o));
    setFrame(outP.userData.tx, loopOf('e117b',t,T.termina2)); }
  const bu=ebo((t-T.manda2-0.25)/0.45); badge.visible = t>T.manda2+0.25; badge.scale.setScalar(Math.max(0.001,bu));
  const ru=eio((t-T.se-0.05)/0.95);
  req.visible = t>T.se-0.05 && ru<0.995;
  if(req.visible){ req.position.set(lerp(2380,3000,ru), lerp(-760,330,ru), lerp(360,560,ru)); req.rotation.set(lerp(0.9,Math.PI/2-SLEAN,ru),0,lerp(10,0,ru)*DEG);
    req.scale.setScalar(lerp(1,0.12,Math.pow(ru,2))); reqM.material.opacity=1; }
  // ===== cena 4: Convidado =====
  setFrame(convidado.userData.tx, frameOf('convidado',t,T.jo0));
  deco.forEach((p,i)=>setFrame(p.userData.tx, STILL[[5,11,17][i]]));
  // ===== cena 5: agenda da semana =====
  wk.forEach((p,i)=>{ const r=Math.floor(i/7), c=i%7; let t0;
    if(r===0) t0=-10;                                                   // já está na agenda quando a câmera chega
    else if(r===1) t0=T.bp0+0.2+c*((T.dois2-0.35-(T.bp0+0.2))/7);      // segunda linha: durante "agora você vai poder postar…"
    else t0=T.tres-0.12+c*0.085;                                         // terceira linha: no "três"
    const u=eo3((t-t0)/0.5); p.visible = u>0.001;
    if(p.visible){ const [hx,hy]=p.userData.home; p.position.set(hx+(1-u)*40, hy+(1-u)*120, lerp(700,11,u)); p.rotation.set((1-u)*0.5,0,p.userData.rz+(1-u)*0.6); p.scale.setScalar(lerp(1.25,1,u));
      setFrame(p.userData.tx, STILL[p.userData.still]); } });
  // ===== CTA: cartão azul-marinho cai sobre a agenda; botão físico =====
  const cu=eo3((t-T.cta0+0.05)/0.7);
  CTA.visible = cu>0.001;
  if(CTA.visible){ CTA.position.set(1500+(1-cu)*90, -1650-(1-cu)*160, lerp(1100,26,cu));   // pousa POR CIMA da agenda (cópias até z≈15) CTA.rotation.set((1-cu)*0.35,(1-cu)*-0.2,lerp(-9,-1.2,cu)*DEG);
    const bp=ebo((t-T.cta0-0.75)/0.5); BTN.scale.setScalar(Math.max(0.001,bp));
    const press=Math.exp(-Math.pow((t-T.tap-0.06)/0.07,2)); BTN.position.z=8-12*press;
    if(COMMENT){ FIELD.scale.setScalar(Math.max(0.001,bp));
      const k0=T.cta0+1.15, k1=T.tap-0.55, word='CORTEZ'; const n=clamp(Math.floor((t-k0)/((k1-k0)/word.length))+1,0,word.length);
      const sent=t>=T.tap+0.08; const caret=!sent && t>T.cta0+0.9 && (Math.floor(t*2.4)%2===0 || (t>k0 && t<k1+0.1));
      setField(sent?'':(t<k0?'':word.slice(0,n)), caret);
      SEND.position.z=22-10*press;
      const cu2=ebo((t-T.tap-0.12)/0.45); CHIP.visible=t>T.tap+0.12; CHIP.scale.setScalar(Math.max(0.001,cu2)); CHIP.position.z=10+30*(1-clamp((t-T.tap-0.12)/0.45,0,1)); } }
  // ===== rótulos, cursor =====
  anchor('pHero',hero,0,-338-46,4, win(t,T.qualidade-0.2,T.prof+0.05));
  anchor('pFan',hero,0,-338-40,4, win(t,T.prof+0.7,T.ed0+0.45));
  anchor('pLive',scrFace,0,SH+60+24+36,0, win(t,T.pr0+0.7,T.termina2-0.2));
  anchor('pOut',outP,0,266+46,4, win(t,T.video2+0.35,T.jo0-0.15));
  anchor('pConvidado',convidado,0,-282-60,4, win(t,T.jo0+1.0,T.bp0-0.2));
  anchor('pWeek',WK,0,-PH/2-48,10, win(t,T.bp0+0.6,T.speechEnd-0.05));
  const cur=document.getElementById('cursor'); const cv=sm(T.tap-0.95,T.tap-0.7,t)*(1-sm(T.tap+0.5,T.tap+0.85,t));
  if(cv>0.001 && CTA.visible){ if(COMMENT){ v3.set(14,-14,30); SEND.localToWorld(v3); } else { v3.set(70,-40,40); BTN.localToWorld(v3); } v3.project(C); const bx=(v3.x+1)/2*1080, by=(1-v3.y)/2*1920;
    const mu=eio((t-T.tap+0.9)/0.85), lv=eio((t-T.tap-0.35)/0.6);
    cur.style.left=(lerp(880,bx,mu)+lv*60).toFixed(1)+'px'; cur.style.top=(lerp(1780,by,mu)+lv*110).toFixed(1)+'px'; cur.style.opacity=cv.toFixed(3);
    cur.style.transform=`scale(${(1-0.14*Math.exp(-Math.pow((t-T.tap-0.06)/0.08,2))).toFixed(3)})`; } else cur.style.opacity=0;
  // foco no alvo da câmera
  bokeh.uniforms.focus.value = C.position.distanceTo(camT);
  bokeh.uniforms.aperture.value = 0.000005;
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.__render=render;
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!BUILT){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
