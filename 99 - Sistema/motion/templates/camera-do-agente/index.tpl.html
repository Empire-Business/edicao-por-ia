function makePanel(W,H,o){ o=o||{}; const Rr=o.r||16, Dp=o.depth||14, b=o.border||12;
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.ExtrudeGeometry(rr(new THREE.Shape(),W+2*b,H+2*b,Rr+b*.6),{depth:Dp,bevelEnabled:true,bevelThickness:3,bevelSize:2.5,bevelSegments:4,curveSegments:20}),
    new THREE.MeshPhysicalMaterial({color:0x0c0b0a,metalness:.55,roughness:.32,clearcoat:1,clearcoatRoughness:.18,transparent:true}));
  body.geometry.translate(0,0,-Dp); g.add(body);
  const tx=videoTex();
  const mw=256, mh=Math.max(32,Math.round(256*H/W));
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(W,H), new THREE.MeshBasicMaterial({map:tx,alphaMap:roundMask(mw,mh,Math.round(Rr*mw/W)),transparent:true,toneMapped:false,color:new THREE.Color(SCRK,SCRK,SCRK)}));
  scr.position.z=6.5; g.add(scr);   // folga da face chanfrada do corpo (evita z-fighting nas telas vistas de lado)
  const pts=new THREE.Shape(); rr(pts,W+2*b+6,H+2*b+6,Rr+b*.6+3); const lp=pts.getPoints(40);
  const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(lp), new THREE.LineBasicMaterial({color:PINK,transparent:true,opacity:0,toneMapped:false}));
  line.position.z=7.5; g.add(line);
  g.userData={tx,body,scr,line,W,H};
  return g; }
function setPanelOpacity(p,a){ p.userData.scr.material.opacity=a; p.userData.body.material.opacity=a; p.visible=a>0.003;
  p.userData.body.material.depthWrite=a>0.97; p.userData.scr.material.depthWrite=a>0.97; }   // painel sumindo não pode tapar o que está atrás

  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,36), new THREE.MeshBasicMaterial({map:k.t,transparent:true,toneMapped:false,depthWrite:false}));
  m.renderOrder=5; return m; }

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.ready];
  Object.entries(DATA.seq).forEach(([name,s])=>{ SEQ[name]=new Array(s.n); for(let i=0;i<s.n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  READY=Promise.all(jobs).then(()=>{ later.forEach(f=>f());
    // o print: o quadro exato da interface no instante do "print", recortado na coluna "Em Andamento"
    const im=SEQ.h_ui[frameIdx('h_ui',T.print_tick,T.enter_ui)]; const g=PR.g; const sx=.48*960, sw=.18*960, sy=.10*422, sh=.45*422;
    g.fillStyle='#f4f5f7'; g.fillRect(0,0,346,380); g.drawImage(im,sx,sy,sw,sh,0,0,346,380); PR.t.needsUpdate=true;
    STRIP.forEach((m,i)=>{ m.userData.tx.image=SEQ.h_ui[Math.min(SEQ.h_ui.length-1,12+i*22)]; m.userData.tx.needsUpdate=true; }); });
  return READY; }

const tmpV=new THREE.Vector3();
function camAt(px,py,pz,tx,ty,tz){ C.position.set(px,py,pz); C.lookAt(tx,ty,tz); }

function render(t){
  const t02=T.t02, rv=T.reveal, EL=T.ele, ENT=T.enter_ui, PRT=T.print_tick, G1=T.grav1, TL=T.tela, FZ=T.fez, PT=T.prop_tick, US=T.usando, T3=T.t03, T4=T.t04, CE=T.speechEnd, CTA=T.cta0;
  // ---------- câmera ----------
  let cp=new THREE.Vector3(0,0,D), ct=new THREE.Vector3(0,0,0), focusD=D;
  if(t<EL){ // gancho → constelação
    const a=eo(t/2.2), b=eio((t-t02+0.1)/1.4);
    cp.set(lerp(-60,0,a)+40*Math.sin(t*.4), lerp(-40,0,a), lerp(D-900,D-120,a) + 300*b);
    ct.set(0, lerp(-30,40,b), lerp(0,-520,b));
    const dl=eio((t-t02-0.6)/(rv-t02-0.4)); cp.x+= lerp(160,-140,dl)*b; ct.x+= lerp(60,-40,dl)*b; cp.y+= lerp(-60,40,dl)*b;
    if(t>rv-0.4){ const c=eio((t-rv+0.4)/1.6); cp.x+= -60*c; ct.x+= -30*c; }
    focusD = lerp(D-120, D+300+640, b);
  } else if(t<US-0.3){ // ponto de vista do agente
    const a=eio((t-EL)/0.75); const drift=(t-EL);
    cp.set(lerp(-90,30,a)-10*drift, lerp(40,10,a), lerp(D+420,D+110,a) - 12*drift);
    ct.set(lerp(-40,0,a), lerp(-520,0,a)*0, lerp(-520,0,a));
    if(t>FZ-0.2){ const c=eio((t-FZ+0.2)/1.2); cp.z+=220*c; cp.x+= -60*c; }
    focusD = cp.z - 0;
  } else if(t<T3){ // dentro de outro vídeo
    const a=eio((t-US+0.3)/0.9);
    cp.set(lerp(-60,40,a), lerp(10,30,a), lerp(D-110,D+260,a)); ct.set(0,0,-300*a); focusD=cp.z+300*a;
  } else if(t<CTA){ // monólitos
    const a=eio((t-T3)/1.1), dr=t-T3;
    const up=eio((t-T.quem+0.1)/2.4);
    cp.set(lerp(40,560,a) - 52*dr*a + lerp(0,-150,up), lerp(30,70,a) + 640*up, lerp(D+260,D-240,a) + 1250*up);
    ct.set(lerp(0,180,a) - 40*dr*a + lerp(0,-90,up), lerp(0,40,a) + 300*up, lerp(-300,-260,a) - 300*up);
    focusD = Math.hypot(cp.x-ct.x,cp.y-ct.y,cp.z-(-200));
  } else { // CTA
    const a=eio((t-CTA)/1.2);
    cp.set(lerp(-60,0,a), lerp(710,-40,a), lerp(D+1010,D+380,a) - 30*(t-CTA)); ct.set(0,lerp(340,-40,a),-260); focusD=Math.hypot(cp.y-ct.y,cp.z+260);
  }
  camAt(cp.x,cp.y,cp.z,ct.x,ct.y,ct.z);
  // a cena desce 120 px durante a fala (ocupa o meio do quadro, acima da legenda); no CTA volta ao centro
  const vshift=Math.round(120*(1-eio((t-CTA+0.3)/0.8))); C.setViewOffset(1080,1920,0,-vshift,1080,1920);

  // ---------- 1) HERO (gancho) e constelação ----------
  const latIn=eio((t-t02-0.2)/1.3), latOut=eio((t-EL+0.1)/0.7), latBack=eio((t-T.quem)/2.2)*(1-eio((t-CTA)/0.9));
  const heroOn = t<EL+0.4;
  HERO.visible=heroOn;
  if(heroOn){ const a=eo(t/1.6), toSlot=eio((t-t02-0.1)/1.3);
    const slot=LPOS[4];
    HERO.position.set(lerp(lerp(70,0,a),slot.x,toSlot), lerp(lerp(-40,30,a),slot.y,toSlot), lerp(lerp(420,40,a),slot.z,toSlot));
    HERO.rotation.set(lerp(0.10,0.02,a)*(1-toSlot), lerp(0.42,-0.10,a)*(1-toSlot), 0);
    HERO.scale.setScalar(lerp(1.2,600/960,toSlot));
    const hs=toSlot>0.85?'c_dash':'h_hook'; const htx=heroTx[hs]; if(HERO.userData.scr.material.map!==htx){ HERO.userData.scr.material.map=htx; HERO.userData.scr.material.needsUpdate=true; }
    setFrame(htx, frameOf(hs, t, 0, 0));
    setPanelOpacity(HERO, 1-latOut);
    HERO.userData.line.material.opacity = 0.0; }
  let anyLat=false;
  LAT.forEach((p,i)=>{ const base=LPOS[i];
    let vis = (t>t02 && t<EL+0.6) || (latBack>0.002);
    if(i===4 && t<T3) vis=false;      // a vaga do gancho (o POV sai dela)
    p.visible=vis; if(!vis){ p.userData.tag.visible=false; return; } anyLat=true;
    const d=Math.hypot(base.x,base.y)/900;
    const inA=eo((t-t02-0.15-d*0.35)/1.1);
    const fl=Math.sin(t*0.5+i*1.7)*10;
    let x=base.x, y=base.y+fl, z=lerp(base.z-1800,base.z,inA);
    let op=inA*(1-latOut);
    if(latBack>0.002){ // volta como fundo, alto e atrás dos monólitos
      x=base.x*1.45; y=base.y*1.05+860; z=base.z-2300; op=Math.max(op, 0.85*latBack); }
    z -= 1400*latOut*(t<T3?1:0);
    p.position.set(x,y,z); p.rotation.set(0,-base.x/5200,0); p.scale.setScalar(1);
    setPanelOpacity(p, op);
    setFrame(p.userData.tx, frameOf(p.userData.seq,t,0,p.userData.off));
    // destaques: PRODUTO (painéis escuros) e institucionais (todos)
    const isHT=['c_dash','c_orac','c_funil','c_wa','c_type'].includes(p.userData.seq);
    const hl = isHT? sm(T.hta-0.1,T.hta+0.2,t)*(1-sm(T.inst1-0.1,T.inst1+0.2,t)) : 0;
    p.userData.line.material.opacity = Math.max(0.55*hl, 0) * op;
    p.position.z += 90*hl;
    // carimbo "feito pelo Cortez": a varredura passa da esquerda para a direita na palavra "Cortez" (e de novo no "todo mundo precisa")
    const sx=lerp(-1100,1100,clamp((t-rv+0.15)/0.75,0,1));
    const stamped = (t>rv-0.15 && sx>x-250) ? eo((t-(rv-0.15+( (x+1100)/2200 )*0.75))/0.3) : 0;
    const st2 = latBack>0.002 ? eo((t-T.todo-0.05-(i%3)*0.12-Math.floor(i/3)*0.06)/0.3) : 0;
    const tagA = Math.max(stamped*(1-latOut), st2)*op;
    p.userData.tag.visible = tagA>0.01; p.userData.tag.material.opacity=tagA; p.userData.tag.scale.setScalar(lerp(.7,1,Math.max(stamped,st2)));
    if(stamped>0 && stamped<1) p.userData.line.material.opacity = Math.max(p.userData.line.material.opacity, 0.9*(1-stamped)*op);
  });
  // fios
  links.visible = anyLat;
  if(anyLat){ const arr=linkGeo.attributes.position.array; LINKS.forEach(([a,b],k)=>{ const A=(a===4&&t<T3)?HERO.position:LAT[a].position, B=(b===4&&t<T3)?HERO.position:LAT[b].position;
      arr.set([A.x,A.y,A.z-4,B.x,B.y,B.z-4],k*6); }); linkGeo.attributes.position.needsUpdate=true;
    links.material.opacity = 0.22*latIn*(1-latOut) + 0.16*latBack; }
  scan.visible = t>rv-0.2 && t<rv+0.75;
  if(scan.visible){ const u=clamp((t-rv+0.15)/0.75,0,1); scan.position.set(lerp(-1100,1100,u),40,-560); scan.material.opacity=0.55*Math.sin(Math.PI*u); }

  // ---------- 2) POV: a plataforma ----------
  const povIn=eio((t-EL)/0.75), povOut=eio((t-FZ-0.1)/0.9);
  POV.visible = t>EL-0.05 && t<FZ+1.2;
  if(POV.visible){
    const ui = t>=ENT;                                 // entrou no módulo PRODUTO: a interface da plataforma
    const hUI = 1000*422/960;                           // proporção da interface recortada
    const k = ui ? eio((t-ENT)/0.35) : 0;
    const H = lerp(562, hUI, k);
    POV.userData.scr.scale.set(1, H/562, 1); POV.userData.body.scale.set(1, (H+24)/(562+24), 1);
    POV.position.set(lerp(LPOS[4].x,0,povIn), lerp(LPOS[4].y,320,povIn) + lerp(0,-40,povOut), lerp(LPOS[4].z,0,povIn) - 900*povOut);
    POV.rotation.set(lerp(0,0.05,povIn), lerp(0,0.16,povIn)*(1-povOut) + 0.02*Math.sin(t*.7), 0);
    POV.scale.setScalar(lerp(600/1000,1,povIn) * lerp(1,0.7,povOut));
    setPanelOpacity(POV, sm(EL-0.05,EL+0.15,t)*(1-povOut));
    const ptx=povTx[ui?'h_ui':'h_mods']; if(POV.userData.scr.material.map!==ptx){ POV.userData.scr.material.map=ptx; POV.userData.scr.material.needsUpdate=true; }
    setFrame(ptx, ui ? frameOf('h_ui',t,ENT) : frameOf('h_mods',t,EL-0.3));
    if(ui && t<ENT+0.3){ const s=1+0.25*(1-eo((t-ENT)/0.3)); POV.userData.scr.scale.x=s; POV.userData.scr.scale.y*=s; }
    // contorno rosa enquanto grava
    const recOn = sm(G1-0.1,G1+0.1,t)*(1-sm(TL+0.35,TL+0.6,t));
    POV.userData.line.material.opacity = (0.35+0.45*recOn*(0.6+0.4*Math.sin(t*9)))*POV.userData.scr.material.opacity*(ui?1:0.4);
  }
  // mira do agente (em coordenadas locais da tela POV)
  const retOn = sm(EL+0.25,EL+0.55,t)*(1-sm(TL+0.3,TL+0.6,t));
  RET.visible = retOn>0.01 && POV.visible;
  if(RET.visible){
    POV.updateMatrixWorld();
    // alvos (x,y em fração da tela, w,h em px locais)
    const H = POV.userData.scr.scale.y*562;
    const keys=[ [EL+0.3, -.05,.10, 300,180], [EL+0.95, .30,.05, 260,170], [ENT-0.05, .025,-.16, 200,125],            // passeia e vai ao bloco PRODUTO (2ª linha, meio)
                 [ENT+0.25, -.02,.0, 520,300], [PRT-0.25, .07,.175, .18*1000+12, .45*H+12], [PRT+0.4, .07,.175, .18*1000+12,.45*H+12], // trava na coluna para o print
                 [G1-0.05, 0,0, 1000+26, H+26], [TL+0.6, 0,0, 1000+26, H+26] ];
    let k0=keys[0], k1=keys[keys.length-1];
    for(let i=0;i<keys.length-1;i++){ if(t>=keys[i][0] && t<keys[i+1][0]){ k0=keys[i]; k1=keys[i+1]; break; } }
    const u=(t<keys[0][0])?0:(t>=keys[keys.length-1][0]?1:eio((t-k0[0])/(k1[0]-k0[0])));
    const fx=lerp(k0[1],k1[1],u), fy=lerp(k0[2],k1[2],u), w=lerp(k0[3],k1[3],u), h=lerp(k0[4],k1[4],u);
    const lx=fx*1000, ly=fy*H;
    const snap = Math.exp(-Math.pow((t-PRT+0.05)/0.09,2));
    const ww=w*(1+0.06*snap), hh=h*(1+0.06*snap);
    const P=[[-ww/2,hh/2],[ww/2,hh/2],[ww/2,-hh/2],[-ww/2,-hh/2]];
    RET.position.copy(POV.localToWorld(tmpV.set(lx,ly,24)));
    RET.quaternion.copy(POV.getWorldQuaternion(new THREE.Quaternion())); RET.scale.setScalar(POV.scale.x);
    RC.forEach((g,k)=>{ g.position.set(P[k][0],P[k][1],0); });
    RTAG.position.set(-ww/2+75, hh/2+30, 1);
    cm.opacity=retOn; RTAG.material.opacity=retOn; }
  // flash do print
  const fl=Math.exp(-Math.pow((t-PRT)/0.07,2))*(t>PRT-0.2?1:0);
  flash.visible = fl>0.01 && POV.visible;
  if(flash.visible){ const H=POV.userData.scr.scale.y*562; flash.position.copy(POV.localToWorld(tmpV.set(.07*1000,.175*H,26))); flash.quaternion.copy(POV.getWorldQuaternion(new THREE.Quaternion()));
    flash.scale.set(.18*1000*POV.scale.x,.45*H*POV.scale.x,1); flash.material.opacity=0.85*fl; }
  // o print levanta, vai para a bandeja e depois entra na montagem
  PRINT.visible = t>PRT && t<PT+0.6;
  if(PRINT.visible){ const H=POV.userData.scr.scale.y*562;
    const lift=eo((t-PRT)/0.55), go=eio((t-FZ)/0.9);
    const w=.18*1000, h=.45*H;
    const start=POV.localToWorld(tmpV.set(.07*1000,.175*H,30)).clone();
    const tray=new THREE.Vector3(-292,-212,140);       // bandeja abaixo da tela, à esquerda (acima da legenda)
    const pos=start.clone().lerp(tray,lift); pos.z+=180*Math.sin(Math.PI*lift);
    const tgt=new THREE.Vector3(-120,200,40);
    pos.lerp(tgt,go);
    PRINT.position.copy(pos); PRINT.rotation.set(0,0,lerp(0,-0.12,lift)*(1-go));
    const sc=lerp(1,1.2,lift)*lerp(1,0.4,go);
    prImg.scale.set(w,h,1); prBack.scale.set(w+16,h+16,1); prSh.scale.set(w*1.5,h*1.3,1); PRINT.scale.setScalar(sc);
    const op=1-eio((t-FZ-0.6)/0.4); prImg.material.opacity=op; prBack.material.opacity=op; prSh.material.opacity=0.7*op; }
  // REC + tira de quadros
  const recA = sm(G1-0.1,G1+0.1,t)*(1-sm(TL+0.35,TL+0.6,t));
  recM.visible = recA>0.01 && POV.visible;
  if(recM.visible){ const H=POV.userData.scr.scale.y*562; drawRec(Math.floor(Math.max(0,t-G1)*1.6)+1);
    recM.position.copy(POV.localToWorld(tmpV.set(500-160,H/2+58,26))); recM.quaternion.copy(POV.getWorldQuaternion(new THREE.Quaternion())); recM.scale.setScalar(POV.scale.x*1.5); recM.material.opacity=recA; }
  STRIP.forEach((m,i)=>{ const t0=G1+0.15+i*0.34; const on=t>t0 && t<PT+0.6; m.visible=on; if(!on) return;
    const H=POV.userData.scr.scale.y*562;
    const u=eo((t-t0)/0.6), go=eio((t-FZ-0.05-i*0.05)/0.85);
    const st=POV.localToWorld(tmpV.set(500,lerp(H/2-60,-H/2+60,i/3),20)).clone();
    const tray=new THREE.Vector3(250+i*16,-128-i*54,140+i*8);   // tira de quadros abaixo da tela, à direita
    const pos=st.clone().lerp(tray,u); pos.x+=120*Math.sin(Math.PI*u);
    pos.lerp(new THREE.Vector3(60+((i%2)-0.5)*180,lerp(120,260,i/3),40),go);
    m.position.copy(pos); m.rotation.set(0,0,lerp(0.18,0.04,u)*(1-go)); m.scale.setScalar(lerp(0.6,1,u)*lerp(1,0.45,go));
    const op=1-eio((t-FZ-0.65)/0.4); m.material.opacity=op; m.userData.fr.material.opacity=op; });

  // ---------- 3) montagem do motion pronto ----------
  ASM.visible = t>FZ+0.3 && t<US+0.9;
  if(ASM.visible){ const a=eo((t-FZ-0.3)/0.8), into=eio((t-US+0.25)/0.9);
    // revela: cru → pronto
    HSCR.uniforms.split.value = clamp((t-T.prop+0.1)/1.1,0,1);
    setFrame(finTx, frameOf('h_fin',t,FZ+0.3)); setFrame(rawTx, frameOf('h_ui',t,ENT));
    // encaixa no módulo do vídeo do PRODUTO
    const ip=INVPOS();
    ASM.position.set(lerp(0,ip.x,into), lerp(lerp(120,200,a),ip.y,into), lerp(lerp(-400,20,a),ip.z,into));
    ASM.rotation.set(0, lerp(lerp(-0.35,-0.06,a),0,into), 0);
    ASM.scale.setScalar(lerp(lerp(0.75,1.08,a),ip.s,into));
    HSCR.uniforms.a.value = a*(1-sm(US+0.55,US+0.9,t)); ASM.userData.body.material.opacity=HSCR.uniforms.a.value; ASM.userData.body.material.depthWrite=HSCR.uniforms.a.value>0.97; ASM.userData.line.material.opacity=0.6*HSCR.uniforms.a.value*sm(PT-0.2,PT+0.1,t);
  }
  INV.visible = t>US-0.35 && t<T3+1.1;
  if(INV.visible){ const a=eo((t-US+0.35)/0.8), out=eio((t-T3)/1.0);
    INV.position.set(0, lerp(110,200,a) + 900*out, lerp(-900,-300,a) - 1400*out); INV.rotation.set(0.02*(1-a), lerp(0.25,0.0,a), 0); INV.scale.setScalar(1.2);
    setPanelOpacity(INV, a*(1-out)); setFrame(INV.userData.tx, frameOf('h_in',t,US-0.35)); INV.userData.line.material.opacity=0; }

  // ---------- 4) monólitos ----------
  const monOn = t>T3-0.1;
  floor.visible = monOn; if(monOn) floor.material.opacity = sm(T3,T3+0.8,t);
  MON.forEach((p,i)=>{ p.visible=monOn; p.userData.sh.visible=monOn; if(!monOn) return;
    const k=i-2; const rise=eo((t-T3-0.05-[2,1,3,0,4].indexOf(i)*0.11)/0.9);
    let x=k*392, z=-260 - 150*Math.abs(k) - 50*(k*k), ry=-k*0.17;
    let fw=0;
    fw = Math.max(fw, (i===2? sm(T.negocio-0.35,T.negocio+0.1,t)*(1-sm(T.site-0.3,T.site,t)) : 0));
    fw = Math.max(fw, (i===3? sm(T.site-0.3,T.site+0.1,t)*(1-sm(T.voce2-0.2,T.voce2+0.2,t)) : 0));
    fw = Math.max(fw, (i===1? sm(T.ferr-0.3,T.ferr+0.1,t)*(1-sm(T.quem-0.2,T.quem+0.3,t)) : 0));
    fw = Math.max(fw, (i===2? sm(T.soft-0.3,T.soft+0.1,t)*(1-sm(T.quem-0.2,T.quem+0.3,t)) : 0));
    if(t>=CTA-0.2){ // CTA: três ao centro
      const c=eio((t-CTA+0.2)/1.1); const slot={1:-1,2:0,3:1}[i];
      if(slot===undefined){ x=lerp(x, k*900, c); } else { x=lerp(x, slot*350, c); z=lerp(z, -240-110*Math.abs(slot), c); ry=lerp(ry,-slot*0.22,c); } }
    const y=lerp(-1150,0,rise) + 8*Math.sin(t*0.9+i);
    p.position.set(x, y, z + 230*fw); p.rotation.set(0, ry + 0.25*fw*(-Math.sign(k)||0)*0, 0);
    p.scale.setScalar(1+0.06*fw);
    setPanelOpacity(p, sm(T3-0.1,T3+0.2,t) * (t>=CTA-0.2 && ![1,2,3].includes(i) ? 1-eio((t-CTA+0.2)/0.8) : 1));
    setFrame(p.userData.tx, t<CTA ? frameOf(p.userData.seq,t,T3,i*7) : SEQ[p.userData.seq][24]);   // no CTA as telas param num quadro limpo conferido (sem laço nem transição atrás do texto)
    p.userData.line.material.opacity = (0.75*fw + 0.5*Math.exp(-Math.pow((t-T.maravilha-0.2)/0.35,2)) + 0.4*sm(T.todo,T.todo+0.4,t)*(1-sm(CTA,CTA+0.6,t)))*p.userData.scr.material.opacity;
    const sh=p.userData.sh; sh.position.set(p.position.x, -305, p.position.z+20); sh.material.opacity=0.85*rise*p.userData.scr.material.opacity; });
  const tagOn=(k,a,b)=>{ MTAG[k].visible = t>a && t<b; if(MTAG[k].visible){ MTAG[k].material.opacity=sm(a,a+0.2,t)*(1-sm(b-0.2,b,t)); } };
  tagOn('neg',T.negocio-0.2,T.site-0.05); tagOn('site',T.site-0.15,T.voce2+0.2); tagOn('ferr',T.ferr-0.15,T.quem+0.2); tagOn('soft',T.soft-0.15,T.quem+0.2);

  // ---------- luz, bloom, foco ----------
  rim.intensity = 2.6 + 1.8*Math.exp(-Math.pow((t-rv)/0.3,2)) + 1.6*Math.exp(-Math.pow((t-T.maravilha-0.2)/0.4,2));
  bloom.strength = 0.16 + 0.12*Math.exp(-Math.pow((t-rv)/0.3,2)) + 0.10*Math.exp(-Math.pow((t-PRT)/0.12,2));
  bokeh.uniforms.focus.value = focusD;
  bokeh.uniforms.aperture.value = (t>T3 && t<CTA) ? 0.0000032 : 0.0000035;
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
// posição do módulo dentro do vídeo do PRODUTO (onde o trecho do PRODUTO aparece): x 16,5–96 %, y 10–95 % do quadro
function INVPOS(){ const s=1.2, W=960*s, H=540*s; const cx=((0.165+0.96)/2-0.5)*W, cy=-((0.10+0.95)/2-0.5)*H; return {x:cx, y:cy+200, z:-292, s:(0.795*W)/960}; }
window.__mod=true;
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!READY){ e.detail.waitUntil(prepare().then(()=>render(t))); } else e.detail.waitUntil(READY.then(()=>render(t))); });
</script>
