  const IN=(sel,at,d)=>tl.fromTo(sel,{yPercent:112},{yPercent:0,duration:d||.6,ease:'power4.out',immediateRender:false},at);
  const OUT=(sel,at)=>tl.fromTo(sel,{yPercent:0},{yPercent:-112,duration:.3,ease:'power3.in',immediateRender:false},at);
  DATA.heads.forEach(h=>{ const sel=`#${h.id}`;
    if(h.start>0.001) IN(`${sel} .lab .in`,h.start,.5);
    h.lines.forEach((l,j)=>{ if(l.at>0.001) IN(`#${h.id}l${j} .in`,l.at,l.d||.7); });
    if(h.end!==null){ OUT(`${sel} .lab .in`,h.end-.3); h.lines.forEach((l,j)=>OUT(`#${h.id}l${j} .in`,h.end-.3+j*.03)); } });

  tl.fromTo('#hud',{opacity:0,y:-10},{opacity:1,y:0,duration:.3,immediateRender:false},T.wire0+.15);
  tl.set('#hud0',{display:'inline'},T.wire0+.15); tl.set('#hud0',{display:'none'},T.sweep0+.25);
  tl.set('#hud1',{display:'inline'},T.sweep0+.25); tl.set('#hud1',{display:'none'},T.sweep1+.05);
  tl.set('#hud2',{display:'inline'},T.sweep1+.05);

  const ST=[T.cenas,T.cut,T.leg,T.anim];
  ST.forEach((s,i)=>{ tl.fromTo(`#st${i}`,{opacity:0,y:16},{opacity:1,y:0,duration:.3,ease:'power3.out',immediateRender:false},T.s5-.05+i*.06);

const bodyGeo=new THREE.ExtrudeGeometry(rr(new THREE.Shape(),588,1008,40),{depth:44,bevelEnabled:true,bevelThickness:8,bevelSize:6,bevelSegments:6,curveSegments:24}); bodyGeo.translate(0,0,-52);
const body=new THREE.Mesh(bodyGeo,bodyMat); mono.add(body);
const bodyWire=(()=>{ const g=[]; const W=294,H=504,zf=-4,zb=-60;
  for(let k=0;k<=6;k++){ const x=-W+k*98; g.push(x,-H,zf, x,H,zf); }
  for(let k=0;k<=10;k++){ const y=-H+k*100.8; g.push(-W,y,zf, W,y,zf); }
  [[-W,-H],[W,-H],[W,H],[-W,H]].forEach(([x,y],k,a)=>{ const [x2,y2]=a[(k+1)%4]; g.push(x,y,zb, x2,y2,zb); g.push(x,y,zf, x,y,zb); });
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(g,3)); return new THREE.LineSegments(geo,wireMat(.75,clipWireM)); })(); mono.add(bodyWire);
const scrTx=vtex();
const scrMat=new THREE.MeshBasicMaterial({map:scrTx,alphaMap:roundMask(270,480,12),transparent:true,toneMapped:false,clippingPlanes:[clipSolidM]});
const scr=new THREE.Mesh(new THREE.PlaneGeometry(540,960),scrMat); scr.position.z=0.5; mono.add(scr);
const scrWire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(540,960)),wireMat(.95,clipWireM)); scrWire.position.z=1; mono.add(scrWire);
const slotMat=new THREE.MeshBasicMaterial({transparent:true,opacity:0,alphaMap:roundMask(270,480,12),toneMapped:false}); const slotPl=new THREE.Mesh(new THREE.PlaneGeometry(540,960),slotMat); slotPl.position.z=2; mono.add(slotPl);
// telas desenhadas: ociosa (escuro) e "seu vídeo aqui" (claro)
function canvasTex(draw){ const c=document.createElement('canvas'); c.width=540; c.height=960; draw(c.getContext('2d')); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
let idleTex=null, slotTex=null;
// metades do quadro antigo no corte
const halfL=vtex(), halfR=vtex(); halfL.repeat.set(.5,1); halfR.repeat.set(.5,1); halfR.offset.set(.5,0);
const hL=new THREE.Mesh(new THREE.PlaneGeometry(270,960),new THREE.MeshBasicMaterial({map:halfL,transparent:true,toneMapped:false})); hL.position.set(-135,0,3); mono.add(hL);
const hR=new THREE.Mesh(new THREE.PlaneGeometry(270,960),new THREE.MeshBasicMaterial({map:halfR,transparent:true,toneMapped:false})); hR.position.set(135,0,3); mono.add(hR);
const blade=new THREE.Mesh(new THREE.PlaneGeometry(5,1040),new THREE.MeshBasicMaterial({color:0xE9D5FF,transparent:true,toneMapped:false})); blade.position.z=6; mono.add(blade);
// moldura de destaque da legenda
const capBox=new THREE.Mesh(frameShape(440,92,22,5),new THREE.MeshBasicMaterial({color:0xC9A2FF,transparent:true,toneMapped:false})); capBox.position.set(0,-118,8); mono.add(capBox);

// ---------- câmera virtual dos bastidores (gizmo) ----------
const gizmo=new THREE.Group(); S.add(gizmo);
{ const g=[]; const w=60,h=40,dz=70; // corpo
  const bx=[[-w,-h,0],[w,-h,0],[w,h,0],[-w,h,0],[-w,-h,dz],[w,-h,dz],[w,h,dz],[-w,h,dz]];
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([a,b])=>g.push(...bx[a],...bx[b]));
  const fw=170,fh=300,fd=-420; const fr=[[-fw,-fh,fd],[fw,-fh,fd],[fw,fh,fd],[-fw,fh,fd]];
  fr.forEach((p,i)=>{ g.push(0,0,0,...p); g.push(...p,...fr[(i+1)%4]); });
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(g,3));
  gizmo.add(new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0xE9D5FF,transparent:true,opacity:.9,fog:true}))); }

// ---------- cenas candidatas ("escolhi as cenas") ----------
const SCN=DATA.scenes, cards=[], CW=310, CH=174;
const cardMask=roundMask(310,174,14);
SCN.forEach((n,i)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(CW,CH),new THREE.MeshBasicMaterial({map:vtex(),alphaMap:cardMask,transparent:true,toneMapped:false}));
  m.visible=false; mono.add(m); cards.push(m); });
const pick=new THREE.Mesh(frameShape(CW+22,CH+22,20,5),new THREE.MeshBasicMaterial({color:0xC9A2FF,transparent:true,toneMapped:false})); pick.visible=false; mono.add(pick);
const PICK=DATA.pickIndex;
const cardHome=(i)=>{ const col=i%3,row=Math.floor(i/3); return V3((col-1)*332, 230-row*200, 260); };

// ---------- editor de curvas ("animei") ----------
const graph=new THREE.Group(); graph.position.set(150,-250,200); mono.add(graph); graph.visible=false;
const gp=new THREE.Mesh(new THREE.ShapeGeometry(rr(new THREE.Shape(),330,230,22),16),new THREE.MeshPhysicalMaterial({color:0x1a0c2e,metalness:.2,roughness:.35,transparent:true,opacity:.86,clearcoat:1}));
graph.add(gp);
const gframe=new THREE.Mesh(frameShape(330,230,22,2.5),new THREE.MeshBasicMaterial({color:0xB67CFF,transparent:true,toneMapped:false})); gframe.position.z=.6; graph.add(gframe);
{ const ax=[]; for(let k=0;k<=4;k++){ const x=-120+k*60; ax.push(x,-80,.5, x,80,.5); } for(let k=0;k<=2;k++){ const y=-80+k*80; ax.push(-120,y,.5, 120,y,.5); }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(ax,3)); graph.add(new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0x5C0F8B,transparent:true,opacity:.7}))); }
const curve=new THREE.CubicBezierCurve3(V3(-120,-80,2),V3(10,-80,2),V3(-10,80,2),V3(120,80,2));
const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,80,3.2,8,false),new THREE.MeshBasicMaterial({color:0xD9B8FF,toneMapped:false})); graph.add(tube);
const keyGeo=new THREE.OctahedronGeometry(11); const keyMat=new THREE.MeshBasicMaterial({color:0xFFFFFF,toneMapped:false});
[V3(-120,-80,4),V3(120,80,4)].forEach(p=>{ const k=new THREE.Mesh(keyGeo,keyMat); k.position.copy(p); k.scale.set(1,1,.4); graph.add(k); });
const dot=new THREE.Mesh(new THREE.SphereGeometry(10,20,14),new THREE.MeshBasicMaterial({color:0xC9A2FF,toneMapped:false})); graph.add(dot);

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.load('800 80px Manrope'), document.fonts.load('500 30px "JetBrains Mono"'), document.fonts.ready];
  Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  SCN.forEach((n,i)=>jobs.push(loadImg(`assets/scenes/${n}.jpg`).then(im=>{ IMG[n]=im; setFrame(cards[i].material.map,im); })));
  READY=Promise.all(jobs).then(()=>{
    idleTex=canvasTex(g=>{ const gr=g.createLinearGradient(0,0,0,960); gr.addColorStop(0,'#24103d'); gr.addColorStop(.55,'#160a28'); gr.addColorStop(1,'#0c0517');
      g.fillStyle=gr; g.fillRect(0,0,540,960);
      g.strokeStyle='rgba(182,124,255,.18)'; g.lineWidth=1; for(let y=120;y<960;y+=120){ g.beginPath(); g.moveTo(40,y); g.lineTo(500,y); g.stroke(); }
      g.fillStyle='rgba(201,162,255,.9)'; g.font='500 20px "JetBrains Mono"'; g.textAlign='center'; g.fillText('CORTEZ · RENDER',270,462);
      g.fillStyle='rgba(182,124,255,.25)'; g.beginPath(); g.roundRect(150,490,240,6,3); g.fill(); g.fillStyle='#B67CFF'; g.beginPath(); g.roundRect(150,490,240,6,3); g.fill(); });
    slotTex=canvasTex(g=>{ g.fillStyle='#FFFFFF'; g.fillRect(0,0,540,960);
      g.strokeStyle='#820AD1'; g.lineWidth=7; g.setLineDash([26,16]); g.beginPath(); g.roundRect(34,34,472,892,30); g.stroke(); g.setLineDash([]);
      g.fillStyle='#820AD1'; g.beginPath(); g.arc(270,420,92,0,Math.PI*2); g.fill();
      g.strokeStyle='#FFFFFF'; g.lineWidth=12; g.lineCap='round'; g.beginPath(); g.moveTo(270,378); g.lineTo(270,462); g.moveTo(228,420); g.lineTo(312,420); g.stroke();
      g.fillStyle='#17092C'; g.font='800 46px Manrope'; g.textAlign='center'; g.fillText('Seu vídeo aqui',270,600);
    });
  }); return READY; }

// ---------- câmera: quadros-chave (posição, alvo) ----------
const playheadAt=(t)=>clamp(t/T.speechEnd,0,1)*N;
function camAt(t){
  const hp=barPos(Math.min(N-1,playheadAt(t)));
  const K=[
    [0,        V3(-260,-470,MZ+1250),      V3(-150,-430,MZ+470)],
    [T.s2-.1,  V3(-80,-440,MZ+1350),       V3(-20,-440,MZ+480)],
    [T.c0-.05, V3(300,700,MZ+2500),        V3(0,-560,MZ)],
    [T.c0+1.3, V3(2100,900,MZ+3500),       V3(-60,-80,MZ)],
    [T.d0+.2,  V3(1500,520,MZ+3700),       V3(0,20,MZ)],
    [T.s5-.15, V3(60,120,MZ+4000),         V3(0,75,MZ)],
    [T.tudo,   V3(30,110,MZ+4000),         V3(0,75,MZ)],
    [T.s6-.05, V3(320,320,MZ+4650),        V3(0,40,MZ)],
    [T.hero,   V3(0,HTY,MZ+HD),            V3(0,HTY,MZ)],
    [T.heroOut,V3(0,HTY,MZ+HD),            V3(0,HTY,MZ)],
    [T.s7+1.1, V3(160,320,MZ+4300),        V3(0,60,MZ)],
    [T.cta0+.2,V3(60,280,MZ+5100),         V3(0,40,MZ)],
    [T.end,    V3(-60,270,MZ+5250),        V3(0,40,MZ)] ];
  // acompanha a cabeça de leitura durante o gancho (a voz "constrói" o anel)
  let i=0; while(i<K.length-2 && t>=K[i+1][0]) i++;
  const [t0,p0,q0]=K[i], [t1,p1,q1]=K[i+1];
  const u=t1>t0?clamp((t-t0)/(t1-t0),0,1):1;
  const ease=(i===7)?ecub(u):eio(u);
  const p=p0.clone().lerp(p1,ease), q=q0.clone().lerp(q1,ease);
  if(t<T.c0){ const k=1-sm(T.s2-.3,T.c0,t); p.x+=hp.x*0.35*k; q.x+=(hp.x-q.x)*0.25*k; }
  return [p,q];
}

function render(t){
  const lite=sm(T.lite0,T.lite0+0.9,t);
  // cores do cenário: escuro → claro no "imagina isso nos seus vídeos"
  S.background.copy(DARK).lerp(LITE,lite); S.fog.color.copy(S.background); S.fog.near=lerp(2600,12000,lite); S.fog.far=lerp(9000,30000,lite);
  floorMat.color.set(0x120822).lerp(new THREE.Color(0xECE6F4),lite); floorMat.opacity=lerp(.8,.9,lite); glow.material.opacity=lerp(.28+.72*sm(T.c0-.2,T.sweep1+.4,t),.0,lite);
  bodyMat.color.set(0x1a0c2e).lerp(new THREE.Color(0xF4F0FA),lite); bodyMat.roughness=lerp(.28,.42,lite); bodyMat.metalness=lerp(.55,.05,lite);
  S.environmentIntensity=lerp(.55,1.0,lite); amb.intensity=lerp(.25,.9,lite); key.intensity=lerp(1.6,1.2,lite); rim.intensity=lerp(2.2,.6,lite);

  // varredura de render: desce (vira wireframe) em "também não"; sobe (vira render) em "Eu sou o Cortez"
  let sy, wireOn;
  if(t<T.wire0){ sy=99999; wireOn=0; }
  else if(t<T.wire1){ sy=lerp(1400,FLOOR-40,ecub((t-T.wire0)/(T.wire1-T.wire0))); wireOn=1; }
  else if(t<T.sweep0){ sy=FLOOR-40; wireOn=1; }
  else if(t<T.sweep1){ sy=lerp(FLOOR-40,1500,ecub((t-T.sweep0)/(T.sweep1-T.sweep0))); wireOn=1; }
  else { sy=99999; wireOn=0; }
  clipSolid.constant=sy; clipWire.constant=-sy;
  const syM = t<T.sweep0 ? -99999 : sy; clipSolidM.constant=syM; clipWireM.constant=-syM;
  const backstage=sm(T.wire0,T.wire0+.4,t)*(1-sm(T.sweep1,T.sweep1+.6,t));
  mirror.visible = sy>FLOOR;
  gridMat.opacity=lerp(.0,.55,backstage)+lerp(0,.16,sm(T.sweep1,T.sweep1+.8,t))*(1-lite)+.22*lite; gridMat.color.set(0x7B3FC9).lerp(new THREE.Color(0xD2BDF0),lite);
  barWire.visible=wireOn>0; bodyWire.visible=scrWire.visible=(t>=T.wire0 && t<T.sweep1);
  // o monólito só existe a partir dos bastidores
  mono.visible = t>=T.wire0;
  gizmo.visible = backstage>0.01; gizmo.children[0].material.opacity=.6*backstage*(1-sm(T.sweep0,T.sweep0+.4,t));
  if(gizmo.visible){ gizmo.position.set(-260,-470,MZ+1250); gizmo.lookAt(V3(-150,-430,MZ+470)); gizmo.rotateY(Math.PI); gizmo.scale.setScalar(1.0); }

  // anel de barras: a voz desenha o anel; perto da cabeça de leitura a barra pulsa com a amplitude atual
  const ph=playheadAt(t), amp=DATA.env[Math.min(DATA.env.length-1,Math.floor(t*30))]||0, settle=1-.62*sm(T.cta0,T.cta0+.9,t);
  for(let i=0;i<N;i++){ const p=barPos(i);
    const rev=sm(i-1.2,i+0.6,ph), d=Math.abs(ph-i);
    const live=Math.exp(-d*d/6)*(t<T.speechEnd?1:0);
    const h=(8 + DATA.bars[i]*(46+184*rev) + live*amp*70)*settle;
    Q.setFromAxisAngle(V3(0,1,0),-ang(i)); SC.set(1,h,1); M4.compose(p,Q,SC); bars.setMatrixAt(i,M4); barWire.setMatrixAt(i,M4);
    const b=lerp(.17,.78,rev)+live*1.6;
    COL.setRGB(lerp(b*.66,.62*(.55+.45*rev),lite),lerp(b*.30,.36*(.55+.45*rev),lite),lerp(b,.95*(.55+.45*rev),lite));
    bars.setColorAt(i,COL); }
  bars.instanceMatrix.needsUpdate=true; bars.instanceColor.needsUpdate=true; barWire.instanceMatrix.needsUpdate=true;

  // conteúdo da tela
  let tex=idleTex, showHalves=false;
  if(t>=T.pick) tex=null;
  if(tex===null){
    if(t<T.cutMid) setFrame(scrTx,frameOf('scrA',t,T.pick));
    else if(t<T.anim) setFrame(scrTx,frameOf('scrB',t,T.cutMid));
    else setFrame(scrTx,frameOf('scrC',t,T.anim));
    scrMat.map=scrTx; }
  else scrMat.map=idleTex;
  slotMat.map=slotTex; slotMat.opacity=sm(T.slot0,T.slot0+.35,t); slotMat.needsUpdate=true;
  // corte: lâmina e metades do quadro anterior
  const cu=(t-T.cut)/0.22;
  blade.visible = cu>-0.05 && cu<1.25; blade.position.x=lerp(-290,290,eio(cu)); blade.material.opacity=1-sm(.9,1.25,cu);
  const hu=(t-T.cutMid)/0.42; showHalves = hu>=0 && hu<1;
  hL.visible=hR.visible=showHalves;
  if(showHalves){ const img=frameOf('scrA',T.cutMid,T.pick); setFrame(halfL,img); setFrame(halfR,img);
    const k=eo(hu); hL.position.set(-135-150*k,-20*k,3+40*k); hR.position.set(135+150*k,20*k,3+40*k); hL.rotation.z=.06*k; hR.rotation.z=-.06*k;
    hL.material.opacity=hR.material.opacity=1-sm(.35,1,hu); }
  // destaque da legenda
  const lu=t-T.leg; capBox.visible = lu>-0.02 && t<T.anim+.1;
  if(capBox.visible){ const k=eo(lu/.3); capBox.scale.set(lerp(1.15,1,k),lerp(1.4,1,k),1); capBox.material.opacity=k*(1-sm(T.anim-.1,T.anim+.1,t)); }
  // cenas candidatas: surgem, a seleção percorre, trava e a escolhida voa para a tela
  const cs0=T.s5-.1;
  cards.forEach((m,i)=>{ const a=t-(cs0+i*.05); m.visible = a>0 && t<T.pick+.3;
    if(!m.visible) return;
    const home=cardHome(i), k=eo(a/.45);
    if(i===PICK){ const f=ecub((t-T.lock-.05)/.42);
      m.position.set(lerp(home.x,0,f), lerp(home.y-80*(1-k),0,f), lerp(home.z-500*(1-k),12,f)); m.scale.setScalar(lerp(1,1.8,f)); m.rotation.set(0,0,0);
      m.material.opacity=k*(1-sm(T.pick-.02,T.pick+.22,t)); }
    else { const g=eio((t-T.lock-.02)/.4);
      m.position.set(home.x*(1+.25*g), home.y-80*(1-k)-60*g, home.z-500*(1-k)-260*g); m.rotation.set(0,(home.x>0?-1:home.x<0?1:0)*.12*(1-k),0);
      m.material.opacity=k*(1-g); } });
  { const order=[0,2,4,PICK], times=[cs0+.35,cs0+.5,cs0+.62,T.lock]; let j=0; while(j<order.length-1 && t>=times[j+1]) j++;
    pick.visible = t>cs0+.3 && t<T.lock+.38;
    if(pick.visible){ const hp=cardHome(order[j]); pick.position.set(hp.x,hp.y,hp.z+1.5); const lk=t>=T.lock?eo((t-T.lock)/.2):0;
      pick.scale.setScalar(lerp(1.06,1,lk)); pick.material.opacity=(t>=T.lock? 1-sm(T.lock+.2,T.lock+.38,t) : .75); pick.material.color.set(t>=T.lock?0xE9D5FF:0xA35BEF); } }
  // editor de curvas
  const gu=t-T.anim; graph.visible = gu>-0.05 && t<T.s6+.3;
  if(graph.visible){ const k=eo(gu/.4), o=1-sm(T.s6-.2,T.s6+.3,t); graph.scale.setScalar(lerp(.7,1,k)); graph.position.z=200+lerp(-200,0,k);
    gp.material.opacity=.86*k*o; gframe.material.opacity=k*o; tube.material.opacity=1; graph.children.forEach(c=>{ if(c.material){ c.material.transparent=true; if(c!==gp) c.material.opacity=k*o; } });
    const cyc=((gu)%1.15)/1.0; const pr=ecub(clamp(cyc,0,1)); dot.position.copy(curve.getPoint(pr)); dot.position.z=6; }

  // câmera
  const [cp,cq]=camAt(t); C.position.copy(cp); C.lookAt(cq); C.updateMatrixWorld();
  // pós: bloom no escuro; foco raso só no gancho (barras em primeiro plano)
  const heroK=sm(T.hero-.4,T.hero,t)*(1-sm(T.heroOut,T.heroOut+.3,t));
  bloom.strength=lerp(.42,.0,lite)*(1-.75*heroK)+.25*Math.exp(-Math.pow((t-T.sweep1)/.35,2));
  const hook=1-sm(T.s2-.2,T.s2+.4,t);
  bokeh.uniforms.focus.value=cp.distanceTo(cq); bokeh.uniforms.aperture.value=hook*0.000022;
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!idleTex){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
