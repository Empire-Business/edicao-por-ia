const blankTex=new THREE.DataTexture(new Uint8Array([10,14,20,255]),1,1); blankTex.needsUpdate=true;
const clearTex=new THREE.DataTexture(new Uint8Array([0,0,0,0]),1,1); clearTex.needsUpdate=true;
function videoTex(){ const tx=new THREE.Texture(); tx.colorSpace=THREE.SRGBColorSpace; tx.minFilter=THREE.LinearFilter; tx.generateMipmaps=false; return tx; }
function stripTex(left,right){ const P=ctex(760,96); const g=P.g; g.clearRect(0,0,760,96); g.textBaseline='middle';
  g.font='500 30px Plex'; g.fillStyle=NAVY; g.fillText(left,2,50); g.font='600 28px Inter'; g.fillStyle=BLUE_D; g.textAlign='right'; g.fillText(right,758,50); P.t.needsUpdate=true; return P.t; }
function bigTabTex(code,name){ const P=ctex(560,96); const g=P.g; g.fillStyle=PAPER; g.fillRect(0,0,560,96); g.textBaseline='middle';
  g.font='500 50px Plex'; g.fillStyle=BLUE_D; g.fillText(code,26,52); g.font='700 34px Inter'; g.fillStyle=NAVY; g.fillText(name.toUpperCase(),150,52); P.t.needsUpdate=true; return P.t; }
const CARDS={};
function makeCard(key,code,name,left,right){
  const g=new THREE.Group(); g.visible=false; S.add(g);
  const bm=paperMat(); const body=new THREE.Mesh(new RoundedBoxGeometry(CW,CH,5,3,12),bm); body.castShadow=true; g.add(body);
  const vm=vidMat(); const vid=new THREE.Mesh(new THREE.PlaneGeometry(VW,VH),vm); vid.position.set(0,CH/2-20-VH/2,2.8); g.add(vid);
  const tabW=280, tabH=48; const tb=new THREE.Mesh(new RoundedBoxGeometry(tabW,tabH+14,5,3,8),bm); tb.position.set(-CW/2+tabW/2+16,CH/2+tabH/2-6,0); g.add(tb);
  const tt=new THREE.Mesh(new THREE.PlaneGeometry(tabW-12,tabH-4),new THREE.MeshBasicMaterial({map:null,transparent:true})); tt.position.set(-CW/2+tabW/2+16,CH/2+tabH/2-2,2.8); g.add(tt);
  const st=new THREE.Mesh(new THREE.PlaneGeometry(VW,48),new THREE.MeshBasicMaterial({map:null,transparent:true})); st.position.set(0,-CH/2+33,2.8); g.add(st);
  const sel=new THREE.Mesh(ring(CW,CH,14,7),new THREE.MeshBasicMaterial({color:new THREE.Color(BLUE),transparent:true,opacity:0})); sel.position.z=3.2; g.add(sel);
  g.userData={key,code,name,left,right,bm,vm,tt,st,sel,tx:videoTex()}; vm.uniforms.tex.value=g.userData.tx; vm.uniforms.ov.value=clearTex;
  CARDS[key]=g; return g; }
DATA.cards.forEach(c=>makeCard(c.key,c.code,c.name,c.left,c.right));
// F05 (sem entrega própria): cartão desenhado do catálogo
const illus=ctex(432,768);
function drawIllus(t,u){ const g=illus.g; g.fillStyle='#1B2433'; g.fillRect(0,0,432,768);
  g.fillStyle='#EDE9DF'; g.fillRect(36,70,360,250); g.fillStyle='#C9C3B4'; for(let k=0;k<5;k++) g.fillRect(56,96+k*40,320-(k%2)*60,16);
  g.fillStyle='#67ACE0'; g.fillRect(56,96,lerp(0,250,u),16);
  g.font='800 46px Inter'; g.fillStyle=INK; g.fillText('NOTÍCIA',36,400); g.fillText('COMENTADA',36,452);
  g.fillStyle='#9AA8B8'; for(let k=0;k<4;k++) g.fillRect(36,488+k*30,300-k*40,12);
  g.strokeStyle='#67ACE0'; g.lineWidth=4; g.strokeRect(36,640,360,70); g.font='500 22px Plex'; g.fillStyle='#67ACE0'; g.textAlign='center'; g.fillText('FORMATO DO CATÁLOGO · F05',216,683); g.textAlign='left';
  illus.t.needsUpdate=true; }
// sobreposição de cor (amostras das IDs) na ficha F22
const ovl=ctex(432,768);
function drawOverlay(id,a){ const g=ovl.g; g.clearRect(0,0,432,768); if(!id||a<=0.001){ ovl.t.needsUpdate=true; return; }
  const fam=id.font==='Libre Baskerville'?'Libre':(id.font==='Manrope'?'Manrope':'Inter');
  g.fillStyle=id.bg; g.globalAlpha=.94; g.fillRect(0,548,432,152); g.globalAlpha=1;
  g.fillStyle=id.primary; g.fillRect(0,548,12,152);
  g.font=`700 44px ${fam}`; g.fillStyle=id.text; g.fillText('Corte de live',34,612);
  g.font='500 22px Plex'; g.fillStyle=id.primary; g.fillText(id.code+' · '+id.name.toUpperCase(),34,662);
  ovl.t.needsUpdate=true; }

// ---------- leque de amostras das IDs ----------
const fan=new THREE.Group(); fan.visible=false; S.add(fan);
const STR=[]; const SW=76, SH=470;
DATA.ids.forEach((id,j)=>{ const P=ctex(152,940); const g=P.g; g.fillStyle=PAPER; g.fillRect(0,0,152,940);
  g.fillStyle=id.primary; g.fillRect(10,10,132,380); g.fillStyle=id.bg; g.fillRect(10,396,132,210); g.fillStyle=id.surface; g.fillRect(10,612,132,140);
  g.strokeStyle='rgba(20,27,37,.18)'; g.lineWidth=2; g.strokeRect(10,612,132,140);
  g.save(); g.translate(76,846); g.font='500 40px Plex'; g.fillStyle=NAVY; g.textAlign='center'; g.fillText(id.code,0,8); g.restore();
  g.font='600 22px Inter'; g.fillStyle='#46546A'; g.textAlign='center'; g.fillText(id.name,76,900); P.t.needsUpdate=true;
  const piv=new THREE.Group(); fan.add(piv);
  const m=new THREE.Mesh(new RoundedBoxGeometry(SW,SH,2.4,2,6),new THREE.MeshStandardMaterial({map:P.t,roughness:.85})); m.position.y=SH/2-30; m.castShadow=true; piv.add(m);
  const sl=new THREE.Mesh(ring(SW,SH,6,5),new THREE.MeshBasicMaterial({color:new THREE.Color(BLUE),transparent:true,opacity:0})); sl.position.set(0,SH/2-30,1.6); piv.add(sl);
  piv.userData={m,sl}; STR.push(piv); });
{ const pin=new THREE.Mesh(new THREE.CylinderGeometry(10,10,14,20),metalMat); pin.rotation.x=Math.PI/2; pin.position.z=10; fan.add(pin); }

// ---------- carregamento ----------
const SEQ={}; let READY=null, BUILT=false;
function loadImg(src,k){ k=k||0; return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>{ if(k<4) setTimeout(()=>loadImg(src,k+1).then(res,rej),150*(k+1)); else rej(new Error(src)); }; im.src=src+(k?('?r='+k):''); }); }
function loopOf(name,t,t0){ const a=SEQ[name]; const i=Math.floor(Math.max(0,(t-t0))*30+1e-6); return a[i%a.length]; }
function holdOf(name,t,t0){ const a=SEQ[name]; const i=Math.floor(Math.max(0,(t-t0))*30+1e-6); return a[Math.min(i,a.length-1)]; }
function setFrame(tx,img){ if(tx.image!==img){ tx.image=img; tx.needsUpdate=true; } }
function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.ready];
  ['800 118px Inter','700 44px Inter','600 31px Inter','500 46px Plex','700 44px Libre','700 44px Manrope'].forEach(f=>jobs.push(document.fonts.load(f)));
  Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  READY=Promise.all(jobs).then(()=>{
    DR.forEach((g,i)=>{ const u=g.userData; u.lab.material.map=labelTex(FMT[i].code,FMT[i].name); u.lab.material.needsUpdate=true; u.tab.material.map=tabTex(FMT[i].code); u.tab.material.transparent=true; u.tab.material.needsUpdate=true; });
    Object.values(CARDS).forEach(g=>{ const u=g.userData; u.tt.material.map=bigTabTex(u.code,u.name); u.tt.material.needsUpdate=true; u.st.material.map=stripTex(u.left,u.right); u.st.material.needsUpdate=true; });
    drawPlate(-2); drawIllus(0,0); BUILT=true; }); return READY; }

// ---------- poses ----------
const tmpQ=new THREE.Quaternion(), tmpE=new THREE.Euler();
function camPose(dist,ox,oy){ // pose diante da câmera: largura aparente = CW*D/dist; deslocamento em px da tela
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(C.quaternion), right=new THREE.Vector3(1,0,0).applyQuaternion(C.quaternion), up=new THREE.Vector3(0,1,0).applyQuaternion(C.quaternion);
  const k=dist/D; const p=C.position.clone().addScaledVector(fwd,dist).addScaledVector(right,ox*k).addScaledVector(up,oy*k);
  return {p,q:C.quaternion.clone(),s:1}; }
function lowPose(slot,pull){ const sp=slotPos(slot); return {p:new THREE.Vector3(sp.x,sp.y-4,pull-110),q:new THREE.Quaternion().setFromEuler(tmpE.set(-.10,0,0)),s:0.13}; }
function restPose(slot,pull,rise,tilt){ const sp=slotPos(slot); const s=0.30; const h=CH*s;
  const p=new THREE.Vector3(sp.x,sp.y-DH/2+12+h/2+rise,pull-110);
  return {p,q:new THREE.Quaternion().setFromEuler(tmpE.set(-tilt,0,0)),s}; }
function mixPose(a,b,u,arc){ const p=a.p.clone().lerp(b.p,u); if(arc) p.y+=arc*Math.sin(Math.PI*u); return {p,q:a.q.clone().slerp(b.q,u),s:lerp(a.s,b.s,u)}; }
function apply(g,P){ g.position.copy(P.p); g.quaternion.copy(P.q); g.scale.setScalar(P.s); }

// ---------- quadro ----------
const RT=[0,1,2].map(()=>new THREE.WebGLRenderTarget(540,960,{type:THREE.HalfFloatType}));
const NAMES=DATA.names;   // [{slot,key,t}]
const SEQKEY={f02:'talk',f13:'f13',f22:'live',f12:'doc',f07:'motion'};
function render(t){
  // ----- câmera
  const wide={tx:0,ty:-40,yaw:.24,pitch:.11,dist:D*1.06};
  const st={tx:-342+110,ty:380-60,yaw:.56,pitch:.16,dist:D*.40};
  const mixc=(s,u)=>{ for(const k in s) st[k]=lerp(st[k],s[k],u); };
  mixc(wide,eio((t-0.25)/1.55));
  mixc({tx:0,ty:-10,yaw:.30,pitch:.13,dist:D*1.0},sm(T.names0-.3,T.escolhe,t)*.6);
  mixc({tx:-30,ty:-20,yaw:.20,pitch:.10,dist:D*1.04},eio((t-T.escolhe+.2)/.8));
  mixc({tx:-20,ty:-60,yaw:.40,pitch:.20,dist:D*1.06},eio((t-T.cortez+.1)/1.3));
  mixc({tx:20,ty:-30,yaw:.18,pitch:.12,dist:D*1.02},eio((t-T.sim+.1)/.8));
  mixc({tx:0,ty:DATA.cta==='comment'?590:345,yaw:.16,pitch:.10,dist:D*1.26},eio((t-T.cta0+.05)/1.3));
  const drift=0.02*Math.sin(t*0.5);
  const tgt=new THREE.Vector3(st.tx,st.ty,0), yaw=st.yaw+drift, pitch=st.pitch;
  C.position.set(tgt.x+st.dist*Math.sin(yaw)*Math.cos(pitch), tgt.y+st.dist*Math.sin(pitch), tgt.z+st.dist*Math.cos(yaw)*Math.cos(pitch)); C.lookAt(tgt); C.updateMatrixWorld();
  key.target.position.copy(tgt);

  // ----- gavetas: onda do gancho, puxadas dos formatos citados, cascata final
  const pulls=new Array(22).fill(0);
  for(let i=0;i<22;i++){ const r=Math.floor(i/4), c=i%4; const d=(r+c)*0.055;
    pulls[i]+=46*Math.max(0,Math.sin(Math.PI*clamp((t-0.95-d)/0.55,0,1)));                       // onda no "vinte e dois"
    pulls[i]+=34*Math.max(0,Math.sin(Math.PI*clamp((t-T.cta0-1.0-d*1.6)/0.7,0,1)))+34*Math.max(0,Math.sin(Math.PI*clamp((t-T.cta0-2.6-d*1.6)/0.7,0,1)));   // ondas leves no CTA
    const cd=(r*4+c)*0.035; pulls[i]+=165*ebk((t-T.cortez-.35-cd)/.5)*(1-eio((t-T.sim+.35-cd*.4)/.45)); }   // cascata no "Eu sou o Cortez"
  const open={};
  NAMES.forEach(n=>{ open[n.slot]=Math.max(open[n.slot]||0, 250*ebk((t-n.t+.30)/.34)*(1-eio((t-T.cortez+.25)/.45))); });
  const f10=DATA.f10slot; open[f10]=Math.max(open[f10]||0, 260*ebk((t-T.sim-.05)/.38)*(1-eio((t-T.cta0-.2)/.6)));
  DR.forEach((g,i)=>{ const p=Math.max(pulls[i],open[i]||0); g.userData.mv.position.z=p; });
  drawPlate(lerp(-.4,1.4,clamp((t-T.cortez-.55)/0.9,0,1)));

  // ----- fichas grandes
  const heroC=camPose(D*CW/640,0,95), heroL=camPose(D*CW/560,-150,90);
  Object.values(CARDS).forEach(g=>{ g.visible=false; g.userData.sel.material.opacity=0; g.userData.vm.uniforms.ova.value=0; g.userData.vm.uniforms.dim.value=0; });
  NAMES.forEach((n,k)=>{ const g=CARDS[n.key]; const u=g.userData; const nx=k+1<NAMES.length?NAMES[k+1].t:T.escolhe;
    const pull=open[n.slot]||0; const low=lowPose(n.slot,pull), rest=restPose(n.slot,pull,0,.16);
    if(t<n.t-.24) return;
    let P;
    const a=eo((t-n.t+.24)/.22);                                // sobe da gaveta
    const b=eio((t-n.t+.10)/.38);                               // voa até a frente
    const back=eio((t-nx+.16)/.34);                             // volta para a gaveta
    P=mixPose(low,rest,a); if(b>0) P=mixPose(P,heroC,b,60*(1-back)); if(back>0) P=mixPose(P,rest,back,40);
    // no "Eu sou o Cortez" a ficha volta para dentro da gaveta
    const hide=eio((t-T.cortez+.3)/.4); if(hide>0) P=mixPose(P,low,hide);
    if(hide>=.999) return;
    if(n.key==='f22' && t>=T.escolhe-.4) return;              // a F22 tem a própria coreografia
    P.p.y+=4*Math.sin(t*2.2+k)*b*(1-back); apply(g,P); g.visible=true;
    if(n.key==='f05') { drawIllus(t,sm(n.t,n.t+.5,t)); u.vm.uniforms.tex.value=illus.t; }
    else setFrame(u.tx,loopOf(SEQKEY[n.key],t,n.t-.25));
  });
  // F22: escolhida ("Você escolhe o formato"), leque de cores, "eu edito no estilo que você quiser"
  { const g=CARDS.f22, u=g.userData; const slot=DATA.f22slot; const pull=open[slot]||0;
    if(t>=T.escolhe-.4 && t<T.cortez+.2){
      const rest=restPose(slot,pull,0,.16), low=lowPose(slot,pull);
      let P=mixPose(rest,heroC,eio((t-T.escolhe+.38)/.45),70);
      P=mixPose(P,heroL,eio((t-T.cores0+.25)/.45));
      P=mixPose(P,heroC,eio((t-T.estilo+.1)/.5));
      P=mixPose(P,low,eio((t-T.cortez+.3)/.45),50);
      P.p.y+=5*Math.sin(t*2.0); apply(g,P); g.visible=true;
      u.sel.material.opacity=sm(T.escolhe-.1,T.escolhe+.2,t)*(1-sm(T.cores0-.1,T.cores0+.2,t));
      // ID escolhida no leque (ou nenhuma)
      let idx=-1; DATA.picks.forEach(pk=>{ if(t>=pk.t) idx=pk.id; });
      const ova=sm(T.cores0,T.cores0+.15,t)*(1-sm(T.estilo+.7,T.estilo+1.1,t));
      drawOverlay(idx>=0?DATA.ids[idx]:null,ova); u.vm.uniforms.ov.value=ovl.t; u.vm.uniforms.ova.value=ova;
      const play=t>=T.edito; setFrame(u.tx, play?holdOf('hero',t,T.edito):SEQ.hero[0]);
      // papel da ficha assume a superfície da ID escolhida
      const surf=idx>=0?new THREE.Color(DATA.ids[idx].surface):new THREE.Color('#ffffff'); u.bm.color.lerp(surf,0.35); if(ova<=0.001) u.bm.color.lerp(new THREE.Color('#ffffff'),.5);
    } else { u.bm.color.set('#ffffff'); }
  }
  // F10: este vídeo (recursão)
  const gD=CARDS.f10, uD=gD.userData; let droste=false;
  if(t>=T.sim-.05){
    const pull=open[f10]||0; const low=lowPose(f10,pull), rest=restPose(f10,pull,0,.16);
    let P=mixPose(low,rest,eo((t-T.sim-.05)/.25));
    P=mixPose(P,heroC,eio((t-T.sim-.22)/.5),70);
    const push=eio((t-T.tambem+.05)/(T.cta0-T.tambem-.05));
    P=mixPose(P,camPose(D*VW/1010,0,-58),push*0.92);
    const out=eio((t-T.cta0)/.8); if(out>0) P=mixPose(P,low,out,90);
    if(out<.999){ apply(gD,P); gD.visible=true; droste=true; } }

  // ----- leque das IDs
  const fo=eio((t-T.cores0+.35)/.5)*(1-eio((t-T.estilo+.05)/.4));
  fan.visible=fo>0.002;
  if(fan.visible){ const P=camPose(D*.92,lerp(760,350,fo),-300); fan.position.copy(P.p); fan.quaternion.copy(P.q);
    let idx=-1, tp=-9; DATA.picks.forEach(pk=>{ if(t>=pk.t){ idx=pk.id; tp=pk.t; } });
    STR.forEach((piv,j)=>{ const ang=lerp(.05,.62-j*.165,eo((t-T.cores0+.3-j*.03)/.6))*fo; piv.rotation.z=ang;
      const on=j===idx; const pop=on?eo((t-tp)/.18):0; piv.userData.m.position.y=SH/2-30+60*pop; piv.userData.sl.position.y=SH/2-30+60*pop; piv.userData.sl.material.opacity=on?1:0; piv.position.z=j*3.2; }); }

  // ----- foco, brilho e render (com recursão da ficha F10)
  let subj=null; const anyHero=Object.values(CARDS).find(g=>g.visible && g.position.distanceTo(C.position)<D*0.8);
  if(anyHero) subj=anyHero.position.clone(); else subj=tgt.clone();
  bokeh.uniforms.focus.value=C.position.distanceTo(subj);
  bokeh.uniforms.aperture.value=(anyHero?0.0000075:0.0000022)*(1-sm(T.cta0,T.cta0+.6,t))+0.0000040*(1-sm(0.2,1.3,t));
  bloom.strength=0.09+0.10*gauss(t,T.cortez+.9,.3);
  if(droste){ // níveis internos usam a ficha na pose de apresentação (assim o mergulho nunca mostra um quadro vazio)
    const sv={p:gD.position.clone(),q:gD.quaternion.clone(),s:gD.scale.x}; apply(gD,heroC);
    uD.vm.uniforms.tex.value=blankTex; R.setRenderTarget(RT[0]); R.render(S,C);
    uD.vm.uniforms.tex.value=RT[0].texture; R.setRenderTarget(RT[1]); R.render(S,C);
    uD.vm.uniforms.tex.value=RT[1].texture; R.setRenderTarget(RT[2]); R.render(S,C); R.setRenderTarget(null);
    apply(gD,sv); uD.vm.uniforms.tex.value=RT[2].texture; }
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!BUILT){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
