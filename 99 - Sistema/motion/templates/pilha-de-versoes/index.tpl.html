    emissive:0x25D366,emissiveIntensity:0,transparent:true,opacity:.95}));
  g.add(m);
  const lb=new THREE.Mesh(new THREE.PlaneGeometry(200,26),new THREE.MeshBasicMaterial({transparent:true,toneMapped:false,map:canvasTex(200,26,(c,w,h)=>{
    c.font='500 20px Plex, monospace'; c.textBaseline='middle'; c.letterSpacing='2px'; c.fillStyle='#25D366'; c.fillText('V'+(k+1),4,14);
    c.fillStyle='#C9D4D9'; c.fillText(k===0?'· ORIGINAL':'· AJUSTE',44,14); })}));
  lb.position.set(-PW/2+118,0,PD/2+0.8); g.add(lb);
  const edge=new THREE.Mesh(new THREE.PlaneGeometry(PW-24,2.5),new THREE.MeshBasicMaterial({color:0x25D366,transparent:true,opacity:.5,toneMapped:false}));
  edge.position.set(0,PH/2-1,PD/2+0.9); g.add(edge);
  g.userData={m,lb,edge}; S.add(g); return g; });

// ---------- calendário: dois dias que dobram e somem ----------
function calFace(n){ return canvasTex(250,270,(g,w,h)=>{ g.fillStyle='#202C33'; g.beginPath(); g.roundRect(0,0,w,h,22); g.fill();
  g.fillStyle='#25D366'; g.beginPath(); g.roundRect(0,0,w,64,[22,22,0,0]); g.fill();
  g.font='500 24px Plex, monospace'; g.fillStyle='#0B141A'; g.textAlign='center'; g.textBaseline='middle'; g.letterSpacing='3px'; g.fillText('DIA',w/2,33);
  g.font='800 150px Inter'; g.fillStyle='#E9EDEF'; g.letterSpacing='-4px'; g.fillText(String(n),w/2,170);
  g.font='500 18px Plex, monospace'; g.fillStyle='#AEBAC1'; g.letterSpacing='2px'; g.fillText('ESPERANDO O EDITOR',w/2,246); }); }
const cals=[1,2].map((n,k)=>{ const pv=new THREE.Group(); S.add(pv);
  const box=new THREE.Mesh(new RoundedBoxGeometry(250,270,40,3,14),new THREE.MeshPhysicalMaterial({color:0x1A262C,metalness:.3,roughness:.35,clearcoat:.8}));
  box.position.y=135; pv.add(box);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(250,270),new THREE.MeshBasicMaterial({map:calFace(n),transparent:true,toneMapped:false}));
  face.position.set(0,135,20.6); pv.add(face); pv.visible=false; return pv; });

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.ready, document.fonts.load('500 20px Plex'), document.fonts.load('800 92px Inter')];
  const todo=[]; Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) todo.push([name,i]); });
  let next=0; const worker=()=>{ if(next>=todo.length) return Promise.resolve(); const [name,i]=todo[next++];
    return loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>{ SEQ[name][i]=im; return worker(); }); };
  for(let k=0;k<16;k++) jobs.push(worker());
  READY=Promise.all(jobs).then(()=>{
    // texturas desenhadas em canvas dependem das fontes: redesenha depois que carregaram
    capPlate.material.map=canvasTex(560,220,(g,w,h)=>{ g.fillStyle='rgba(11,20,26,.985)'; g.beginPath(); g.roundRect(0,0,w,h,26); g.fill();
      g.fillStyle='#FFFFFF'; g.font='800 92px Inter'; g.textAlign='center'; g.textBaseline='alphabetic'; g.letterSpacing='-2px';
      g.fillText('a agenda',w/2,98); g.fillStyle='#25D366'; g.fillText('esvazia',w/2,192); });
    chin.material.map=canvasTex(560,34,(g,w,h)=>{ g.fillStyle='#25D366'; g.beginPath(); g.arc(9,17,5,0,Math.PI*2); g.fill();
      g.font='500 17px Plex, monospace'; g.fillStyle='#AEBAC1'; g.textBaseline='middle'; g.letterSpacing='1px'; g.fillText('ENTREGA REAL · EXEMPLO_2 · EDITADA PELO CORTEZ',24,18); });
    trkF.material.map=trackFace('♪ TRILHA 1',DATA.bars.a,'#5E7A73','#AEBAC1'); trkB.material.map=trackFace('♪ TRILHA 2 · NOVA',DATA.bars.b,'#25D366','#25D366');
    plates.forEach((g,k)=>{ g.userData.lb.material.map=canvasTex(200,26,(c,w,h)=>{ c.font='500 20px Plex, monospace'; c.textBaseline='middle'; c.letterSpacing='2px';
      c.fillStyle='#25D366'; c.fillText('V'+(k+1),4,14); c.fillStyle='#C9D4D9'; c.fillText(k===0?'· ORIGINAL':'· AJUSTE',44,14); }); });
    cals.forEach((pv,k)=>{ pv.children[1].material.map=calFace(k+1); });
    [capPlate,chin,trkF,trkB,...plates.map(p=>p.userData.lb),...cals.map(c=>c.children[1])].forEach(m=>m.material.needsUpdate=true);
    BUILT=true; });
  return READY; }

// ---------- pilha: quantas placas já entraram (contínuo) ----------
function stackN(t){ let n=1; for(let k=1;k<NP;k++){ n+=eio((t-(LAND[k]-0.26))/0.26); } return n; }
const scrY=(n)=>FLOOR+PH*n+BH/2+2;

// ---------- câmera ----------
function camAt(t,ys){
  // alvo em função do centro desejado da tela na imagem (px) e da distância (escala): ty = ys - (960 - cy)*pz/D
  const K=(pz,cy)=>ys-(960-cy)*pz/D;
  const st={px:170,py:0,pz:D*1.1,tx:0,ty:K(D*1.1,800)};
  const mix=(s,u)=>{ for(const k in s) st[k]=lerp(st[k],s[k],u); };
  mix({px:70,pz:D*1.06,ty:K(D*1.06,792)},sm(0,T.mf1,t));                                              // aproximação lenta no gancho
  mix({px:-60,pz:D*1.03,ty:K(D*1.03,782)},eio((t-T.leg+0.25)/0.7));                                  // a legenda
  mix({px:50,pz:D*1.05,ty:K(D*1.05,768)},eio((t-T.mus+0.3)/0.7));                                      // a faixa de áudio
  mix({px:-600,pz:D*1.2,tx:30,ty:K(D*1.2,720)},eio((t-T.cortez+0.15)/1.1));                          // recua e gira: profundidade da pilha
  mix({px:520,pz:D*1.32,tx:0,ty:K(D*1.32,690)},eio((t-T.quantas+0.1)/1.0));                          // a pilha de versões cresce
  mix({px:0,pz:D*1.2,ty:K(D*1.2,760)},eio((t-T.esperar+0.25)/0.8));                                  // frontal: dois dias
  mix({px:110,pz:D*1.45,ty:K(D*1.45,1010)},eio((t-T.cta0)/3.2));                                     // deriva no CTA
  st.py=st.ty+lerp(260,620,sm(T.cortez,T.quantas+0.8,t))-lerp(0,300,sm(T.esperar,T.esperar+0.8,t));
  const punch=(gauss(t,T.mf1+0.06,0.09)+gauss(t,T.mf2+0.06,0.09)+gauss(t,T.mf3+0.06,0.09));
  C.position.set(st.px,st.py,st.pz-punch*150); C.lookAt(st.tx,st.ty,st.tz||0);
}

const up=new THREE.Vector3(), p0=new THREE.Vector3(), qq=new THREE.Quaternion();
function render(t){
  const n=stackN(t), ys=scrY(n);
  // tela: leve giro no gancho, balanço discreto depois
  scr.position.set(0,ys,0);
  scr.rotation.set(0.0,lerp(-0.16,0,eo(t/1.4))+0.025*Math.sin(t*0.9)*sm(T.mf1,T.mf1+1,t),0);
  camAt(t,ys);
  // conteúdo da tela
  // conteúdo: v1 → (varredura descendo no "fala." 1) call center → (varredura subindo no "Cortez") entrega tocando
  const W2=T.cortez-0.02;                                              // segunda varredura
  const xf=sm(W2-0.3,W2-0.05,t);                                       // placa de legenda e faixa saem antes da segunda varredura
  setFrame(TX.base, t<W2+0.5 ? frameOf('cc',t,T.mf1) : frameOf('fin',t,W2));
  const w1=t<T.mf1+0.42, w2=t>=W2;
  if(w1) setFrame(TX.top, frameOf('v1',t,0)); else setFrame(TX.top, frameOf('fin',t,W2));
  topMat.opacity=1; top.visible=w1||w2;
  // linha: no 1º desce (topo → base, mostra a cena nova acima da linha); no 2º sobe (base → topo, mostra a entrega abaixo da linha)
  const wp=eio((t-T.mf1+0.02)/0.4), wq=eio((t-W2)/0.45);
  const yl=w1?(CH/2)-(CH+20)*wp:(-CH/2-10)+(CH+20)*wq;
  scr.updateMatrixWorld(true);
  if((w1)||(w2&&wq<1)){ qq.setFromRotationMatrix(scr.matrixWorld); up.set(0,1,0).applyQuaternion(qq);
    p0.set(0,CY+yl,0).applyMatrix4(scr.matrixWorld); wipePlane.setFromNormalAndCoplanarPoint(up.clone().negate(),p0); }
  else { wipePlane.set(new THREE.Vector3(0,1,0),1e7); }
  const so1=(t>=T.mf1-0.02 && t<T.mf1+0.45)?1-sm(T.mf1+0.32,T.mf1+0.45,t):0;
  const so2=(t>=W2-0.02 && t<W2+0.5)?1-sm(W2+0.36,W2+0.5,t):0;
  const so=Math.max(so1,so2);
  scanGlow.rotation.z=w1?0:Math.PI;
  scanLine.position.y=CY+yl; scanGlow.position.y=CY+yl+(w1?45:-45); scanLine.material.opacity=so; scanGlow.material.opacity=0.9*so;
  // cantoneiras: tela inteira → legenda → faixa de áudio
  const bo=(1-sm(T.cortez-0.25,T.cortez+0.05,t)); brMat.opacity=bo;
  const snap=1+0.16*Math.exp(-t*7)+0.05*gauss(t,T.cena+0.1,0.12);
  let r={...RECT.full}; r.w*=snap; r.h*=snap;
  const toCap=eio((t-T.leg+0.05)/0.38), grow=eio((t-T.mf2)/0.42), toTrk=eio((t-T.mus+0.05)/0.38);
  const L=(a,b,u)=>({x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u),w:lerp(a.w,b.w,u),h:lerp(a.h,b.h,u)});
  r=L(r,RECT.cap,toCap); r=L(r,RECT.cap2,grow*(toCap>0.99?1:0)); r=L(r,RECT.trk,toTrk);
  corners.forEach(g=>{ const {sx,sy}=g.userData; g.position.set(r.x+sx*r.w/2,r.y+sy*r.h/2,0); });
  // placa de legenda maior
  const cp=t>=T.mf2-0.02 ? 1:0; const cs=lerp(0.52,1,bk((t-T.mf2)/0.42));
  capPlate.material.opacity=cp*clamp((t-T.mf2+0.02)/0.08,0,1)*(1-xf); capPlate.scale.setScalar(cs); capPlate.visible=cp>0 && xf<0.999;
  // faixa de áudio: aparece na pergunta, vira no "fala." 3, some quando entra a entrega final
  const ta=eo((t-T.mus+0.5)/0.35)*(1-xf); const flip=eio((t-T.mf3+0.02)/0.4);
  trk.visible=ta>0.002; trk.scale.set(1,Math.max(0.001,ta),1); trk.rotation.x=Math.PI*flip;
  trkF.material.opacity=ta; trkB.material.opacity=ta;
  const ph=((t-T.mus+0.5)*0.22)%1; playhead.position.x=lerp(-258,258,ph); playhead.material.opacity=0.85*ta*(flip<0.05||flip>0.95?1:0);
  playhead.position.z=flip>0.5?-1.2:1.2;
  // placas de versão
  for(let k=0;k<NP;k++){ const g=plates[k]; const land=k===0?1:eio((t-(LAND[k]-0.3))/0.3);
    g.visible=k===0||t>=LAND[k]-0.34;
    const yk=FLOOR+PH*k+PH/2;
    g.position.set(lerp(-1400,0,land),yk+(land>=1&&k>0?-2.5*settle(t-LAND[k]):0),lerp(380,0,land));
    g.rotation.y=lerp(0.35,0,land);
    const glow=k===0?0:gauss(t,LAND[k]+0.08,0.22);
    g.userData.m.material.emissiveIntensity=0.02+0.35*glow; g.userData.edge.material.opacity=0.35+0.65*glow; }
  shStack.scale.set(1,1,1); shStack.material.opacity=0.85;
  // calendário: dois dias entram e dobram até sumir
  cals.forEach((pv,k)=>{ const t0=T.esperar-0.05+k*0.12; const din=bk((t-t0)/0.45); const fold=eio((t-(T.diasEnd-0.2)-k*0.06)/0.42);
    pv.visible=t>=t0-0.02 && fold<0.999;
    const x=k===0?-350:350; pv.position.set(x,ys+190+lerp(900,0,din),300); pv.rotation.set(-Math.PI/2*fold,(k===0?0.2:-0.2),0);
    pv.scale.setScalar(Math.max(0.001,1-fold)); });
  // brilho
  bloom.strength=0.1+0.14*so+0.06*(gauss(t,T.mf1+0.05,0.12)+gauss(t,T.mf2+0.05,0.12)+gauss(t,T.mf3+0.05,0.12))+0.05*sm(0.2,0.45,t)*(1-xf);
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!BUILT){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
