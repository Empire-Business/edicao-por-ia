function txtTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
const TAGS=PEAKS.map((u,i)=>{ const grp=new THREE.Group(); S.add(grp); const y=BASEY+heightAt(0,u);
  const tex=txtTex(256,96,(g,w,h)=>{ g.fillStyle='rgba(12,17,24,.88)'; g.beginPath(); g.roundRect(4,8,w-8,h-16,40); g.fill(); g.strokeStyle=BLUE; g.lineWidth=4; g.stroke();
    g.font='500 46px Plex'; g.fillStyle=INK; g.textAlign='center'; g.textBaseline='middle'; g.fillText(String(i+1).padStart(2,'0'),w/2,h/2+2); });
  const lab=new THREE.Mesh(new THREE.PlaneGeometry(128,48),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,fog:false})); grp.add(lab);
  const stem=new THREE.Mesh(new THREE.PlaneGeometry(3,200),new THREE.MeshBasicMaterial({color:new THREE.Color(BLUE_L),transparent:true,depthWrite:false,fog:false})); grp.add(stem);
  grp.userData={u,y,lab,stem,tex}; grp.visible=false; return grp; });

// ---------- vídeo longo (16:9) ----------
const SEQ={}; let READY=null, BUILT=false;
function loadImg(src,n=0){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>{ if(n<6) setTimeout(()=>loadImg(src,n+1).then(res,rej),120*(n+1)); else rej(new Error(src)); }; im.src=src; }); }
function loopOf(name,t,t0){ const a=SEQ[name]; const i=Math.floor(Math.max(0,(t-t0))*30+1e-6); const n=a.length, p=i%(2*n-2); return a[p<n?p:2*n-2-p]; }
function frameOf(name,t,t0){ const a=SEQ[name]; const i=Math.floor(Math.max(0,(t-t0))*30+1e-6); return a[Math.min(i,a.length-1)]; }
function videoTex(){ const tx=new THREE.Texture(); tx.colorSpace=THREE.SRGBColorSpace; tx.minFilter=THREE.LinearFilter; tx.generateMipmaps=false; return tx; }
function setFrame(tx,img){ if(img && tx.image!==img){ tx.image=img; tx.needsUpdate=true; } }
function cardMat(w,h,r){ return new THREE.ShaderMaterial({transparent:true,depthWrite:true,fog:false,
  uniforms:{ta:{value:null},tb:{value:null},mixv:{value:0},wipe:{value:-1},alpha:{value:1},dim:{value:0},size:{value:new THREE.Vector2(w,h)},rad:{value:r},line:{value:new THREE.Color(BLUE_L)}},
  vertexShader:'varying vec2 v; void main(){ v=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:`varying vec2 v; uniform sampler2D ta,tb; uniform float mixv,wipe,alpha,rad,dim; uniform vec2 size; uniform vec3 line;
    float rb(vec2 p,vec2 b,float r){ vec2 q=abs(p)-b+r; return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r; }
    void main(){ vec2 p=(v-0.5)*size; float m=1.0-smoothstep(-1.0,0.6,rb(p,size*0.5,rad)); if(m<0.01) discard;
      vec3 a=texture2D(ta,v).rgb, b=texture2D(tb,v).rgb; vec3 c=mix(a,b,mixv);
      if(wipe>=0.0){ c=v.y<wipe?b:a; float l=(1.0-smoothstep(1.5,4.0,abs(v.y-wipe)*size.y))*step(0.0,wipe)*step(wipe,1.0); c=mix(c,line*1.5,l); }
      c*=1.0-dim; gl_FragColor=vec4(c,m*alpha); }`}); }
const LONG={tx:videoTex()};
const longG=new THREE.Group(); S.add(longG);
{ const W=960,H=540; const m=cardMat(W,H,22); m.uniforms.ta.value=LONG.tx; m.uniforms.tb.value=LONG.tx;
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(W,H),m); longG.add(pl);
  const ed=new THREE.Mesh(ring(W,H,22,4),new THREE.MeshBasicMaterial({color:new THREE.Color(BLUE),transparent:true,opacity:.9,fog:false})); ed.position.z=.6; longG.add(ed);
  const bar=new THREE.Mesh(new THREE.PlaneGeometry(W-60,6),new THREE.MeshBasicMaterial({color:new THREE.Color('#2A3B52'),transparent:true,fog:false})); bar.position.set(0,-H/2-30,0); longG.add(bar);
  const prog=new THREE.Mesh(new THREE.PlaneGeometry(1,6),new THREE.MeshBasicMaterial({color:new THREE.Color(BLUE_L),fog:false})); prog.position.set(-(W-60)/2,-H/2-30,.3); longG.add(prog);
  longG.userData={pl,ed,bar,prog,m}; }

// ---------- os 10 cortes (cartões 9:16) ----------
const CW=300, CH=533;
const SRC=['hero','s1','s2','s3','s4','s5','s6','s7','s8','j'];      // cartão 0 = herói (EXEMPLO_2: sem legenda → legenda → cena); 9 = Reel do Convidado
const CARDS=SRC.map((name,i)=>{ const g=new THREE.Group(); S.add(g); const m=cardMat(CW,CH,24); const ta=videoTex(), tb=videoTex(); m.uniforms.ta.value=ta; m.uniforms.tb.value=tb;
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(CW,CH),m); g.add(pl);
  const ed=new THREE.Mesh(ring(CW,CH,24,3.2),new THREE.MeshBasicMaterial({color:new THREE.Color(i===9?BLUE_L:BLUE),transparent:true,opacity:.9,depthWrite:false,fog:false})); ed.position.z=.5; g.add(ed);
  g.userData={name,m,ta,tb,pl,ed,u:PEAKS[i]}; g.visible=false; return g; });
// faixa "música" do cartão herói (envelope real do áudio do EXEMPLO_2)
const musC=document.createElement('canvas'); musC.width=600; musC.height=140; const musT=new THREE.CanvasTexture(musC); musT.colorSpace=THREE.SRGBColorSpace;
const mus=new THREE.Mesh(new THREE.PlaneGeometry(CW*0.86,CW*0.86*140/600),new THREE.MeshBasicMaterial({map:musT,transparent:true,depthWrite:false,fog:false}));
mus.position.set(0,-CH/2+62,1.2); CARDS[0].add(mus);
function drawMus(t,alpha){ const g=musC.getContext('2d'); g.clearRect(0,0,600,140); musT.needsUpdate=true; if(alpha<=0.001) return; g.save(); g.globalAlpha=alpha;
  g.fillStyle='rgba(12,17,24,.78)'; g.beginPath(); g.roundRect(0,0,600,140,26); g.fill();
  g.font='500 24px Plex'; g.fillStyle=BLUE_L; g.textBaseline='middle'; g.fillText('♪ MÚSICA',26,34);
  const E=DATA.e117; const n=52, bw=7, x0=26, step=(600-52)/n;
  for(let k=0;k<n;k++){ const tt=(t-T.musica)*1.0+k*0.05; const v=Math.max(0.08,E[Math.max(0,Math.min(E.length-1,Math.floor(tt*25)+20))]||0.1); const bh=v*62;
    g.fillStyle=(k<n*clamp((t-T.musica)/0.5,0,1))?BLUE_L:'rgba(154,168,184,.35)'; g.fillRect(x0+k*step,92-bh/2,bw,bh); }
  g.restore(); musT.needsUpdate=true; }

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.ready, document.fonts.load('500 46px Plex'), document.fonts.load('800 62px Inter')];
  Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  READY=Promise.all(jobs).then(()=>{ TAGS.forEach((tg,i)=>{ const tex=txtTex(256,96,(g,w,h)=>{ g.fillStyle='rgba(12,17,24,.88)'; g.beginPath(); g.roundRect(4,8,w-8,h-16,40); g.fill();
      g.strokeStyle=BLUE; g.lineWidth=4; g.stroke(); g.font='500 46px Plex'; g.fillStyle=INK; g.textAlign='center'; g.textBaseline='middle'; g.fillText(String(i+1).padStart(2,'0'),w/2,h/2+2); });
      tg.userData.lab.material.map=tex; tg.userData.lab.material.needsUpdate=true; }); BUILT=true; }); return READY; }

// ---------- câmera ----------
const CAM=[ // posição, alvo
  {t:0, p:[0,40,D], l:[0,40,0]},
  {t:'ov', p:[1150,1500,2550], l:[-250,-300,-2800]},
  {t:'cor', p:[640,420,1050], l:[-140,230,-2300]},
  {t:'out', p:[1250,2250,3500], l:[-250,-260,-3100]} ];
const V3=(a)=>new THREE.Vector3(a[0],a[1],a[2]);
function camAt(t){ const p=V3(CAM[0].p), l=V3(CAM[0].l);
  const mix=(k,u)=>{ p.lerp(V3(CAM[k].p),u); l.lerp(V3(CAM[k].l),u); };
  mix(1,eio((t-T.assisto+0.05)/1.05));
  mix(2,eio((t-T.rise+0.1)/1.6));
  p.add(new THREE.Vector3(-90,-40,-260).multiplyScalar(sm(T.rise,T.cliente,t)));            // travelling lento sobre a cordilheira
  mix(3,eio((t-T.cortez+0.05)/1.4));
  p.add(new THREE.Vector3(-120,30,-180).multiplyScalar(sm(T.cortez,T.end,t)));
  return {p,l}; }

// posição na tela (px) → mundo, a uma altura de cartão na tela
const _v=new THREE.Vector3(), _q=new THREE.Quaternion();
function screenPose(xpx,ypx,hpx){ const d=CH*D/hpx; const local=new THREE.Vector3((xpx-540)*d/D,-(ypx-960)*d/D,-d); return local.applyMatrix4(C.matrixWorld); }
function project(v){ const p=v.clone().project(C); return {x:(p.x+1)/2*1080, y:(1-p.y)/2*1920, z:p.z}; }
function placeLbl(id,x,y){ const el=document.getElementById(id); el.style.left=Math.round(x-el.offsetWidth/2)+'px'; el.style.top=Math.round(y)+'px'; }

const GRID=[]; { const xs=[200,540,880], ys=[560,900,1240]; let k=0; for(let r=0;r<3;r++) for(let c=0;c<3;c++){ GRID.push([xs[c],ys[r]]); k++; } }
// cartões 0..8 vão para a grade 3×3 (atrás); o 9 (Reel do Convidado) vem para a frente, no centro

function render(t){
  const cam=camAt(t); C.position.copy(cam.p); C.lookAt(cam.l); C.updateMatrixWorld(); C.updateProjectionMatrix();
  // ----- relevo: leitura (scan) e revelação
  const sc=clamp((t-T.scan0)/(T.scan1-T.scan0),0,1), scE=eio(sc);
  TU.uScan.value=lerp(Z0+300,Z0-L-300,scE); TU.uReveal.value=sm(T.scan1-0.05,T.scan1+0.35,t);
  TU.uDim.value=(1-0.45*sm(T.hero,T.hero+0.5,t)*(1-sm(T.cliente-0.1,T.cliente+0.4,t)))*(1-0.5*sm(T.cliente,T.cliente+0.6,t)*(1-sm(T.cortez,T.cortez+0.8,t)))*(1-0.35*sm(T.cta0,T.cta0+0.8,t));
  crest.geometry.setDrawRange(0,Math.floor(crestCount*clamp(sm(T.scan0,T.scan1,t)*1.0,0,1)/3)*3);
  crest.material.opacity=0.95*sm(T.scan0,T.scan0+0.15,t)*(1-0.5*sm(T.hero,T.hero+0.4,t)*(1-sm(T.cortez,T.cortez+0.6,t)));
  // ----- trechos: acendem em sequência
  const pz=[], pa=[];
  TAGS.forEach((tg,i)=>{ const a0=T.peaks0+i*(T.peaks1-T.peaks0)/10; const on=eo((t-a0)/0.35); const u=tg.userData.u; const z=zOf(u);
    pz.push(z); pa.push(on*(0.65+0.35*gauss(t,a0+0.12,0.18))*(1-0.55*sm(T.rise+i*0.12,T.rise+i*0.12+0.6,t)));
    tg.visible=on>0.01 && t<T.hero+0.2; if(tg.visible){ const y=tg.userData.y; const lift=lerp(-40,0,on);
      tg.position.set(0,y+190+lift,z); tg.quaternion.copy(C.quaternion); const s=clamp(C.position.distanceTo(tg.position)/2600,0.8,3.2); tg.scale.setScalar(s);
      tg.userData.stem.position.set(0,-120,0); tg.userData.stem.scale.set(1,1,1);
      const fade=on*(1-sm(T.rise+i*0.12,T.rise+i*0.12+0.35,t)); tg.userData.lab.material.opacity=fade; tg.userData.stem.material.opacity=0.8*fade; } });
  TU.uPz.value=pz; TU.uPa.value=pa;
  // ----- vídeo longo: grande no gancho → deita no início da cordilheira como a "placa" de onde tudo sai
  setFrame(LONG.tx, loopOf('long',t,0));
  { const u=eio((t-T.assisto+0.05)/1.0); const hookP=new THREE.Vector3(0,40+110*0.83,620);
    const restP=new THREE.Vector3(0,BASEY+heightAt(0,0)+260,Z0-500);
    longG.position.copy(hookP).lerp(restP,u); longG.quaternion.copy(new THREE.Quaternion().slerp(C.quaternion,u)); longG.scale.setScalar(lerp(0.83,0.42,u));
    const ud=longG.userData; ud.prog.scale.x=Math.max(1,(960-60)*sc); ud.prog.position.x=-(960-60)/2+(960-60)*sc/2;
    const la=1-sm(T.assisto+0.35,T.assisto+0.85,t); ud.m.uniforms.alpha.value=la; ud.ed.material.opacity=0.9*la; longG.visible=la>0.01; ud.m.uniforms.dim.value=0.25*sm(T.assisto,T.assisto+0.6,t)+0.35*sm(T.hero,T.hero+0.4,t);
    ud.bar.visible=ud.prog.visible=t<T.peaks1;
    if(t<T.assisto+0.3){ const c=project(longG.position.clone().add(new THREE.Vector3(0,-270,0))); placeLbl('lblL',c.x,c.y+44); } }
  // ----- cartões: sobem dos picos → herói → grade com o Reel do Convidado na frente → voltam a pairar sobre os picos
  const wq=C.quaternion.clone();
  CARDS.forEach((cg,i)=>{ const ud=cg.userData; const u=ud.u; const z=zOf(u); const yPk=BASEY+heightAt(0,u);
    const r0=T.rise+i*0.16; const rise=spring(clamp((t-r0)/1.0,0,1.6)); cg.visible=t>=r0-0.02;
    if(!cg.visible) return;
    const side=(i%2?-1:1)*140;
    const hover=new THREE.Vector3(side*0.9,yPk+390,z); const start=new THREE.Vector3(0,yPk-120,z);
    const P=start.clone().lerp(hover,clamp(rise,0,1.08)); let sc=lerp(0.2,0.78,clamp(rise,0,1.05));
    const Q=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0.42,0));
    Q.slerp(wq,0.55);
    // herói (cartão 0) — vem para a câmera
    if(i===0){ const hu=eio((t-T.hero)/0.55)*(1-eio((t-T.cliente)/0.7)); if(hu>0){ const H=screenPose(540,820,1080); P.lerp(H,hu); sc=lerp(sc,1,hu); Q.slerp(wq,hu); } }
    // grade (9 exemplos) + Convidado na frente
    const gu=eio((t-T.cliente-i*0.05)/0.8)*(1-eio((t-T.cortez-0.05)/1.1));
    if(gu>0){ let G; if(i===9) G=screenPose(540,900,930); else G=screenPose(GRID[i][0],GRID[i][1],300);
      P.lerp(G,gu); sc=lerp(sc,1,gu); Q.slerp(wq,gu); }
    cg.position.copy(P); cg.quaternion.copy(Q); cg.scale.setScalar(sc);
    // conteúdo
    const m=ud.m;
    if(ud.name==='hero'){ setFrame(ud.ta,loopOf('hb',t,T.rise)); m.uniforms.mixv.value=0; m.uniforms.wipe.value=-1;
      if(t>=T.legenda-0.05){ setFrame(ud.ta,frameOf('hb',t,T.legenda-0.6)); setFrame(ud.tb,frameOf('hl',t,T.legenda-0.6)); m.uniforms.mixv.value=sm(T.legenda-0.02,T.legenda+0.2,t); }
      if(t>=T.cena-0.02){ setFrame(ud.ta,frameOf('hl',t,T.legenda-0.6)); setFrame(ud.tb,loopOf('hc',t,T.cena)); m.uniforms.mixv.value=0; m.uniforms.wipe.value=clamp(eio((t-T.cena)/0.32)*1.02,0,1.02); } }
    else { const nm=ud.name; setFrame(ud.ta,loopOf(nm,t,r0+i*0.37)); m.uniforms.mixv.value=0; m.uniforms.wipe.value=-1;
      if(nm==='j' && gu>0.5) setFrame(ud.ta,loopOf('jh',t,T.cliente)); }
    const focusHero=eio((t-T.hero)/0.4)*(1-eio((t-T.cliente)/0.5));
    m.uniforms.dim.value=(i===0?0:0.55*focusHero)+(i===9?0:0.32*sm(T.cliente+0.6,T.cliente+1.0,t)*(1-sm(T.cortez,T.cortez+0.6,t)))+0.25*sm(T.cta0,T.cta0+0.8,t);
    ud.ed.material.opacity=0.9*(1-0.5*m.uniforms.dim.value);
    cg.renderOrder=(i===9 && gu>0.2)?50:(i===0 && focusHero>0.2?40:i);
    if(i===0) drawMus(t,sm(T.musica-0.05,T.musica+0.2,t)*(1-sm(T.cliente-0.1,T.cliente+0.2,t)));
  });
  // rótulos que seguem o 3D
  { const H=CARDS[0]; const c=project(H.position.clone().add(new THREE.Vector3(0,-CH/2*H.scale.x,0).applyQuaternion(H.quaternion))); placeLbl('lblH',c.x,c.y+18); }
  { const Jc=CARDS[9]; const c=project(Jc.position.clone().add(new THREE.Vector3(0,-CH/2*Jc.scale.x,0).applyQuaternion(Jc.quaternion))); placeLbl('lblJ',c.x,c.y+18); }
  placeLbl('lblEx',540,366);
  { let n=1; DATA.counter.forEach((c,i)=>{ if(t>=c) n=i+1; }); const el=document.getElementById('cn'); if(el.textContent!==String(n)) el.textContent=String(n); }
  // código de tempo da leitura
  { const s=Math.floor(779*sc); document.getElementById('tcode').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  // foco e brilho
  let subj=new THREE.Vector3().copy(cam.l);
  if(t>=T.rise && t<T.hero) subj=CARDS[2].position.clone();
  if(t>=T.hero && t<T.cliente) subj=CARDS[0].position.clone();
  if(t>=T.cliente && t<T.cortez) subj=CARDS[9].position.clone();
  bokeh.uniforms.focus.value=C.position.distanceTo(subj);
  bokeh.uniforms.aperture.value=0.0000040*sm(T.rise,T.rise+0.8,t)*(1-sm(T.cortez,T.cortez+0.8,t))+0.0000020*sm(T.cta0,T.cta0+0.8,t);
  bloom.strength=0.14+0.12*gauss(t,T.scan1,0.25)+0.10*sm(T.peaks0,T.peaks1,t)*(1-sm(T.rise,T.rise+1,t));
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!BUILT){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
