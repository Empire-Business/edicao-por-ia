  [T.q+0.25, 0,-20,0, 0,0,0, .86], [T.flap-0.55, 0,-20,0, 0,0,0, .86], [T.flap-0.15, -175,-40,-40, 0,.22,0, .8],
  [T.m0+0.2, -175,-40,-40, 0,.22,0, .8], [T.m0+0.75, 40,-30,-20, 0,-.08,0, .82], [T.mandei, 70,-30,-40, 0,-.12,0, .82],
  [T.sinistro+0.2, 70,-40,-60, .02,-.14,0, .82], [T.v2+0.4, -60,-40,-100, .05,.38,-.02, .85], [T.styles-0.25, 55,-25,-30, .03,-.18,.01, .9],
  [T.styles+0.35, 0,-30,-260, 0,0,0, .8], [T.v3-0.4, 0,-30,-260, 0,0,0, .8], [T.v3-0.06, 0,0,0, 0,0,0, 1],
]; }
const PK=phoneKeys();
const XK0=T.p0-0.45, XK1=T.p0+0.4;
const VIN=T.v3+0.5;
function diveZ(t){ const u=clamp((t-T.v3+0.05)/0.55,0,1); return ZC*1.06*Math.pow(u,2.3); }
const GW0=SW*D/(D-diveZ(VIN));   // largura da tela do celular no instante da troca (cobre o quadro)
function phoneAt(t){
  if(t<T.v3+1) { const p=track(PK,t); if(t>T.v3-0.05){ p[2]=diveZ(t); } return p; }
  if(t<XK0) return null;
  if(t<T.f0-0.3){ const u=eio((t-XK0)/(XK1-XK0)); const a=[0,0,ZC,0,0,0,1], b=[-40,-30,10,0,.14,0,.9];
    const p=a.map((v,k)=>lerp(v,b[k],u)); p[2]=lerp(ZC,10,1-Math.pow(1-u,2.4)); if(t>XK1) p[1]+= 6*Math.sin((t-XK1)*1.4); return p; }
  if(t<T.cta0+0.05){ return track([[T.f0-0.3,-40,-30,10,0,.14,0,.9],[T.f0+0.2,40,-40,-80,.04,-.3,.01,.86],[T.cta0,20,-40,-40,.03,-.24,.01,.87]],t); }
  const p=track([[T.cta0, 20,-40,-40,.03,-.24,.01,.87],[T.cta0+0.75, 0,-205,-60,-.08,0,0,.84]],t); p[1]+=8*Math.sin((t-T.cta0)*1.2); return p; }
function screenMode(t){ if(t<T.q-0.12) return 'chat'; if(t<T.mandei) return 'live'; if(t<T.v3-0.45) return 'chat'; if(t<T.v3+1) return 'player';
  if(t<XK1+0.1) return 'rt'; if(t<T.f0-0.12) return 'reel'; return 'chat'; }

const V3=new THREE.Vector3();
function render(t){
  // fundo
  bgU.uG.value.set(lerp(-200,200,sm(T.v2,T.v2+1,t)), 260 - 300*sm(T.cta0,T.cta0+1,t));
  bgU.uI.value=(1-0.85*pulse(t,VIN,0.28))*0.55+0.25*pulse(t,T.sinistro+0.1,0.35)+0.2*pulse(t,T.ten+0.3,0.4)+0.2*pulse(t,T.pct,0.35)+0.25*sm(T.cta0,T.cta0+1,t);

  // celular
  const P=phoneAt(t); phone.visible=!!P;
  const mode=screenMode(t);
  if(P){ setPose(phone,P); phone.position.y+= (t<T.q||t>T.cta0)?0:4*Math.sin(t*1.3);
    if(mode==='chat') drawChat(t); else if(mode==='live') drawLive(t); else if(mode==='player') drawPlayer(t); else if(mode==='reel') drawReel(t);
    rtMesh.material.opacity = (t>=XK0 && t<XK1+0.15)? 1-sm(XK1-0.32,XK1-0.12,t) : 0;
    if(t>=XK1-0.34 && t<XK1+0.15) drawReel(t);
    sheen.material.uniforms.o.value = -0.4 + ((t*0.11)%1.6);
    sheen.material.uniforms.a.value = 0.07*(1-sm(0.25,0.8,P[2]/ZC));
    if(t>=VIN && t<T.v3+1) phone.visible=false; }
  shadow.visible=!!P && phone.visible && (t<T.v3-0.3 || (t>XK1 && t<T.cta0+5)); if(shadow.visible){ shadow.position.set(P[0]+20,P[1]-PH*P[6]/2-70,P[2]-120); shadow.scale.setScalar(P[6]); }

  // bolha de áudio 3D + fita (t01, t06 até "Só mudar", t11)
  let bv=0, bk=null, bp=null, dir=1;
  if(t<NOTES.t01.e+0.35){ bk='t01'; bv=1-sm(NOTES.t01.e+0.05,NOTES.t01.e+0.35,t); bp=[-70,340,250, .03,.2,-.03, lerp(0.94,1,eo(t/0.3))]; dir=1; }
  else if(t>T.v2-0.1 && t<T.styles+0.2){ bk='t06'; bv=sm(T.v2-0.1,T.v2+0.25,t)*(1-sm(T.styles-0.15,T.styles+0.2,t)); const m=eio((t-T.v2-0.3)/(T.styles-T.v2-0.4));
    bp=[lerp(70,-40,m),lerp(330,355,m),lerp(250,300,m), .03,lerp(-.2,.1,m),.03, lerp(.7,1,back((t-T.v2+0.1)/0.45))]; dir=-1; }
  else if(t>T.f0-0.15 && t<T.cta0+0.4){ bk='t11'; bv=sm(T.f0-0.15,T.f0+0.15,t)*(1-sm(T.cta0+0.05,T.cta0+0.4,t)); bp=[-60,330,280, .03,.18,-.03, lerp(.7,1,back((t-T.f0+0.15)/0.45))]; dir=1; }
  bubble.visible=bv>0.001;
  if(bubble.visible){ setPose(bubble,bp); bubble.scale.multiplyScalar(lerp(0.85,1,bv)); bubble.position.z+= (1-bv)*-200; drawBubble(bk,t);
    bubble.updateMatrixWorld(); V3.set(dir*(BW/2-10),-10,6); bubble.localToWorld(V3); updRibbon(t,V3,dir,bv); } else updRibbon(t,V3,1,0);

  // "2 dias"
  boardA.visible = t>T.d0-0.04 && t<T.m0+0.6;
  if(boardA.visible){ const u=back((t-T.d0+0.03)/0.5), w=eio((t-T.m0-0.05)/0.5);
    boardA.position.set(lerp(420,250,u)+520*w, 160+10*Math.sin(t*1.5), lerp(-300,140,u)); boardA.rotation.set(0.05,lerp(-0.7,-0.3,u)-0.6*w,0); boardA.scale.setScalar(Math.max(0.001,u)*(1-0.4*w));
    updTile(tileA,t,'0',[[T.flap-0.62,'1'],[T.flap-0.3,'2']]); }
  // "100%"
  boardB.visible = t>T.pct-1.35 && t<T.f0-0.05;
  if(boardB.visible){ const u=back((t-T.pct+1.3)/0.5), w=eio((t-T.f0+0.5)/0.45);
    boardB.position.set(lerp(560,255,u)+500*w, -360+8*Math.sin(t*1.4), lerp(-300,170,u)); boardB.rotation.set(0.04,lerp(-0.7,-0.3,u)-0.5*w,0); boardB.scale.setScalar(Math.max(0.001,0.8*u)*(1-0.4*w));
    updTile(tilesB[0],t,'0',rollB.c); updTile(tilesB[1],t,'0',rollB.a); updTile(tilesB[2],t,'0',rollB.b); updTile(tilesB[3],t,'%',[]); }

  // disco do Convidado (vídeo-mensagem) enquanto a tela mostra a conversa
  const discB = t>XK1-0.15 && t<T.f0-0.02;
  disc.visible = (t>T.mandei-0.25 && t<T.v2+0.15) || discB;
  if(discB){ const u=back((t-XK1+0.15)/0.5), w=eio((t-T.f0+0.45)/0.4); disc.position.set(-330-640*w,-395+6*Math.sin(t*1.7),240); disc.rotation.set(0,0.2+0.5*w,0); disc.scale.setScalar(Math.max(0.001,0.78*u)); drawDisc(t); }
  else if(disc.visible){ const u=back((t-T.mandei+0.25)/0.5), w=eio((t-T.v2+0.3)/0.4); disc.position.set(-290-640*w,-300+6*Math.sin(t*1.7),230); disc.rotation.set(0,0.22+0.5*w,0); disc.scale.setScalar(Math.max(0.001,u)); drawDisc(t); }

  // mensagem 3D no "sinistro"
  msg3.visible = t>T.sinistro-0.12 && t<T.v2+0.35;
  if(msg3.visible){ const u=back((t-T.sinistro+0.12)/0.55), w=eio((t-T.v2-0.0)/0.35);
    msg3.position.set(lerp(40,0,u), lerp(-160,330,u)+420*w, lerp(-20,330,u)); msg3.rotation.set(lerp(0.2,0.04,u),lerp(-0.25,-0.12,u),lerp(0.05,-0.02,u)); msg3.scale.setScalar(Math.max(0.001,lerp(0.55,1,u)*(1-w))); }

  // baralho de estilos
  const dk = t>T.styles-0.1 && t<T.v3-0.1;
  deck.forEach((g,i)=>{ g.visible=dk; if(!dk) return; const u=eo((t-T.styles-i*0.08)/0.6), w=eio((t-T.v3+0.46-i*0.02)/0.36), c=back((t-T.cor+0.3-i*0.06)/0.45)*(1-w);
    const k=i-1.5; const bx=k*265, by=-20-Math.abs(k)*22, bz=-90-Math.abs(k)*80;
    g.position.set(lerp(0,bx,u)*(1+1.3*w) + Math.sign(k)*260*w, lerp(-30,by,u), lerp(-330,bz,u) - 220*w + 70*c);
    g.rotation.set(0.02, -k*0.2*u + 0.05*Math.sin(t*0.8+i), -k*0.025*u); g.scale.setScalar(Math.max(0.001,lerp(0.5,0.92,u)*(1-0.5*w)));
    setFrame(g.userData.tx, frameOf(g.userData.seq,t,T.styles,i*9)); });

  // interior do portal
  const innerOn = t>=VIN && t<XK0;
  inner.visible=innerOn;
  if(innerOn || (t>=XK0 && t<XK1+0.15)){ setFrame(LTX, frameOf('long',t,T.v3-0.6));
    const gw=lerp(GW0,1000,eio((t-VIN)/0.6)), gh=gw*9/16;
    const ringIn=eio((t-T.e0+0.35)/0.7);
    strips.forEach((g,i)=>{ const u=g.userData;
      const f=eio((t-T.ten-i*0.045)/0.5), mv=eio((t-T.ten-i*0.045)/0.62);
      u.front.material.uniforms.sz.value.set(gw,gh);
      const sx=(i-4.5)*gw/10;
      const col=i%5, row=Math.floor(i/5); const gx=(col-2)*204, gy=row===0?178:-178;
      // carrossel: anel com passos nas palavras "efeito", "música", "tudo", "visual"
      const steps=[T.k1,T.k2,T.k3,T.k4].reduce((s,k)=>s+eio((t-k+0.08)/0.42),0);
      const ang=(i/10)*Math.PI*2 - steps*(Math.PI*2/10) - 0.06*(t-T.e0);
      const RR=560, rx=Math.sin(ang)*RR, rz=Math.cos(ang)*RR-RR, ry=-10;
      let px=lerp(sx,gx,mv), py=lerp(0,gy,mv), pz=0;
      px=lerp(px,rx,ringIn); py=lerp(py,ry,ringIn); pz=lerp(pz,rz,ringIn);
      g.position.set(px,py,pz+Math.sin(f*Math.PI)*90);
      g.rotation.set(0, Math.PI*f + ang*ringIn, 0);
      u.front.scale.set(gw/10+0.6,gh,1);
      const cs=lerp(1,2.05,ringIn); u.card.scale.set(cs,cs,1);
      const facing=Math.cos(ang)*ringIn + (1-ringIn); const br=lerp(0.32,1,clamp(facing,0,1));
      u.card.material.color.setRGB(br,br,br);
      setFrame(u.tx, frameOf(u.seq,t,T.ten,i*11)); });
    labTen.visible = t>T.ten+0.3 && t<T.e0;
    if(labTen.visible){ const a=sm(T.ten+0.3,T.ten+0.6,t)*(1-sm(T.e0-0.3,T.e0,t)); labTen.material.opacity=a; labTen.position.set(0,-430,40); }
  }
  // portal de saída: o interior é desenhado na tela do celular
  const exiting = t>=XK0 && t<XK1+0.15;
  inner.visible = innerOn || exiting;
  if(exiting){ C.layers.disable(1); R.setRenderTarget(rt); R.setClearColor(new THREE.Color(BG)); R.clear(); R.render(S,rtCam); R.setRenderTarget(null); }
  else C.layers.enable(1);
  // camada 1 fica fora da câmera principal enquanto o celular segura o portal; luzes nas duas camadas

  // luz e brilho
  rim.intensity = 1.6 + 2.2*pulse(t,T.sinistro+0.05,0.25) + 1.5*pulse(t,T.ten+0.2,0.3) + 1.8*pulse(t,T.pct,0.3) + 1.2*pulse(t,0.05,0.3);
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.ready, document.fonts.load('800 40px Inter'), document.fonts.load('700 40px Inter'), document.fonts.load('600 40px Inter'),
    document.fonts.load('500 20px Inter'), document.fonts.load('400 20px Inter'), document.fonts.load('500 20px "IBM Plex Mono"')];
  Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  LIVE_LIST.forEach(f=>jobs.push(loadImg(`assets/live/${String(f).padStart(4,'0')}.jpg`).then(im=>LIVE[f]=im)));
  READY=Promise.all(jobs).then(()=>{ Object.keys(CHARCACHE).forEach(k=>delete CHARCACHE[k]); STATIC.forEach(f=>f()); }); return READY; }
window.__mod=true;
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!READY || !window.__ok){ e.detail.waitUntil(prepare().then(()=>{ window.__ok=true; render(t); })); } else render(t); });
</script>
