const bezel=new THREE.Mesh(bezelGeo,bezelMat); bezel.position.z=6; iris.add(bezel);

const tickGeo=new THREE.BoxGeometry(3,1,2.2); tickGeo.translate(0,.5,0);
const tickMat=new THREE.MeshStandardMaterial({color:0x2e2416,roughness:.65,metalness:.4});
const NT=90, ticks=new THREE.InstancedMesh(tickGeo,tickMat,NT); iris.add(ticks);
{ const M=new THREE.Matrix4(), Q=new THREE.Quaternion(), Sx=new THREE.Vector3();
  for(let i=0;i<NT;i++){ const a=i/NT*Math.PI*2, major=i%15===0, mid=i%5===0, len=major?30:(mid?20:12), r0=RB-14-len;
    Q.setFromAxisAngle(V3(0,0,1),a-Math.PI/2); Sx.set(major?1.6:1,len,1); M.compose(V3(Math.cos(a)*r0,Math.sin(a)*r0,FACE+.6),Q,Sx); ticks.setMatrixAt(i,M); } }
function arcText(g,text,r,ang,top,font,color){ g.save(); g.font=font; g.fillStyle=color; g.textAlign='center'; g.textBaseline='middle';
  const chars=[...text], widths=chars.map(c=>g.measureText(c).width+3), tot=widths.reduce((a,b)=>a+b,0); let a=ang+(top?1:-1)*tot/2/r;
  chars.forEach((ch,i)=>{ const w=widths[i]; a+=(top?-1:1)*w/2/r; g.save(); g.rotate(-a); g.translate(r,0); g.rotate(top?Math.PI/2:-Math.PI/2); g.fillText(ch,0,0); g.restore(); a+=(top?-1:1)*w/2/r; }); g.restore(); }
const engr=(()=>{ const c=document.createElement('canvas'); c.width=1200; c.height=1200; const g=c.getContext('2d'); g.translate(600,600); const s=600/RB;
  const f='500 '+Math.round(23*s)+'px "IBM Plex Mono"', ink='rgba(30,22,10,.95)';
  arcText(g,'CORTEZ  ·  INTELIGÊNCIA ARTIFICIAL',(RH+22)*s,-Math.PI/2,false,f,ink);
  arcText(g,'0',(RH+22)*s,Math.PI*0.5+0.62,true,f,ink); arcText(g,'1 DIA',(RH+22)*s,Math.PI*0.5+0.06,true,f,ink); arcText(g,'2 DIAS',(RH+22)*s,Math.PI*0.5-0.56,true,f,ink);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; })();
const engrMesh=new THREE.Mesh(new THREE.PlaneGeometry(RB*2,RB*2),new THREE.MeshBasicMaterial({map:engr,transparent:true,depthWrite:false,toneMapped:false}));
engrMesh.position.z=FACE+.9; iris.add(engrMesh);
// ponteiro dos dias (entalhe luminoso no aro)
const ptr=new THREE.Mesh(new THREE.CylinderGeometry(0,17,40,3),new THREE.MeshBasicMaterial({color:0xFFE2A0,toneMapped:false,transparent:true}));
ptr.rotation.x=Math.PI/2; const ptrG=new THREE.Group(); ptrG.add(ptr); ptr.position.set(0,0,0); iris.add(ptrG);
const DAY0=Math.PI*0.5+0.62, DAY2=Math.PI*0.5-0.56;
function setPtr(a,o){ ptrG.position.set(Math.cos(a)*(RH+2),Math.sin(a)*(RH+2),FACE+4); ptrG.rotation.z=a-Math.PI/2; ptr.material.opacity=o; ptrG.visible=o>0.01; }
// arco de progresso (100%) na borda interna do aro
const arcCurve=new THREE.Curve(); arcCurve.getPoint=function(u,tgt=new THREE.Vector3()){ const a=Math.PI/2-u*Math.PI*2; return tgt.set(Math.cos(a)*(RH-1),Math.sin(a)*(RH-1),FACE-1); };
const ARC_SEG=360, ARC_RAD=8;
const arcGeo=new THREE.TubeGeometry(arcCurve,ARC_SEG,3.6,ARC_RAD,false);
const arcMat=new THREE.MeshBasicMaterial({color:0xFFE6A8,toneMapped:false,transparent:true});
const arc=new THREE.Mesh(arcGeo,arcMat); iris.add(arc);
function setArc(u,o){ arcGeo.setDrawRange(0,Math.floor(clamp(u,0,1)*ARC_SEG)*ARC_RAD*6); arcMat.opacity=o; arc.visible=u>0.002&&o>0.01; }

// cartões de prova ("eu poderia passar o dia dizendo que sou bom")
const CARDS=DATA.cards, cardMask=roundMask(270,480,16), cards=[];
CARDS.forEach((n,i)=>{ const g=new THREE.Group(); const m=new THREE.Mesh(new THREE.PlaneGeometry(270,480),new THREE.MeshBasicMaterial({map:vtex(),alphaMap:cardMask,transparent:true,toneMapped:false}));
  const fr=new THREE.Mesh(frameShape(282,492,20,4),new THREE.MeshBasicMaterial({color:0xD6B46A,transparent:true,toneMapped:false})); fr.position.z=.5;
  g.add(m); g.add(fr); g.visible=false; S.add(g); cards.push({g,m,fr,name:n}); });

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.load('700 70px "Libre Baskerville"'), document.fonts.load('600 30px "IBM Plex Mono"'), document.fonts.load('800 80px Inter'), document.fonts.ready];
  Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  READY=Promise.all(jobs).then(()=>{ engr.image=(()=>{ const c=document.createElement('canvas'); c.width=1200; c.height=1200; const g=c.getContext('2d'); g.translate(600,600); const s=600/RB;
      const f='500 '+Math.round(23*s)+'px "IBM Plex Mono"', ink='rgba(30,22,10,.95)';
      arcText(g,'CORTEZ  ·  INTELIGÊNCIA ARTIFICIAL',(RH+22)*s,-Math.PI/2,false,f,ink);
      arcText(g,'0',(RH+22)*s,DAY0,true,f,ink); arcText(g,'1 DIA',(RH+22)*s,(DAY0+DAY2)/2,true,f,ink); arcText(g,'2 DIAS',(RH+22)*s,DAY2,true,f,ink); return c; })(); engr.needsUpdate=true; LOADED=true; });
  return READY; }

// ---------- câmera ----------
function frameCam(dist,yawDeg,screenY,pitch){ const ty=IC.y-(960-screenY)*dist/D; const yaw=yawDeg*Math.PI/180, p=pitch||0.04;
  const tgt=V3(0,ty,0); return [V3(Math.sin(yaw)*dist*Math.cos(p), ty+Math.sin(p)*dist, Math.cos(yaw)*dist*Math.cos(p)), tgt]; }
const KEYS=[
  [0,            [V3(-330,330,1320), V3(-150,150,0)]],
  [0.55,         [V3(-380,300,1700), V3(-120,140,0)]],
  [T.uma+0.2,    frameCam(3700,-16,900,0.05)],
  [T.s2-0.05,    frameCam(3800,-9,900,0.04)],
  [T.s2+1.2,     frameCam(4700,4,930,0.06)],
  [T.s3,         frameCam(4600,9,930,0.05)],
  [T.open0+0.1,  frameCam(3750,2,890,0.03)],
  [B.j1.start,   frameCam(3420,-7,900,0.0)],
  [T.caramba-0.15, frameCam(3260,3,900,0.0)],
  [T.caramba+0.7,  frameCam(2980,0,912,0.0)],
  [B.j1.end,     frameCam(3150,-2,905,0.0)],
  [T.postei+0.3, frameCam(3380,8,900,0.0)],
  [T.editado-0.15, frameCam(3240,3,900,0.0)],
  [T.pct+0.35,   frameCam(3020,0,908,0.0)],
  [B.j2.end,     frameCam(3250,-3,900,0.0)],
  [T.close1,     frameCam(3800,-8,900,0.04)],
  [T.dois,       frameCam(3650,-3,900,0.03)],
  [T.reopen1,    frameCam(3480,3,900,0.0)],
  [T.cta0,       frameCam(3560,0,900,0.0)],
  [T.cta0+0.95,  frameCam(6150,0,800,0.0)],
  [T.end,        frameCam(6300,0,800,0.0)] ];
function camAt(t){ let i=0; while(i<KEYS.length-2 && t>=KEYS[i+1][0]) i++;
  const [t0,[p0,q0]]=KEYS[i], [t1,[p1,q1]]=KEYS[i+1]; const u=t1>t0?clamp((t-t0)/(t1-t0),0,1):1; const e=(i===0)?ecub(u):eio(u);
  return [p0.clone().lerp(p1,e), q0.clone().lerp(q1,e)]; }

// ---------- abertura da íris ao longo do tempo ----------
const OPEN=RH+40, PSI0=0.17;
function apertureAt(t){
  const env=DATA.env[Math.min(DATA.env.length-1,Math.floor(t*30))]||0;
  const speakAI=(t<T.open0)?1:0;
  let a=6+20*env*speakAI;                                                   // fechada, "respira" com a voz da IA
  a=lerp(a,OPEN,ecub((t-T.open0)/(T.open1-T.open0)));                      // abre e revela o Convidado
  a=lerp(a,RH*0.58,eio((t-T.close0)/(T.close1-T.close0)));                  // volta a IA: fecha em parte
  a=lerp(a,OPEN,ecub((t-T.reopen0)/(T.reopen1-T.reopen0)));                 // "editado cem por cento por mim": abre de novo
  if(t>=T.close1 && t<T.reopen0) a+=12*env;                                // a IA fala de novo: a borda pulsa de leve
  [T.rA0,T.rA1,T.rB0,T.rB1].forEach(tb=>{ const g=Math.exp(-Math.pow((t-tb)/0.11,2)); a=lerp(a,-10,g); });   // piscada de obturador nas trocas
  return a; }

function render(t){
  const a=apertureAt(t); setAperture(a, PSI0+0.62*(a/OPEN)+0.05*t);
  // janela do Convidado: rindo (antes da fala) → fala 1 → fala 2 → ouvindo (depois); quadros indexados pelo tempo
  let img;
  if(t<B.j1.start) img=frameIdx('jpre',t,B.j1.start-1.8);
  else if(t<B.j2.start) img=frameIdx('j1',t,B.j1.start);
  else if(t<B.j2.end) img=frameIdx('j2',t,B.j2.start);
  else img=frameIdx('jpost',t,B.j2.end);
  setFrame(jTex,img);
  const inA=t>=T.rA0 && t<T.rA1, inB=t>=T.rB0 && t<T.rB1, reel=inA||inB;
  reelBack.visible=reelCard.visible=reelFrame.visible=reel;
  if(inA) setFrame(rTex,frameIdx('rA',t,T.rA0)); else if(inB) setFrame(rTex,frameIdx('rB',t,T.rB0));
  const openK=clamp((a-40)/(OPEN-40),0,1);
  jMat.color.setScalar(t<T.open0 ? 0.0 : lerp(0.0,1.0,sm(T.open0,T.open0+0.7,t))*lerp(.6,1.0,openK));   // fechada: pupila escura
  // aquece a cena quando o Convidado aparece
  const warm=sm(T.open0,T.open1,t)*(1-.35*sm(T.close0,T.close1,t));
  glow.material.opacity=lerp(.16,.30,warm); glow.scale.setScalar(lerp(1,1.12,warm));
  dial.rotation.z=-0.035*t; dial.material.opacity=lerp(.75,.45,warm);
  // aro: ponteiro dos dias e arco 100%
  const ptrO=sm(T.close0+.2,T.close1,t)*(1-sm(T.cta0+.2,T.cta0+.7,t));
  setPtr(lerp(DAY0,DAY2,ecub((t-T.dois+0.05)/0.55)), ptrO);
  const au=ecub((t-T.arc0)/(T.arc1-T.arc0)); const pulse=1+0.35*Math.exp(-Math.pow((t-T.cem-0.1)/.35,2));
  setArc(au, sm(T.arc0,T.arc0+.15,t));
  arcMat.color.setRGB(1.0*pulse,0.90*pulse,0.66*pulse);
  // cartões de prova: entram, orbitam a íris (alguns passam por trás), recuam e somem
  cards.forEach((c,i)=>{ const st=T.cards0+i*0.07; const k=eo((t-st)/0.6); const out=ecub((t-T.cardsOut)/1.3);
    c.g.visible = t>st && out<0.999;
    if(!c.g.visible) return;
    const th=i/CARDS.length*Math.PI*2 + 0.42*(t-T.cards0) + 0.6;
    const Rr=lerp(1600,660,k)+lerp(0,900,out);
    c.g.position.set(Math.cos(th)*Rr, IC.y+Math.sin(th)*Rr*0.16 - 40, Math.sin(th)*Rr*0.92 - lerp(0,1400,out));
    c.g.quaternion.copy(C.quaternion); c.g.scale.setScalar(lerp(.55,1,k));
    const o=k*(1-out); c.m.material.opacity=o; c.fr.material.opacity=o;
    setFrame(c.m.material.map, frameIdx(c.name, t - (Math.floor(Math.max(0,t-T.cards0)/2.5)*2.5), T.cards0)); });
  // câmera
  const [cp,cq]=camAt(t); C.position.copy(cp); C.lookAt(cq); C.updateMatrixWorld();
  // pós: foco raso no gancho (macro das lâminas) e enquanto os cartões orbitam (foco na íris)
  const hook=1-sm(0.5,T.uma,t), orbit=sm(T.cards0+.2,T.cards0+.8,t)*(1-sm(T.cardsOut+.6,T.cardsOut+1.2,t));
  bokeh.uniforms.focus.value=cp.distanceTo(V3(IC.x,IC.y,IC.z+20));
  bokeh.uniforms.aperture.value=hook*0.000045+orbit*0.0000075;
  bloom.strength=0.12+0.16*sm(T.arc0,T.arc1,t)*(1-sm(T.d6b,T.d6b+.8,t))+0.22*Math.exp(-Math.pow((t-T.cem-0.1)/.3,2));
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!LOADED){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
