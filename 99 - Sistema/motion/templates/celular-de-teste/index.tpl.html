  g.fillStyle=INK; g.font='800 64px Inter'; g.fillText('Galeria',30,184);
  const hl=sm(T.parado-0.1,T.parado+0.35,t);                       // o vídeo parado acende; os outros escurecem
  const gone=t>=T.me+0.02;                                           // o cartão saiu da tela
  TILES.forEach((tl,i)=>{
    const {x,y}=tl; g.save(); rrect(g,x,y,TWc,THc,18); g.clip();
    if(tl.k==='HL'){ if(gone){ g.fillStyle='#121821'; g.fillRect(x,y,TWc,THc); } else cover(g,loopOf('raw',t,0),x,y,TWc,THc); }
    else if(tl.k[0]==='r'){ cover(g,ROLL[+tl.k.slice(1)],x,y,TWc,THc); }
    else { const c=PH_COL[+tl.k.slice(1)%PH_COL.length]; const gr=g.createLinearGradient(x,y,x+TWc,y+THc); gr.addColorStop(0,c[0]); gr.addColorStop(1,c[1]); g.fillStyle=gr; g.fillRect(x,y,TWc,THc); }
    if(tl.k!=='HL' && hl>0){ g.fillStyle=`rgba(10,14,20,${0.62*hl})`; g.fillRect(x,y,TWc,THc); }
    if(tl.d && !(tl.k==='HL'&&gone)){ g.fillStyle='rgba(0,0,0,.45)'; rrect(g,x+TWc-104,y+THc-54,92,40,12); g.fill(); g.fillStyle='#fff'; g.font='700 26px Inter'; g.textAlign='center'; g.fillText(tl.d,x+TWc-58,y+THc-25); g.textAlign='left'; }
    g.restore();
  });
  // destaque do vídeo parado
  if(hl>0 && !gone){ g.save(); g.globalAlpha=hl; g.strokeStyle=BLUE; g.lineWidth=7; rrect(g,HL.x+3.5,HL.y+3.5,TWc-7,THc-7,16); g.stroke();
    const bw=196,bh=46,bx=HL.x+14,by=HL.y+14; g.fillStyle=BLUE; rrect(g,bx,by,bw,bh,23); g.fill(); g.fillStyle=NAVY; g.font='500 24px Plex, monospace'; g.fillText('SEM EDITAR',bx+18,by+31);
    g.restore(); }
  if(gone){ const a=1-sm(T.volta,T.pronto,t); g.save(); g.globalAlpha=a; g.setLineDash([14,10]); g.strokeStyle='rgba(103,172,224,.75)'; g.lineWidth=4; rrect(g,HL.x+6,HL.y+6,TWc-12,THc-12,14); g.stroke(); g.restore(); }
  scrTex.needsUpdate=true;
}

const F=new THREE.Vector3(800,-300,-160);
const folder=new THREE.Group(); folder.position.copy(F); S.add(folder);
function paperTex(lines){ const c=document.createElement('canvas'); c.width=1040; c.height=640; const g=c.getContext('2d');
  g.fillStyle='#E6E1D6'; g.fillRect(0,0,1040,640);

  lines(g); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=16; return t; }
const paperMat=(map)=>new THREE.MeshStandardMaterial({color:0xD9D4C8,map,roughness:.94,metalness:0,envMapIntensity:.6});

const fBack=new THREE.Mesh(new RoundedBoxGeometry(560,400,8,2,10),[paperMat(null),paperMat(null),paperMat(null),paperMat(null),paperMat(backT),paperMat(null)]);
fBack.material.forEach(m=>{ m.color.set(0xD4CEC1); }); fBack.position.set(0,0,0); folder.add(fBack);
const fTab=new THREE.Mesh(new RoundedBoxGeometry(200,54,8,2,10),paperMat(null)); fTab.material.color.set(0xD4CEC1); fTab.position.set(-170,216,0); folder.add(fTab);

const fFront=new THREE.Mesh(new RoundedBoxGeometry(560,330,8,2,10),[paperMat(null),paperMat(null),paperMat(null),paperMat(null),paperMat(frontT),paperMat(null)]);
fFront.material.forEach((m,i)=>{ if(i!==4) m.color.set(0xCBC5B8); }); fFront.position.set(0,165,0); frontPivot.add(fFront);
const fShadow=new THREE.Mesh(new THREE.PlaneGeometry(760,560),new THREE.MeshBasicMaterial({map:SHT,transparent:true,depthWrite:false,opacity:.55}));

const ringMat=new THREE.MeshStandardMaterial({color:0x67ACE0,emissive:0x67ACE0,emissiveIntensity:.55,roughness:.3,metalness:.2});

  if(a<=0.001){ ringArc=null; return; } ringArc=new THREE.Mesh(new THREE.TorusGeometry(R0,9,14,Math.max(8,Math.round(260*a)),-Math.PI*2*a),ringMat); ringHolder.add(ringArc); }
function labelTex(main,sub,col){ const c=document.createElement('canvas'); c.width=640; c.height=200; const g=c.getContext('2d'); g.textAlign='center';
  g.fillStyle=col; g.font='800 108px Inter'; g.fillText(main,320,112); g.fillStyle=MUTED; g.font='500 30px Plex, monospace'; g.fillText(sub,320,172);

const LBL={};
const label=new THREE.Mesh(new THREE.PlaneGeometry(320,100),new THREE.MeshBasicMaterial({transparent:true,toneMapped:false,depthWrite:false})); label.position.set(0,435,30); folder.add(label);

// ---------- etiquetas de papel (limpo · cortado · legendado · com cena · com música) ----------

  g.fillStyle=BLUE; g.beginPath(); g.arc(88,88,46,0,Math.PI*2); g.fill(); g.strokeStyle=NAVY; g.lineWidth=11; g.lineCap='round'; g.lineJoin='round';
  g.beginPath(); g.moveTo(66,90); g.lineTo(82,106); g.lineTo(112,72); g.stroke();
  g.fillStyle=NAVY; g.font='800 70px Inter'; g.textBaseline='middle'; g.fillText(txt,160,92);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=16; return t; }
const TAGS=[['Limpo','limpo',-1,330],['Cortado','cortado',1,175],['Legendado','legendado',-1,20],['Com cena','cena',1,-135],['Com música','musica',-1,-290]];
const tags=TAGS.map(([txt,k,side,y],i)=>{ const w=txt.length>8?318:262;
  const m=new THREE.Mesh(new RoundedBoxGeometry(w,90,12,3,14),[paperMat(null),paperMat(null),paperMat(null),paperMat(null),new THREE.MeshStandardMaterial({map:tagTex(txt),roughness:.9}),paperMat(null)]);
  m.material.forEach((mm,j)=>{ if(j!==4) mm.color.set(0xDCD6C9); });
  const g=new THREE.Group(); g.add(m); m.scale.set(1,1,1); S.add(g); g.visible=false; g.userData={k,side,y,w}; return g; });
// as texturas de etiqueta usam proporção 620×176 sobre caixas de 262–318×90: ajusta o repeat para não esticar
tags.forEach(g=>{ const m=g.children[0]; const tx=m.material[4].map; const ar=(g.userData.w/90)/(620/176); if(ar<1){ tx.repeat.set(ar,1); tx.offset.set(0,0); } else { tx.repeat.set(1,1/ar); tx.offset.set(0,(1-1/ar)/2); } });

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.ready, document.fonts.load('500 40px Plex'), document.fonts.load('800 70px Inter'), document.fonts.load('700 26px Inter')];
  const todo=[]; Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) todo.push(['seq',name,i]); });
  DATA.roll.forEach((f,i)=>todo.push(['roll',f,i]));
  let next=0; const worker=()=>{ if(next>=todo.length) return Promise.resolve(); const [kind,name,i]=todo[next++];
    const src=kind==='seq'?`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`:`assets/roll/${name}`;
    return loadImg(src).then(im=>{ if(kind==='seq') SEQ[name][i]=im; else ROLL[i]=im; return worker(); }); };
  for(let k=0;k<8;k++) jobs.push(worker());
  READY=Promise.all(jobs).then(()=>{
    LBL.w=labelTex('— min','tempo de máquina',INK); LBL.a=labelTex('20 min','tempo de máquina',INK); LBL.b=labelTex('30 min','tempo de máquina',INK); LBL.c=labelTex('Pronto','✓ voltou para o celular',BLUE);
    // as etiquetas e a pasta foram desenhadas antes das fontes: redesenha com as fontes carregadas
    tags.forEach((g,i)=>{ const m=g.children[0]; const old=m.material[4].map; const nt=tagTex(TAGS[i][0]); nt.repeat.copy(old.repeat); nt.offset.copy(old.offset); m.material[4].map=nt; m.material[4].needsUpdate=true; });
    const nf=paperTex(g=>{ g.fillStyle='#141B25'; g.font='500 40px Plex, monospace'; g.fillText('CORTEZ · PASTA DE TRABALHO',62,108);
      g.font='800 104px Inter'; g.fillText('01 · Enviar',58,300); g.fillText('vídeos',58,410); g.fillStyle=BLUE; g.fillRect(62,470,220,10); });
    fFront.material[4].map=nf; fFront.material[4].needsUpdate=true;
    BUILT=true; }).catch(err=>{ READY=null; throw err; }); return READY; }

// ---------- câmera ----------
const tmpV=new THREE.Vector3();
function camAt(t){
  const st={px:-300,py:200,pz:2500,tx:0,ty:120,tz:0};
  const mix=(s,u)=>{ for(const k in s) st[k]=lerp(st[k],s[k],u); };
  mix({px:-230,py:190,pz:2330,tx:0,ty:110,tz:0},sm(0,T.pega,t));                                    // aproximação lenta no gancho
  mix({px:40,py:20,pz:1700,tx:0,ty:-6,tz:0},eio((t-T.pega+0.05)/(T.celular-T.pega+0.25)));          // entra na galeria até o vídeo parado
  mix({px:60,py:40,pz:1950,tx:0,ty:-6,tz:0},sm(T.editar-0.2,T.me+0.05,t));                           // recua um pouco: vê o vídeo aceso entre os outros
  mix({px:700,py:-120,pz:2500,tx:700,ty:-220,tz:-120},eio((t-T.me+0.05)/0.62));                        // segue o cartão até a pasta
  mix({px:840,py:-210,pz:2350,tx:800,ty:-280,tz:-160},eio((t-T.em+0.1)/0.7));                       // pasta + anel
  mix({px:40,py:120,pz:2950,tx:0,ty:70,tz:0},eio((t-T.ele+0.05)/0.85));                               // volta ao celular
  mix({px:0,py:110,pz:2780,tx:0,ty:60,tz:0},sm(T.limpo,T.eu,t));                                       // aproximação lenta com as etiquetas
  mix({px:0,py:150,pz:3250,tx:0,ty:90,tz:0},eio((t-T.eu+0.05)/0.9));                                  // "Eu sou o Cortez": recua
  mix({px:0,py:120,pz:3500,tx:0,ty:-120,tz:0},eio((t-T.cta0)/1.2));                                    // CTA: o celular desce e fica atrás do texto
  C.position.set(st.px,st.py,st.pz); C.lookAt(st.tx,st.ty,st.tz);
  return tmpV.set(st.tx,st.ty,st.tz);
}

function render(t){
  camAt(t);
  // celular: entra girando no gancho; encara a câmera na galeria; balanço leve depois
  const ent=eo(t/0.75), sp=settle(t-0.75);
  const face=eio((t-T.pega+0.1)/1.2);
  phone.position.set(0,lerp(-150,0,ent)+6*sp,0);
  phone.rotation.set(lerp(0.2,0.06,ent)*(1-face)+0.02*Math.sin(t*0.9)*sm(T.limpo,T.limpo+1,t),
                     lerp(-0.62,-0.24,ent)*(1-face)+lerp(0,0.07,sm(T.eu,T.eu+0.8,t))+0.035*Math.sin(t*1.1)*sm(T.limpo,T.limpo+1,t), lerp(0.05,0.0,ent)*(1-face));
  phone.updateMatrixWorld(true);
  sheen.material.opacity=0.035+0.04*Math.abs(Math.sin(phone.rotation.y*3+0.6));
  sheen.material.map.offset.set(-phone.rotation.y*0.8,0);
  drawScreen(t);
  // cartão do vídeo parado: sai da tela, gira, voa até a pasta e cai dentro dela
  const a0=T.me-0.04, a1=T.manda+0.08, b1=T.em+0.22, c1=T.em+0.55;
  cardOut.visible=t>=a0 && t<c1;
  if(cardOut.visible){ setFrame(TX.raw, loopOf('raw',t,0));
    const P0=new THREE.Vector3(HLlocal.x,HLlocal.y,PD/2+1.5).applyMatrix4(phone.matrixWorld);
    const lift=eo((t-a0)/(a1-a0)), fly=eio((t-a1)/(b1-a1)), drop=ei((t-b1)/(c1-b1));
    const P1=P0.clone().add(new THREE.Vector3(30,40,340));
    const P2=new THREE.Vector3(F.x,F.y+200,F.z+18);
    const p=P0.clone().lerp(P1,lift); const pf=P1.clone().lerp(P2,fly); pf.y+=260*Math.sin(Math.PI*fly);
    if(fly>0) p.copy(pf); p.y-=260*drop;
    cardOut.position.copy(p);
    cardOut.rotation.set(-0.12*lift*(1-fly), phone.rotation.y*(1-lift)+Math.PI*eio((t-a1)/(b1-a1-0.05)), 0.18*Math.sin(Math.PI*fly));
    cardOut.scale.setScalar(lerp(1,1.55,lift)*lerp(1,0.92,fly));
  }
  // pasta: a frente abre um pouco para receber e para devolver
  const open=0.22*gauss(t,T.em+0.25,0.28)+0.3*sm(T.ele-0.15,T.ele+0.1,t)*(1-sm(T.volta+0.25,T.volta+0.6,t));
  frontPivot.rotation.x=-0.08-open;
  folder.position.set(F.x+1100*eio((t-T.pronto-0.1)/0.9),F.y+8*Math.sin(t*1.3),F.z); folder.visible=t<T.limpo+1.2; folder.rotation.y=-0.16+0.03*Math.sin(t*0.8);
  // anel de progresso: 0 → 20 min (2/3) → 30 min
  const p1=eio((t-T.vinte+0.05)/(T.trinta-T.vinte+0.05))*0.667, p2=eio((t-T.trinta+0.02)/(T.minutosE-T.trinta+0.1))*0.333;
  setArc(p1+p2); ringMat.emissiveIntensity=0.5+0.7*gauss(t,T.minutosE+0.12,0.18);
  if(LBL.w){ const L= t<T.vinte?LBL.w : t<T.trinta?LBL.a : t<T.volta?LBL.b : LBL.c; if(label.material.map!==L){ label.material.map=L; label.material.needsUpdate=true; }
    label.material.opacity=sm(T.em-0.1,T.em+0.25,t); }
  // cartão do vídeo pronto: sobe da pasta e encaixa na tela do celular
  const r0=T.ele-0.05, r1=T.volta+0.25, r2=T.pronto+0.32;
  cardIn.visible=t>=r0 && t<r2+0.02;
  if(cardIn.visible){ setFrame(TXfinC, frameOf('fin',t,T.pronto+0.32-0.5));
    const rise=eo((t-r0)/(r1-r0)), go=eio((t-r1)/(r2-r1));
    const A=new THREE.Vector3(F.x,F.y-40,F.z+16), B=new THREE.Vector3(F.x-40,F.y+330,F.z+120);
    const Ph=new THREE.Vector3(0,0,PD/2+1.6).applyMatrix4(phone.matrixWorld);
    const p=A.clone().lerp(B,rise); if(go>0){ p.copy(B.clone().lerp(Ph,go)); p.z+=220*Math.sin(Math.PI*go); }
    cardIn.position.copy(p);
    cardIn.rotation.set(0, lerp(-0.5,0,go)+Math.PI*2*eio((t-r1)/(r2-r1))*0+phone.rotation.y*go, lerp(0.12,0,go));
    cardIn.scale.setScalar(lerp(0.4,1,go));
    cardIn.userData.edge.material.opacity=1-sm(r2-0.15,r2,t);
  }
  // etiquetas de papel nas palavras
  tags.forEach((g,i)=>{ const {k,side,y,w}=g.userData; const t0=T[k]-0.04;
    g.visible=t>=t0 && t<T.eu+0.5;
    if(!g.visible) return;
    const u=ebk((t-t0)/0.42), out=eio((t-T.eu+0.05)/0.38);
    g.position.set(side*(PW/2-50)+side*28*(1-u)+side*1100*out, 60+y+6*Math.sin(t*1.4+i), 120+60*(1-u));
    g.rotation.set(0.04*Math.sin(t+i), -side*0.12+side*0.22*(1-u), side*(0.035*((i%2)?1:-1))+side*0.25*(1-u));
    g.scale.setScalar(Math.max(0.001,lerp(0.55,1,u)));
    g.children[0].material.forEach(m=>{ m.transparent=out>0; m.opacity=1-out; });
  });
  // foco e brilho
  const subj=new THREE.Vector3();
  if(t>=T.me+0.3 && t<T.ele+0.4) subj.copy(folder.position); else subj.set(0,phone.position.y,PD/2);
  if(t>=T.pega && t<T.me) { subj.set(HLlocal.x,HLlocal.y,PD/2).applyMatrix4(phone.matrixWorld); }
  bokeh.uniforms.focus.value=C.position.distanceTo(subj);
  bokeh.uniforms.aperture.value=0.0000026;
  bloom.strength=0.05+0.08*gauss(t,T.minutosE+0.12,0.2)+0.05*gauss(t,T.pronto+0.32,0.15);
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!BUILT){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
