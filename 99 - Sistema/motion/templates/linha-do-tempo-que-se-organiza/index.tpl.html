function camAt(t){
  const st={px:0,py:-230,pz:2750,tx:0,ty:-520,tz:-4000};

  mix({px:0,py:-290,pz:1950,tx:0,ty:-560,tz:-4600},sm(0,T.cortando+0.2,t));                               // voo baixo sobre a estrada (gancho)
  mix({px:0,py:140,pz:3500,tx:0,ty:110,tz:0},eio((t-T.cortando+0.35)/0.8));                           // sobe: janelas empilhadas
  mix({px:-40,py:150,pz:3350,tx:0,ty:100,tz:0},sm(T.cortando+0.5,T.eu,t));                              // aproximação lenta (sufoco)
  mix({px:0,py:620,pz:4300,tx:0,ty:-40,tz:-900},eio((t-T.eu+0.05)/0.55));                          // recua e sobe: os clipes decolam
  mix({px:0,py:170,pz:3080,tx:0,ty:170,tz:0},eio((t-T.eu-0.45)/0.95));                                // encaixe: vídeo pronto
  mix({px:330,py:240,pz:3550,tx:0,ty:120,tz:0},eio((t-T.faco+0.05)/1.0));                             // recua um pouco: selos ao redor
  mix({px:0,py:120,pz:3600,tx:0,ty:40,tz:0},eio((t-T.vinte+0.1)/0.7));                                // barra de tempo abaixo do vídeo
  mix({px:420,py:220,pz:3550,tx:560,ty:130,tz:500},eio((t-T.enquanto+0.05)/1.0));                     // vira para o dia: tarefas do negócio
  mix({px:0,py:150,pz:3520,tx:0,ty:120,tz:0},eio((t-T.voce2+0.15)/0.75));                             // volta: confere e aprova
  mix({px:0,py:40,pz:4600,tx:0,ty:-240,tz:0},eio((t-T.cta0)/1.6));                                    // CTA
  C.position.set(st.px,st.py,st.pz); C.lookAt(st.tx,st.ty,st.tz);

}

  // barra de tempo (20–30 min) e tarefas
  const tu=clamp((t-T.vinte)/(T.minutos+0.45-T.vinte),0,1); const to=eo((t-T.vinte+0.25)/0.35)*(1-sm(T.voce2-0.2,T.voce2+0.1,t));
  tbar.visible=to>0.001; tbar.position.set(0,SCY-SH/2+120,160); tbar.userData.draw(tbar.userData.ctx,640,140,eio(tu)); tbar.userData.tx.needsUpdate=true;
  tbar.children.forEach(m=>{ if(m.material) m.material.opacity=(m===tbar.userData.sh?.4:1)*to; });
  const BZ=[[560,470,760],[630,150,840],[550,-170,780]];
  biz.forEach((b,k)=>{ const t0=T.cuida-0.2+k*0.22; const u=eo((t-t0)/0.45), o=1-sm(T.voce2-0.1,T.voce2+0.25,t); b.visible=t>=t0-0.02 && o>0;
    b.position.set(BZ[k][0]+160*(1-u),BZ[k][1],BZ[k][2]); b.rotation.y=-0.32; b.scale.setScalar(1.2); b.children.forEach(m=>{ if(m.material) m.material.opacity=(m===b.userData.sh?.3:1)*u*o; }); });
  // foco e brilho
  const subj=new THREE.Vector3(); if(t<T.cortando) subj.set(0,-540,600); else if(t<T.eu) subj.set(0,80,300); else if(t<T.enquanto) subj.set(0,SCY,0);
  else if(t<T.voce2) subj.set(650,150,800); else subj.set(0,SCY,0);
  bokeh.uniforms.focus.value=C.position.distanceTo(subj);
  bokeh.uniforms.aperture.value=(t<T.cortando?0.0000045:0.0000028)*(t>T.cta0?0:1);
  bloom.strength=(0.22+0.15*gauss(t,T.eu+0.5,0.35))*(1-day);
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!BUILT){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
