    g.beginPath(); g.arc(700,300,60,0,Math.PI*2); g.fill();
    g.fillStyle='#8E8E8E'; g.font='700 86px Arial, Helvetica, sans-serif'; g.textBaseline='alphabetic'; g.fillText('TÍTULO AQUI',70,900);
    g.fillStyle='#C9C9C9'; [980,1040,1100].forEach((y,j)=>{ g.fillRect(70,y,j===2?520:800,26); });
    g.fillStyle='#B0B0B0'; g.beginPath(); g.roundRect(70,1190,360,100,50); g.fill(); g.fillStyle='#F1F1F1'; g.font='700 40px Arial, sans-serif'; g.fillText('BOTÃO',160,1254); }
  else { const gr=g.createLinearGradient(0,0,W,H); gr.addColorStop(0,'#6A5CFF'); gr.addColorStop(.5,'#FF5CB8'); gr.addColorStop(1,'#35D0FF'); g.fillStyle=gr; g.fillRect(0,0,W,H);
    const rg=g.createRadialGradient(480,600,40,480,600,620); rg.addColorStop(0,'rgba(255,255,255,.55)'); rg.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=rg; g.fillRect(0,0,W,H);
    g.fillStyle='#FFFFFF'; g.textAlign='center'; g.font='800 92px Arial, Helvetica, sans-serif'; g.fillText('✦ INCRÍVEL ✦',480,640); g.font='700 54px Arial, sans-serif'; g.fillText('vídeo gerado por IA',480,740);
    g.globalAlpha=.85; ['✦','✧','✦','✧'].forEach((s,j)=>{ g.font='700 70px Arial'; g.fillText(s,[160,800,220,760][j],[300,360,1080,1150][j]); }); g.globalAlpha=1; }
}

// ---------- pele da placa de vídeo (desenhada a cada quadro; o vídeo por baixo é sempre o mesmo) ----------
const SKINS=DATA.skins;
function drawSkin(g,sk,img,a){ const W=720,H=1280; g.save(); g.globalAlpha=a;
  g.fillStyle=sk.bg; g.fillRect(0,0,W,H);
  const x=40,y=sk.raw?40:132,w=W-80,h=sk.raw?H-80:860;
  g.save(); g.beginPath(); g.roundRect(x,y,w,h,sk.raw?22:26); g.clip(); const s=Math.max(w/img.width,h/img.height); const iw=img.width*s, ih=img.height*s;
  g.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih); g.restore();
  if(sk.raw){ g.fillStyle='rgba(23,9,44,.72)'; g.beginPath(); g.roundRect(64,70,330,54,27); g.fill(); g.fillStyle='#FFFFFF'; g.font='700 24px JBMono'; g.textBaseline='middle'; g.fillText('SEU VÍDEO · SEM IDENTIDADE',84,98); g.restore(); return; }
  g.textBaseline='middle'; g.font='700 24px JBMono'; g.fillStyle=sk.accent; g.beginPath(); g.arc(56,72,7,0,Math.PI*2); g.fill(); g.fillText(sk.tagL,74,73);
  g.textAlign='right'; g.fillStyle=sk.muted; g.fillText(sk.tagR,W-42,73); g.textAlign='left';
  const cy=1100; // legenda no estilo da ID
  if(sk.cap==='serif'){ g.font='700 64px Baskerville'; g.textAlign='center'; g.fillStyle=sk.fg; g.fillText('Com a',W/2,cy-40); g.font='italic 700 72px Baskerville'; g.fillStyle=sk.accent; g.fillText('sua cara.',W/2,cy+44); }
  else if(sk.cap==='box'){ g.font='800 66px Inter'; g.textAlign='left'; const a1='Com a ', a2='sua cara.'; const w1=g.measureText(a1).width, w2=g.measureText(a2).width; const x0=(W-w1-w2-24)/2;
    g.fillStyle=sk.fg; g.fillText(a1,x0,cy); g.fillStyle=sk.accent; g.fillRect(x0+w1-6,cy-46,w2+24,92); g.fillStyle=sk.boxText; g.fillText(a2,x0+w1+6,cy+2); }
  else if(sk.cap==='under'){ g.font='800 66px Inter'; g.textAlign='center'; g.fillStyle=sk.fg; g.fillText('Com a sua cara.',W/2,cy); const w2=g.measureText('sua cara.').width, wt=g.measureText('Com a sua cara.').width;
    g.fillStyle=sk.accent; g.fillRect(W/2+wt/2-w2,cy+44,w2,10); }
  else if(sk.cap==='instrument'){ g.font='400 86px Instrument'; g.textAlign='center'; g.fillStyle=sk.fg; const a1='Com a ', a2='sua cara.'; g.font='400 86px Instrument'; const w1=g.measureText(a1).width; g.font='italic 400 86px Instrument'; const w2=g.measureText(a2).width;
    const x0=(W-w1-w2)/2; g.textAlign='left'; g.font='400 86px Instrument'; g.fillText(a1,x0,cy); g.font='italic 400 86px Instrument'; g.fillStyle=sk.accent; g.fillText(a2,x0+w1,cy); }
  else { g.font='800 70px Manrope'; g.textAlign='left'; const a1='Com a ', a2='sua cara.'; const w1=g.measureText(a1).width, w2=g.measureText(a2).width; const x0=(W-w1-w2-36)/2;
    g.fillStyle=sk.fg; g.fillText(a1,x0,cy); g.fillStyle=sk.accent; g.beginPath(); g.roundRect(x0+w1-8,cy-50,w2+36,100,50); g.fill(); g.fillStyle='#FFFFFF'; g.fillText(a2,x0+w1+10,cy+2); }
  g.textAlign='left'; g.restore(); }

function drawBoard(t){ const g=bg, W=1200, H=1640; g.clearRect(0,0,W,H);
  g.fillStyle=PUR; g.beginPath(); g.arc(78,96,10,0,Math.PI*2); g.fill(); g.font='700 34px JBMono'; g.textBaseline='middle'; g.fillText('SUA IDENTIDADE VISUAL',102,98);
  g.fillStyle=INK; g.font='800 118px Manrope'; g.textBaseline='alphabetic'; g.fillText('Sua marca',70,262);
  g.strokeStyle='rgba(23,9,44,.10)'; g.lineWidth=3; g.setLineDash([16,12]);
  [[70,330,470,470],[630,330,500,470],[70,1180,1060,300]].forEach(r=>{ g.beginPath(); g.roundRect(r[0],r[1],r[2],r[3],26); g.stroke(); }); g.setLineDash([]);
  const rows=[['COR','#820AD1 · roxo',T.dock1],['FONTE','Manrope',T.dock2],['LEGENDA','pílula roxa',T.dock3]];
  rows.forEach(([k,v,at],j)=>{ const a=sm(at+0.05,at+0.35,t); if(a<=0) return; g.globalAlpha=a; const y=870+j*96;
    g.fillStyle=PUR2; g.font='800 36px JBMono'; g.textBaseline='middle'; g.fillText(k,70,y); g.fillStyle=INK; g.font='800 54px Manrope'; g.fillText(v,330,y);
    g.fillStyle=PUR; g.beginPath(); g.arc(1110,y,14,0,Math.PI*2); g.fill(); g.strokeStyle='#FFFFFF'; g.lineWidth=5; g.beginPath(); g.moveTo(1102,y); g.lineTo(1108,y+7); g.lineTo(1120,y-7); g.stroke(); g.globalAlpha=1; });
  btx.needsUpdate=true; }

function prepare(){ if(READY) return READY;
  const loader=new FontLoader();
  const jobs=[document.fonts.ready, document.fonts.load('800 70px Manrope'), document.fonts.load('700 30px JBMono'), document.fonts.load('700 64px Baskerville'), document.fonts.load('italic 700 64px Baskerville'),
    document.fonts.load('400 86px Instrument'), document.fonts.load('italic 400 86px Instrument'), document.fonts.load('800 66px Inter')];
  Object.entries(DATA.typefaces).forEach(([k,f])=>jobs.push(fetch(f).then(r=>r.json()).then(j=>{ FONTS[k]=loader.parse(j); })));
  Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  READY=Promise.all(jobs).then(()=>{ build(); BUILT=true; }); return READY; }

// ---------- quadro ----------
function render(t){
  const ex=T;
  // ===== câmera: frontal, leve paralaxe; aproxima nos momentos-chave; recua no fim
  let dist=D*1.0, yaw=0.10, pitch=0.045, ty=40, tx=0;
  const ks=[[0,{dist:D*1.0,yaw:0.10,pitch:0.05,ty:40,tx:0}],[T.cores-0.1,{dist:D*0.98,yaw:0.05,pitch:0.05,ty:30,tx:0}],[T.fonte-0.25,{dist:D*0.96,yaw:-0.06,pitch:0.07,ty:-20,tx:0}],
    [T.estilo-0.2,{dist:D*0.97,yaw:-0.10,pitch:0.06,ty:0,tx:40}],[T.monto-0.3,{dist:D*1.0,yaw:0.0,pitch:0.04,ty:20,tx:0}],[T.visual,{dist:D*0.94,yaw:0.05,pitch:0.04,ty:30,tx:0}],
    [T.e0-0.05,{dist:D*1.02,yaw:-0.08,pitch:0.04,ty:20,tx:60}],[T.cara,{dist:D*0.95,yaw:-0.03,pitch:0.035,ty:20,tx:40}],[T.nao-0.1,{dist:D*1.0,yaw:0.0,pitch:0.04,ty:20,tx:0}],
    [T.eu2-0.05,{dist:D*1.0,yaw:0.06,pitch:0.06,ty:-10,tx:0}],[T.jeito,{dist:D*0.97,yaw:0.0,pitch:0.05,ty:-10,tx:0}],[T.cta0,{dist:D*1.16,yaw:0.0,pitch:0.04,ty:-150,tx:0}]];
  for(let k=1;k<ks.length;k++){ const [a,s]=ks[k]; const prev=ks[k-1][0]; const dur=Math.min(0.9,Math.max(0.35,(a-prev)*0.8)); const u=eio((t-a)/dur);
    if(u>0){ dist=lerp(dist,s.dist,u); yaw=lerp(yaw,s.yaw,u); pitch=lerp(pitch,s.pitch,u); ty=lerp(ty,s.ty,u); tx=lerp(tx,s.tx,u); } }
  yaw+=0.018*Math.sin(t*0.6);
  const tgt=V3(tx,ty,0);
  C.position.set(tgt.x+dist*Math.sin(yaw)*Math.cos(pitch), tgt.y+dist*Math.sin(pitch), tgt.z+dist*Math.cos(yaw)*Math.cos(pitch)); C.lookAt(tgt);

  // ===== 4a) prancha: entra no "Eu monto", recebe cor / fonte / legenda, vai para a esquerda quando o vídeo entra, carimba a placa no "sua cara"
  const bIn=spring((t-T.eu)/0.9), bAside=eio((t-T.e0+0.15)/0.7), bStamp=eio((t-T.sua+0.32)/0.34)*(1-eio((t-T.cara+0.02)/0.42)), bGone=eio((t-T.nao+0.05)/0.6);
  board.visible=t>T.eu-0.1 && bGone<0.999;
  board.position.set(lerp(lerp(0,-300,bAside),150,bStamp),lerp(-1500,10,clamp(bIn,0,1.2))+lerp(0,-20,bAside),lerp(lerp(0,-260,bAside),300,bStamp)-1100*bGone);
  board.rotation.set(0,lerp(lerp(0,0.34,bAside),-0.16,bStamp),0); board.scale.setScalar(lerp(lerp(1,0.7,bAside),0.8,bStamp));
  board.updateMatrixWorld(true);
  if(board.visible) drawBoard(t);
  const slot=(loc)=>loc.clone().applyMatrix4(board.matrixWorld);
  const dockU=(at)=>eio((t-at+0.45)/0.5);

  // ===== 1) leque de cores (cores reais das IDs)
  const fanOut=eio((t-T.fonte+0.35)/0.55), fanGone=eio((t-T.monto+0.12)/0.42);
  fan.visible=t<T.nao+0.7;
  fan.position.set(-1500*fanGone,lerp(-430,-470,fanOut)+120*fanGone,lerp(0,-560,fanOut)-300*fanGone); fan.scale.setScalar(lerp(1,0.8,fanOut));
  fan.rotation.y=lerp(-0.18,0,eio((t-T.cores+0.25)/0.6))+0.04*Math.sin(t*0.7)*(1-fanOut);
  const open=lerp(0.55,0.92,spring((t-T.cores+0.05)/0.9));
  const N=STRIPS.length; pin.visible=fanGone<0.99;
  fan.updateMatrixWorld(true);
  STRIPS.forEach((p,i)=>{ const u=(i-(N-1)/2)/((N-1)/2); const ang=-u*1.02*open; p.rotation.set(0,0,ang); p.position.set(0,0,i*2.2);
    const hero=p.userData.s.hero, f=p.userData.front; const pick=hero?spring((t-T.marca+0.02)/0.8):0;
    f.position.set(0,SWH/2-60+lerp(0,170,clamp(pick,0,1.1)),lerp(0,140,clamp(pick,0,1.1))); f.rotation.set(lerp(0,-0.08,clamp(pick,0,1)),0,0); f.scale.setScalar(1);
    p.visible=hero?board.visible||t<T.monto:fanGone<0.99;
    if(hero){ const d=dockU(T.dock1); if(d>0){ p.updateMatrixWorld(true); const restW=new THREE.Vector3(); f.getWorldPosition(restW);
        const w=restW.lerp(slot(V3(-170,140,44)),d); f.position.copy(p.worldToLocal(w.clone()));
        f.rotation.set(lerp(-0.08,0,d),lerp(0,board.rotation.y-fan.rotation.y,d),lerp(0,-ang,d)); f.scale.setScalar(lerp(1,0.42*board.scale.x/fan.scale.x,d)); } } });

  // ===== 2) tipos de metal com as fontes reais das IDs
  const sortsIn=T.fonte-0.42, sortsGone=eio((t-T.monto+0.12)/0.42);
  sortsG.visible=t>sortsIn-0.05;
  SORTS.forEach((g,i)=>{ const u=spring((t-sortsIn-i*0.06)/0.8);  const hero=g.userData.s.hero; const pick=hero?eio((t-T.fonte-0.12)/0.4):0;
    const u0=eo((t-sortsIn-i*0.06)/0.7); const rest=V3((i-1.5)*232,FLOOR_Y+85+lerp(0,70,pick)+40*Math.sin(Math.PI*clamp(u0,0,1))*(1-u0),lerp(-1900,250,u0)+lerp(0,80,pick));
    const ry=lerp(0.35,0,eio((t-sortsIn)/0.8))-0.05*(i-1.5);
    g.userData.inkM.color.set(pick>0.5?PUR:INK);
    if(hero){ const d=dockU(T.dock2); g.position.copy(rest.lerp(slot(V3(170,60,90)),d)); g.rotation.set(0,lerp(ry,board.rotation.y,d),0); g.scale.setScalar(lerp(1,0.6*board.scale.x,d));
      g.visible=board.visible||t<T.monto; }
    else { g.position.copy(rest).add(V3(-1400*sortsGone,60*sortsGone,-200*sortsGone)); g.rotation.set(0,ry,0); g.scale.setScalar(1-0.3*sortsGone); g.visible=sortsGone<0.99; } });

  // ===== 3) placas de estilo de legenda
  const platesIn=T.estilo-0.32, platesGone=eio((t-T.monto+0.12)/0.42);
  platesG.visible=t>platesIn-0.05;
  PLATES.forEach((g,i)=>{ const u=eio((t-platesIn-i*0.07)/0.55); const hero=g.userData.p.hero; const pick=hero?spring((t-T.estilo-0.15)/0.7):0;
    const rest=V3(lerp(1300,250,u)-lerp(0,80,clamp(pick,0,1)),(1-i)*175-40,lerp(420,470,u)+lerp(0,90,clamp(pick,0,1)));
    const ry=lerp(-0.6,-0.28,u)+lerp(0,0.2,clamp(pick,0,1));
    if(hero){ const d=dockU(T.dock3); g.position.copy(rest.lerp(slot(V3(0,-300,44)),d)); g.rotation.set(0,lerp(ry,board.rotation.y,d),0); g.scale.setScalar(lerp(1,1.12*board.scale.x,d));
      g.visible=board.visible||t<T.monto; }
    else { g.position.copy(rest).add(V3(1100*platesGone,0,-200*platesGone)); g.rotation.set(0,ry,0); g.visible=platesGone<0.99; } });

  // ===== 5) placa do vídeo (o mesmo vídeo, várias identidades); no "Eu sou o Cortez" encolhe e entra no centro do arco de entregas reais
  const pIn=eio((t-T.e0+0.25)/0.7), pCenter=eio((t-T.eu2+0.05)/0.85), pCta=eio((t-T.cta0)/1.0);
  plate.visible=t>T.e0-0.35;
  plate.position.set(lerp(1300,150,pIn)-150*pCenter,20-lerp(0,10,pCenter),lerp(60,120,pIn)-lerp(0,80,pCenter));
  plate.rotation.set(0,lerp(-0.5,-0.16,pIn)+0.16*pCenter+0.03*Math.sin(t*0.8)*(1-pCenter),0); plate.scale.setScalar(lerp(1,0.64,pCenter));
  if(plate.visible){ const img=loopOf('base',t,T.e0-0.3); const sch=DATA.skinAt; let cur=0; for(let k=0;k<sch.length;k++) if(t>=sch[k].t) cur=k;
    const prev=Math.max(0,cur-1); const w=eio((t-sch[cur].t)/0.28);
    if(cur>0 && w<1){ drawSkin(pg,SKINS[sch[prev].skin],img,1); pg.save(); pg.beginPath(); pg.rect(0,0,720*w,1280); pg.clip(); drawSkin(pg,SKINS[sch[cur].skin],img,1); pg.restore();
      pg.fillStyle=SKINS[sch[cur].skin].accent; pg.fillRect(720*w-4,0,8,1280); }
    else drawSkin(pg,SKINS[sch[cur].skin],img,1);
    ptx.needsUpdate=true; }

  // ===== 6) cartões descartados ("modelo pronto", "cara de IA")
  CARDS.forEach((g,i)=>{ const k=g.userData.k; const a=k.at, kill=k.kill; const side=i===0?-1:1;
    const u=eio((t-a)/0.5), cut=eio((t-kill)/0.22), out=eio((t-kill-0.2)/0.55);
    g.visible=t>a-0.05 && out<0.999;
    g.position.set(lerp(side*1200,side*40+(i?120:-60),u)+side*900*out,lerp(60,30,u)-600*out,lerp(380,420,u));
    g.rotation.set(0,side*lerp(0.7,0.12,u),side*(lerp(0.12,0.04,u)+0.5*out));
    g.userData.slash.scale.x=Math.max(0.001,cut); g.userData.face.material.opacity=1-0.35*cut; });

  // ===== 7) entregas reais em IDs diferentes ("do seu jeito"): arco com a placa da pessoa no centro
  PROOF.forEach((g,i)=>{ const c=[-2,-1,1,2][i]; const u=spring((t-T.cortez+0.12-Math.abs(c)*0.08)/0.9);
    g.visible=t>T.cortez-0.35;
    g.position.set(c*262,lerp(-1600,10,clamp(u,0,1.15))-Math.abs(c)*14,-Math.abs(c)*170-60);
    g.rotation.set(0,-c*0.27,0);
    if(g.visible){ setFrame(g.userData.tx,loopOf(g.userData.p.seq,t,T.cortez-0.3)); } });

  // ===== sombra acompanha o enquadramento
  key.target.position.set(tx,0,0); key.position.set(tx-1100,1900,1700);
  R.render(S,C);
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!BUILT){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
