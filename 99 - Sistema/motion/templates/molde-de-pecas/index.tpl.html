{ const N=DATA.wave.length, X0=-352, X1=352, top=[], bot=[];

const playhead=new THREE.Mesh(new THREE.PlaneGeometry(4,150),new THREE.MeshBasicMaterial({color:new THREE.Color(0xFFF1C6).multiplyScalar(2.2),transparent:true,toneMapped:false})); playhead.position.z=20; TB.voz.fl.add(playhead);

// ---------- TRILHA: disco dourado com sulcos + a onda real da trilha ----------
const grooveTex=ctex(512,512,(g)=>{ g.fillStyle='#1a2c44'; g.beginPath(); g.arc(256,256,256,0,Math.PI*2); g.fill();
  for(let r=250;r>92;r-=5){ g.strokeStyle=r%10?'rgba(244,206,101,0.32)':'rgba(255,240,200,0.12)'; g.lineWidth=2; g.beginPath(); g.arc(256,256,r,0,Math.PI*2); g.stroke(); }
  const gr=g.createRadialGradient(256,256,0,256,256,92); gr.addColorStop(0,'#F7DD8E'); gr.addColorStop(1,'#DFAD22'); g.fillStyle=gr; g.beginPath(); g.arc(256,256,92,0,Math.PI*2); g.fill();
  g.fillStyle='#0D2137'; g.beginPath(); g.arc(256,256,12,0,Math.PI*2); g.fill(); });
const disc=new THREE.Mesh(new THREE.CylinderGeometry(122,122,10,96),[new THREE.MeshPhysicalMaterial({color:GOLD,metalness:1,roughness:.3,envMapIntensity:1.4}),
  new THREE.MeshPhysicalMaterial({map:grooveTex,metalness:.6,roughness:.35,clearcoat:1,clearcoatRoughness:.08,envMapIntensity:1.2}), new THREE.MeshBasicMaterial({color:0x0D2137})]);
disc.rotation.x=Math.PI/2; disc.position.set(0,70,16); TB.mus.fl.add(disc);

// ---------- ANIMAÇÃO: cubo dourado num caminho com rastro (onion skin) ----------
const cubeGeo=new THREE.ExtrudeGeometry(rr(new THREE.Shape(),46,46,10),{depth:30,bevelEnabled:true,bevelThickness:6,bevelSize:6,bevelSegments:4,curveSegments:8}); cubeGeo.center();
const animPath=new THREE.CubicBezierCurve3(V3(-120,-150,26),V3(-140,120,26),V3(90,-60,26),V3(118,150,26));
const ghosts=[]; for(let k=0;k<6;k++){ const m=new THREE.Mesh(cubeGeo,new THREE.MeshPhysicalMaterial({color:GOLD,metalness:1,roughness:.25,envMapIntensity:1.5,transparent:true,opacity:k?(.42-.065*k):1}));
  TB.anim.fl.add(m); ghosts.push(m); }

// ---------- REC ----------
const rec=new THREE.Group(); S.add(rec); rec.visible=false;
const recRing=new THREE.Mesh(new THREE.TorusGeometry(150,15,32,120),new THREE.MeshPhysicalMaterial({color:GOLD,metalness:1,roughness:.22,envMapIntensity:1.6})); rec.add(recRing);
const recDot=new THREE.Mesh(new THREE.CylinderGeometry(104,104,22,96),new THREE.MeshPhysicalMaterial({color:0x8E1B1B,metalness:.15,roughness:.32,clearcoat:1,clearcoatRoughness:.08,envMapIntensity:.9})); recDot.rotation.x=Math.PI/2; rec.add(recDot);
const recLab=new THREE.Mesh(new THREE.PlaneGeometry(300,60),new THREE.MeshBasicMaterial({transparent:true,toneMapped:false})); recLab.position.set(0,-232,0); rec.add(recLab);

// ---------- barra de progresso do vídeo pronto (do começo ao fim) ----------
const barBg=new THREE.Mesh(new THREE.PlaneGeometry(700,8),new THREE.MeshBasicMaterial({color:0xF1EEE8,transparent:true,opacity:0,toneMapped:false}));
const barFg=new THREE.Mesh(new THREE.PlaneGeometry(700,8),new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:0,toneMapped:false}));
const barHead=new THREE.Mesh(new THREE.CircleGeometry(13,32),new THREE.MeshBasicMaterial({color:0xFFF1C6,transparent:true,opacity:0,toneMapped:false}));
[barBg,barFg,barHead].forEach((m,i)=>{ m.position.set(0,-652,DEP+2*BEV+1.6+i*.3); MG.add(m); }); barFg.geometry.translate(350,0,0); barFg.position.x=-350;

// ---------- varredura dourada ("Eu sou o Cortez") ----------
const sweep=new THREE.Mesh(new THREE.PlaneGeometry(26,2200),new THREE.MeshBasicMaterial({color:0xFFE7A6,transparent:true,opacity:0,toneMapped:false,blending:THREE.AdditiveBlending,depthWrite:false}));
sweep.rotation.z=-.38; sweep.position.z=4; MG.add(sweep);

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.load('800 80px Inter'), document.fonts.load('600 30px Inter'), document.fonts.ready];
  Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  ['capa','thumb'].forEach(n=>jobs.push(loadImg(`assets/img/${n}.jpg`).then(im=>IMG[n]=im)));
  READY=Promise.all(jobs).then(()=>{
    TILES.forEach(d=>{ if(d.chipM){ const c=chipTex(d.chip), s=.5; d.chipM.geometry.dispose(); d.chipM.geometry=new THREE.PlaneGeometry(c.W*s,c.H*s); d.chipM.material.map=c.tex; d.chipM.material.needsUpdate=true;
        d.chipM.position.set(-d.bw/2+14+c.W*s/2, d.bh/2-14-c.H*s/2, 1.6); d.chipM.visible=true; }
      if(d.slotLab){ d.slotLab.material.map=ctex(512,96,(g)=>{ g.font='600 40px Inter'; g.fillStyle='rgba(244,206,101,0.9)'; g.textAlign='center'; g.textBaseline='middle'; if(g.letterSpacing!==undefined) g.letterSpacing='8px'; g.fillText(d.slotName,256,50); }); d.slotLab.material.needsUpdate=true; } });
    recLab.material.map=ctex(600,120,(g)=>{ g.font='800 64px Inter'; g.textAlign='center'; g.textBaseline='middle'; if(g.letterSpacing!==undefined) g.letterSpacing='14px'; g.fillStyle='#F4CE65'; g.fillText('REC',306,64); }); recLab.material.needsUpdate=true;
    // frentes desenhadas (2x)
    const tile=(id,draw)=>{ const d=TB[id]; const W=Math.round((d.bw-10)*2), H=Math.round((d.bh-10)*2); d.front.material.map=ctex(W,H,(g)=>draw(g,W,H)); d.front.material.needsUpdate=true; };
    const card=(g,W,H)=>{ const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#13304f'); gr.addColorStop(1,'#0a1c32'); g.fillStyle=gr; g.fillRect(0,0,W,H); };
    tile('voz',(g,W,H)=>{ card(g,W,H); g.strokeStyle='rgba(244,206,101,0.22)'; g.lineWidth=2; g.beginPath(); g.moveTo(40,H/2+12); g.lineTo(W-40,H/2+12); g.stroke();
      g.font='600 26px Inter'; g.fillStyle='#F4CE65'; if(g.letterSpacing!==undefined) g.letterSpacing='5px'; g.textBaseline='top'; g.fillText('VOZ · GERADA POR IA',34,24);
      g.textAlign='right'; g.fillStyle='rgba(241,238,232,0.6)'; g.fillText('SEM MICROFONE',W-34,24); });
    tile('capa',(g,W,H)=>coverDraw(g,IMG.capa,W,H));
    tile('thumb',(g,W,H)=>coverDraw(g,IMG.thumb,W,H));
    tile('leg',(g,W,H)=>{ card(g,W,H); g.font='800 74px Inter'; g.textAlign='center'; g.textBaseline='middle'; const y=H/2+18;
      const a='Do seu ', b='jeito.'; const wa=g.measureText(a).width, wb=g.measureText(b).width, x0=W/2-(wa+wb)/2;
      g.lineJoin='round'; g.lineWidth=18; g.strokeStyle='#020404'; g.textAlign='left'; g.strokeText(a,x0,y); g.strokeText(b,x0+wa,y);
      g.fillStyle='#FFFFFF'; g.fillText(a,x0,y); g.fillStyle='#F4CE65'; g.fillText(b,x0+wa,y); });
    tile('mus',(g,W,H)=>{ card(g,W,H); const m=DATA.music, n=m.length, x0=40, x1=W-40, yb=H-150, bw=(x1-x0)/n;
      for(let i=0;i<n;i++){ const h=10+m[i]*150; g.fillStyle=i<n*.42?'#F4CE65':'rgba(244,206,101,0.32)'; g.beginPath(); g.roundRect(x0+i*bw+1.2,yb-h/2,Math.max(2,bw-2.4),h,2); g.fill(); }
      g.font='600 24px Inter'; g.fillStyle='rgba(241,238,232,0.65)'; if(g.letterSpacing!==undefined) g.letterSpacing='4px'; g.textAlign='left'; g.fillText('0:07',40,H-46); g.textAlign='right'; g.fillText('0:22',W-40,H-46); });
    tile('anim',(g,W,H)=>{ card(g,W,H); g.strokeStyle='rgba(244,206,101,0.28)'; g.setLineDash([10,12]); g.lineWidth=4; g.beginPath();
      const P=(v)=>[(v.x+(TB.anim.bw-10)/2)*2, ((TB.anim.bh-10)/2-v.y)*2]; const pts=animPath.getPoints(60).map(P); g.moveTo(...pts[0]); pts.forEach(p=>g.lineTo(...p)); g.stroke(); g.setLineDash([]);
      [0,1].forEach(k=>{ const p=P(animPath.getPoint(k)); g.fillStyle='#F4CE65'; g.save(); g.translate(...p); g.rotate(Math.PI/4); g.fillRect(-11,-11,22,22); g.restore(); }); });
    TB.cena.front.material.map=vtex(); TB.cena.front.material.needsUpdate=true;
  }); return READY; }

// ---------- quando cada peça chega ----------
const DROP={thumb:T.d_thumb, leg:T.d_leg, cena:T.d_cena, mus:T.d_mus, anim:T.d_anim};
const ORDER=['voz','capa','thumb','leg','cena','mus','anim'];
const FLIPD=.62, FSTEP=.11, flipEnd=T.flip0+FSTEP*6+FLIPD;

function placeTile(d,t){
  const g=d.g; let x=d.cx, y=d.cy, z=0, rx=0, ry=0, rz=0, vis=true, landT=null;
  if(d.id==='voz'){
    const H0=V3(110,170,2350), dr=Math.min(t,T.fui), hs=1.3;
    if(t<T.fui-.05){ x=H0.x-8*dr; y=H0.y+3*dr; z=H0.z+40*dr; rx=-.2+.03*dr; ry=-.7+.06*dr; d.g.scale.setScalar(hs); }
    else { const u=(t-(T.fui-.05))/.62, e=ecub(u); const hx=H0.x-8*dr, hy=H0.y+3*dr, hz=H0.z+40*dr, hrx=-.2+.03*dr, hry=-.7+.06*dr; d.g.scale.setScalar(lerp(hs,1,e));
      x=lerp(hx,d.cx,e); y=lerp(hy,d.cy,e); z=lerp(hz,0,e)-18*Math.sin(Math.PI*clamp((u-.8)/.2,0,1)); rx=lerp(hrx,0,e); ry=lerp(hry,0,e); }
    landT=T.fui+.57; }
  else if(d.id==='capa'){
    if(t<T.capaA-.15) vis=false;
    else if(t<T.capaFly){ const u=eo((t-(T.capaA-.15))/.55); const drift=(t-(T.capaA-.15));
      x=lerp(-520,40,u)+6*drift; y=lerp(-1000,10,u)+4*drift; z=lerp(2600,1700,u); rx=lerp(.55,.05,u); ry=lerp(-.7,-.14,u)+.03*drift; rz=lerp(.25,0,u); }
    else { const u=(t-T.capaFly)/(T.capaLand-T.capaFly), e=ecub(u); const h0=V3(40+6*(T.capaFly-T.capaA+.15),10+4*(T.capaFly-T.capaA+.15),1700);
      x=lerp(h0.x,d.cx,e); y=lerp(h0.y,d.cy,e); z=lerp(h0.z,0,e)-22*Math.sin(Math.PI*clamp((u-.8)/.2,0,1)); rx=lerp(.05,0,e); ry=lerp(-.14+.03*(T.capaFly-T.capaA+.15),0,e); }
    landT=T.capaLand; }
  else if(DROP[d.id]!==undefined){ const t0=DROP[d.id], u=(t-t0)/.46; if(u<0) vis=false; else { const e=eback(u); y=d.cy+300*(1-e); z=700*(1-clamp(e,0,1.2)); rx=-.55*(1-e); rz=(d.cx>0?-.12:.12)*(1-e); }
    landT=t0+.46; }
  g.visible=vis; g.position.set(x,y,z); g.rotation.set(rx,ry,rz);
  // aro: brilho ao encaixar e na varredura
  let rimO=.85; if(landT!==null){ rimO+=.9*Math.exp(-Math.max(0,t-landT)*5)*(t>=landT?1:0); }
  const sw=(t-T.sweep)/.9, sx=lerp(-700,700,sw); if(sw>0&&sw<1.3){ rimO+=1.2*Math.exp(-Math.pow((d.cx-d.cy*.4-sx)/160,2)); }
  // virada em onda: o verso forma o vídeo pronto
  const k=ORDER.indexOf(d.id), f0=T.flip0+k*FSTEP, fu=clamp((t-f0)/FLIPD,0,1), fe=ecub(fu);
  d.fl.rotation.y=Math.PI*fe; d.fl.position.z=90*Math.sin(Math.PI*fu);
  const seam=sm(flipEnd,flipEnd+.45,t), sc=lerp(d.bw/d.w,1,seam), scy=lerp(d.bh/d.h,1,seam);
  d.back.scale.set(sc,scy,1);
  d.rim.material.color.set(GOLD).multiplyScalar(.9+.55*clamp(rimO,0,2.6)); d.rim.material.opacity=1-sm(f0+.2,f0+.4,t); d.rim.visible=fu<.5;
  // vaga tracejada
  if(d.slot){ const show=sm(0,.6,t)*.35+sm(T.fui-.1,T.fui+.4,t)*.55; const gone=landT!==null?sm(landT-.15,landT,t):0;
    d.slot.material.opacity=show*(1-gone); d.slotLab.material.opacity=show*.9*(1-gone); d.slot.visible=d.slotLab.visible=show*(1-gone)>.01; }
  return {f0,fu};
}

// ---------- câmera ----------
function camAt(t){
  const K=[
    [0,             V3(430,260,4650),   V3(0,40,0)],
    [T.fui-.05,     V3(400,245,4480),   V3(0,40,0)],
    [T.capaA,       V3(450,225,4700),   V3(0,15,0)],
    [T.capaFly,     V3(390,205,4600),   V3(0,15,0)],
    [T.capaLand+.3, V3(-560,305,4480),  V3(0,-25,0)],
    [T.animE+.25,   V3(-680,375,4380),  V3(0,-5,0)],
    [T.flip0,       V3(-260,155,4050),  V3(0,-15,0)],
    [T.bar0,        V3(0,-87,3550),     V3(0,-87,0)],
    [T.rec0+.2,     V3(0,-80,3700),     V3(0,-80,0)],
    [T.recOut,      V3(0,-80,3720),     V3(0,-80,0)],
    [T.ou+.35,      V3(0,44,5200),      V3(0,44,0)],
    [T.speechEnd,   V3(0,44,5300),      V3(0,44,0)],
    [T.cta0+.9,     V3(0,-139,7110),    V3(0,-139,0)],
    [T.end,         V3(0,-139,7260),    V3(0,-139,0)] ];
  let i=0; while(i<K.length-2 && t>=K[i+1][0]) i++;
  const [t0,p0,q0]=K[i], [t1,p1,q1]=K[i+1];
  const u=t1>t0?clamp((t-t0)/(t1-t0),0,1):1;
  const e=(i===0)?u:eio(u);
  return [p0.clone().lerp(p1,e), q0.clone().lerp(q1,e)];
}
const Pv=new THREE.Vector3();
function toScreen(x,y,z){ Pv.set(x,y,z).applyMatrix4(MG.matrixWorld).project(C); return [(Pv.x+1)*540,(1-Pv.y)*960]; }

function render(t){
  // vídeo pronto (verso das peças): EXEMPLO_2 → no "Ou nem isso", o exemplo narrado por IA (F13)
  if(t<T.ou) setFrame(finTx,frameOf('fin',t,T.flip0-.3)); else setFrame(finTx,frameOf('f13',t,T.ou-.1));
  setFrame(TB.cena.front.material.map,frameOf('cena',t,T.d_cena));
  TILES.forEach(d=>placeTile(d,t));
  // molde: recua na hora do REC e volta no "Ou nem isso"
  const recK=sm(T.rec0,T.rec0+.45,t)*(1-sm(T.recOut,T.recOut+.4,t));
  MG.position.z=-260*recK; MG.position.y=0;
  { const c=sm(T.cta0+.2,T.end,t); MG.rotation.set(.05*c, -.2*c*Math.sin(.5*Math.PI*c)-.04*c, 0); }
  const dim=lerp(1,.32,recK); TILES.forEach(d=>d.back.material.color.setScalar(dim));
  outer.material.opacity=sm(flipEnd+.2,flipEnd+.6,t)*.95;
  // VOZ: a cabeça de leitura desenha a placa de ouro com a voz
  const ph=clamp(.5+.5*(t-.08)/(T.ouv+.42-.08),0,1), px=lerp(-356,356,ph);
  TB.voz.fl.updateMatrixWorld(true);
  { const n=V3(-1,0,0).applyQuaternion(TB.voz.fl.getWorldQuaternion(new THREE.Quaternion())), p=V3(px,0,0).applyMatrix4(TB.voz.fl.matrixWorld);
    plaqueClip.setFromNormalAndCoplanarPoint(n,p); if(ph>=1) plaqueClip.constant=99999; }
  playhead.position.x=px; playhead.material.opacity=1-sm(T.ouv+.3,T.ouv+.6,t);
  const amp=DATA.env[Math.min(DATA.env.length-1,Math.floor(t*30))]||0;
  TB.voz.plaque.scale.set(1,1+.08*amp*(t<T.speechEnd?1:0),1);
  // trilha e animação vivas
  disc.rotation.y=t*1.9;
  { const cyc=((t*.62)%1); ghosts.forEach((m,k)=>{ const u=clamp(ecub(clamp(cyc*1.25,0,1))-k*.085,0,1); m.position.copy(animPath.getPoint(u)); m.rotation.set(.25,.35,u*Math.PI*1.2); m.visible=u>0||k===0; }); }
  // REC
  rec.visible = t>T.rec0-.05 && t<T.recOut+.45;
  if(rec.visible){ const a=eback((t-T.rec0)/.5), b=sm(T.recOut,T.recOut+.38,t), pulse=1+.07*Math.exp(-Math.pow((t-T.grava-.12)/.12,2));
    rec.position.set(0,lerp(-760,-70,clamp(a,0,1.2)),900); rec.scale.setScalar(lerp(.6,1,clamp(a,0,1))*pulse*(1-ecub(b)));
    rec.rotation.set(lerp(.5,0,clamp(a,0,1))+.15*b, 0, -1.4*ecub(b)); }
  // barra: do começo ao fim
  const bk=sm(T.bar0-.15,T.bar0+.15,t)*(1-sm(T.rec0,T.rec0+.3,t)), bp=ecub(clamp((t-T.bar0)/(T.bar1-T.bar0+.15),0,1));
  barBg.material.opacity=.28*bk; barFg.material.opacity=bk; barHead.material.opacity=bk; barFg.scale.x=Math.max(.001,bp); barHead.position.x=-350+700*bp;
  // varredura dourada
  sweep.visible=false;
  // câmera
  const [cp,cq]=camAt(t); C.position.copy(cp); C.lookAt(cq); C.updateMatrixWorld(); MG.updateMatrixWorld(true);
  // selos do vídeo acompanham o topo do quadro
  { const [sx,sy]=toScreen(0,FH/2,DEP+2*BEV); const a=document.getElementById('vfin'), b=document.getElementById('vf13'); a.style.left=b.style.left=sx+'px'; a.style.top=(sy+22)+'px'; b.style.top=(sy-62)+'px'; }
  bloom.strength=.3+.35*Math.exp(-Math.pow((t-T.sweep-.45)/.4,2))+.2*Math.exp(-Math.pow((t-T.capaLand)/.18,2));
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!READY||!TB.voz.front.material.map){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
