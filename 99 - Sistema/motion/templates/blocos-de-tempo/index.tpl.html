  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=16; return t; }
const segTop=new THREE.Mesh(new THREE.PlaneGeometry(BW,BL),new THREE.MeshBasicMaterial({map:segTex(),transparent:true,opacity:0,depthWrite:false}));
segTop.rotation.x=-Math.PI/2; segTop.position.set(0,TOP+BH+1.5,Z0-BL/2); S.add(segTop);
const head=new THREE.Mesh(new THREE.BoxGeometry(BW+60,10,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0})); S.add(head);

// ---------- cartão de vídeo (frente: gravação bruta → versão 2; verso: vídeo pronto) ----------
const CW=600, CH=1067;
function videoTex(){ const tx=new THREE.Texture(); tx.colorSpace=THREE.SRGBColorSpace; tx.minFilter=THREE.LinearFilter; tx.generateMipmaps=false; return tx; }
function setFrame(tx,img){ if(tx.image!==img){ tx.image=img; tx.needsUpdate=true; } }
const SEQ={}; let READY=null, BUILT=false;
function loadImg(src,k=0){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>{ if(k<8) setTimeout(()=>loadImg(src,k+1).then(res,rej),200*(k+1)); else rej(new Error(src)); }; im.src=k?src+'?r='+k:src; }); }
function frameOf(name,t,t0){ const a=SEQ[name]; const i=Math.floor(Math.max(0,(t-t0))*30+1e-6); return a[Math.min(i,a.length-1)]; }
function loopOf(name,t,t0){ const a=SEQ[name]; const i=Math.floor(Math.max(0,(t-t0))*30+1e-6); const n=a.length, p=i%(2*n-2); return a[p<n?p:2*n-2-p]; }
const TX={front:videoTex(),back:videoTex(),l1:videoTex(),l2:videoTex(),l3:videoTex(),l4:videoTex()};
const MASK=roundMask(300,534,22);
function vcard(tx,w,h,edge){ const g=new THREE.Group();
  const frame=new THREE.Mesh(new THREE.ShapeGeometry(rr(new THREE.Shape(),w+22,h+22,34),24),new THREE.MeshStandardMaterial({color:0x101C22,roughness:.4,metalness:.5}));
  frame.position.z=-2; g.add(frame);
  const img=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tx,alphaMap:MASK,transparent:true,toneMapped:false})); g.add(img);
  const e=new THREE.Mesh(ring(w+22,h+22,34,4),new THREE.MeshBasicMaterial({color:0x25D366,transparent:true,opacity:edge})); e.position.z=0.6; g.add(e);
  g.userData={frame,img,e}; return g; }
const card=new THREE.Group(); S.add(card);
const cFront=vcard(TX.front,CW,CH,.85); card.add(cFront);
const cBack=vcard(TX.back,CW,CH,.85); cBack.rotation.y=Math.PI; cBack.position.z=-6; card.add(cBack);
card.visible=false;
const shC=contact(CW+360,420);

// fileira de entregas (o resto é comigo)
const LINE=[['l1',-555,-260],['l2',-185,-300],['l3',185,-300],['l4',555,-260]];
const row=LINE.map(([k,x,z])=>{ const g=vcard(TX[k],360,640,.6); g.position.set(x,-2000,z); S.add(g); g.visible=false; return g; });

// ---------- texto 3D extrudado ----------
let txt2D=null, txt1D=null, txtSeg=null, txt5=null;
const letterMat=new THREE.MeshPhysicalMaterial({color:0xC9D2D6,metalness:.2,roughness:.3,clearcoat:1,clearcoatRoughness:.15});
const letterSide=new THREE.MeshPhysicalMaterial({color:0x8FA3AD,metalness:.35,roughness:.4});
const greenMat=new THREE.MeshPhysicalMaterial({color:0x25D366,metalness:.15,roughness:.3,clearcoat:1,clearcoatRoughness:.2,emissive:0x25D366,emissiveIntensity:.06});
const greenSide=new THREE.MeshPhysicalMaterial({color:0x128C4A,metalness:.25,roughness:.38});
function word(font,str,size,depth,mats){ const geo=new TextGeometry(str,{font,size,depth,curveSegments:10,bevelEnabled:true,bevelThickness:Math.max(2,depth*.08),bevelSize:Math.max(1.5,size*.012),bevelSegments:3});
  geo.computeBoundingBox(); const b=geo.boundingBox; geo.translate(-(b.min.x+b.max.x)/2,-b.min.y,-(b.min.z+b.max.z)/2);
  const m=new THREE.Mesh(geo,mats); const pivot=new THREE.Group(); pivot.add(m); S.add(pivot); pivot.userData={w:b.max.x-b.min.x}; return pivot; }

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.ready, document.fonts.load('500 40px Plex'), document.fonts.load('800 70px Inter')];
  // quadros carregados em fila (16 por vez, com novas tentativas) para não derrubar o servidor local com centenas de pedidos simultâneos
  const todo=[]; Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) todo.push([name,i]); });
  let next=0; const worker=()=>{ if(next>=todo.length) return Promise.resolve(); const [name,i]=todo[next++];
    return loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>{ SEQ[name][i]=im; return worker(); }); };
  for(let k=0;k<16;k++) jobs.push(worker());
  jobs.push(new Promise((res,rej)=>new FontLoader().load('assets/inter-800.typeface.json',f=>{
    txt2D=word(f,'2 DIAS',190,70,[letterMat,letterSide]); txt1D=word(f,'+1 DIA',190,70,[letterMat,letterSide]);
    txtSeg=word(f,'20–30 MIN',82,26,[greenMat,greenSide]); txt5=word(f,'5 MIN',205,84,[greenMat,greenSide]); res(); },undefined,rej)));
  READY=Promise.all(jobs).then(()=>{ rulerMat.map=rulerTex(); rulerMat.needsUpdate=true; BUILT=true; }); return READY; }

// ---------- câmera ----------
function camAt(t){
  const st={px:420,py:470,pz:3560,tx:0,ty:70,tz:-260};
  const mix=(s,u)=>{ for(const k in s) st[k]=lerp(st[k],s[k],u); };
  mix({px:300,py:470,pz:3380,tx:0,ty:30,tz:-300},sm(0,T.land1,t));                                  // aproximação lenta no gancho
  mix({px:1000,py:2000,pz:4300,tx:-70,ty:-110,tz:-1250},eio((t-T.land1-0.35)/1.5));                    // sobe e mostra a régua de 72 h
  mix({px:1350,py:1750,pz:3800,tx:-60,ty:-150,tz:-1350},eio((t-T.cortez+0.1)/0.9));                   // varredura
  mix({px:760,py:820,pz:2650,tx:0,ty:-240,tz:-60},eio((t-T.comp0)/(T.comp1-T.comp0+0.2)));          // compressão → segmento
  mix({px:330,py:700,pz:3300,tx:0,ty:170,tz:0},eio((t-T.grava+0.2)/0.9));                            // cartão de vídeo
  mix({px:240,py:560,pz:3050,tx:0,ty:190,tz:0},sm(T.pronto,T.voce,t));                               // leve aproximação
  mix({px:-380,py:330,pz:3000,tx:-20,ty:-330,tz:300},eio((t-T.voce)/1.0));                          // recua: 5 MIN
  mix({px:0,py:420,pz:3450,tx:0,ty:-170,tz:-60},eio((t-T.resto+0.15)/1.0));                         // fileira de entregas atrás do 5 MIN
  mix({px:80,py:560,pz:3800,tx:0,ty:-60,tz:-120},eio((t-T.cta0)/3.5));                                // deriva no CTA
  // impacto dos blocos
  const sh=12*gauss(t,T.land1+0.06,0.12)*Math.sin((t-T.land1)*70)+8*gauss(t,T.land2+0.06,0.12)*Math.sin((t-T.land2)*70);
  C.position.set(st.px,st.py+sh,st.pz); C.lookAt(st.tx,st.ty+sh*0.5,st.tz);
  return new THREE.Vector3(st.tx,st.ty,st.tz);
}

function render(t){
  const tgt=camAt(t);
  // quedas
  const FA=T.land1-0.42;
  const offA = t<FA ? lerp(560,430,eo(t/FA)) : t<T.land1 ? 430*(1-ei((t-FA)/0.42)) : -5*settle(t-T.land1);
  const offB = t<T.fall2 ? 1600 : t<T.land2 ? 1100*(1-ei((t-T.fall2)/(T.land2-T.fall2))) : -4*settle(t-T.land2);
  shA.material.opacity=0.85*clamp(1-offA/650,0,1)*(1-sm(T.comp0,T.comp0+0.6,t));
  shB.material.opacity=0.85*clamp(1-offB/700,0,1)*(t>=T.fall2?1:0)*(1-sm(T.comp0,T.comp0+0.6,t));
  // varredura
  const sc=(t-T.cortez)/(T.scanEnd-T.cortez); const zs=lerp(SZ0,SZ1,eio(sc));
  scan.visible=t>=T.cortez-0.05 && t<T.scanEnd+0.35; scan.position.z=zs;
  const so=clamp((t-T.cortez+0.05)/0.15,0,1)*(1-clamp((t-T.scanEnd)/0.3,0,1)); scanFace.material.opacity=.13*so; scanEdge.material.opacity=so;
  // fatias
  const cg=sm(T.comp1-0.55,T.comp1+0.1,t);
  slabMat.color.setRGB(lerp(0.106,0.145,cg),lerp(0.165,0.827,cg),lerp(0.188,0.4,cg)); slabMat.metalness=lerp(.55,.15,cg);
  slabMat.emissiveIntensity=0.05*gauss(t,T.cortez+0.8,0.6)+0.42*cg;
  const dur=T.comp1-T.comp0;
  for(let i=0;i<N;i++){
    const zc=Z0-(i+0.5)*HS; const isB=i>=48; const off=isB?offB:offA;
    const un=eo((t-PASS[i])/0.22)*(t>=T.cortez?1:0);                               // fatia solta: abre a junta quando a varredura passa
    const d=(N-1-i)*0.0042; const c=eio((t-T.comp0-d)/(dur-0.32));
    const zt=Z0-(i+0.5)*(BL/N);
    const z=lerp(zc,zt,c); const y=lerp(SY+off+8*un*Math.sin(i*1.7),TOP+BH/2,c)-(BH+60)*eio((t-T.voce-0.05)/0.55);   // o segmento afunda no "Você gasta"
    const sx=lerp(SW,BW,c), sy=lerp(SH,BH,c), sz=lerp(HS*(1-0.16*un),BL/N,c);
    if(isB && t<T.fall2-0.02) s3.set(0.001,0.001,0.001); else s3.set(sx,sy,sz);
    v3.set(0,y,z); m4.compose(v3,q4,s3); slices.setMatrixAt(i,m4);
  }
  slices.instanceMatrix.needsUpdate=true;
  // letras sobre os blocos: tombam para trás quando a varredura passa e afundam
  if(txt2D){
    const fallA=eio((t-PASS[3])/0.45), fallB=eio((t-PASS[51])/0.45);
    txt2D.position.set(0,SY+SH/2+offA,Z0-150); txt2D.rotation.x=-Math.PI/2*fallA; txt2D.visible=t<T.comp0+0.2;
    txt2D.children[0].position.y=-60*fallA; txt2D.scale.setScalar(1-0.0*fallA);
    txt1D.position.set(0,SY+SH/2+offB,Z0-48*HS-170); txt1D.rotation.x=-Math.PI/2*fallB; txt1D.visible=t>=T.fall2 && t<T.comp0+0.2;
    txt1D.children[0].position.y=-60*fallB;
    // segmento verde: "20–30 MIN" em pé sobre o segmento
    const ss=eo((t-T.comp1+0.05)/0.45)*(1-sm(T.grava-0.3,T.grava+0.05,t));
    txtSeg.visible=ss>0.002; txtSeg.position.set(0,TOP+BH+lerp(-90,0,ss),Z0-40); txtSeg.scale.setScalar(Math.max(0.001,ss)); txtSeg.rotation.x=-0.25;
    // "5 MIN"
    const f5=eo((t-T.cinco+0.12)/0.5); const set5=settle(t-T.cinco-0.38);
    txt5.visible=t>=T.cinco-0.15; txt5.position.set(-20,lerp(FLOOR-420,TOP+2,f5)+6*set5,Z0+330); txt5.rotation.y=0.12;
  }
  // régua do segmento e cabeça de leitura
  const sv=sm(T.comp1-0.1,T.comp1+0.3,t)*(1-sm(T.voce,T.voce+0.4,t)); segTop.material.opacity=sv;
  const hr=clamp((t-T.run0)/(T.run1-T.run0),0,1); head.material.opacity=0;
  head.position.set(0,TOP+BH+6,Z0-8-hr*(BL-16));
  // cartão de vídeo
  card.visible=t>=T.grava-0.25; shC.material.opacity=0;
  if(card.visible){
    const dr=ei((t-T.grava+0.2)/0.45), st=settle(t-T.grava-0.25);
    const away=eio((t-T.voce)/1.0);
    const y=lerp(1500,0,dr)+(dr>=1?-5*st:0); const sc_=lerp(1,0.78,away);
    card.scale.setScalar(sc_);
    const gone=eio((t-T.resto+0.1)/0.6);
    card.position.set(lerp(0,430,away)+1100*gone,lerp(TOP+BH,TOP,away)+CH/2*sc_+y,lerp(Z0-BL+50,-430,away));
    if(gone>=0.999) card.visible=false;
    const flip=eio((t-T.pronto)/0.6)*Math.PI+eio((t-T.ajusto)/0.6)*Math.PI;
    card.rotation.set(0,flip+lerp(0,-0.34,away),0);
    shC.position.set(card.position.x,TOP+BH+1.5,card.position.z+60); shC.material.opacity=0.7*dr*(1-away);
    if(t<T.pronto+0.3) setFrame(TX.front, loopOf('raw',t,T.grava)); else setFrame(TX.front, loopOf('v2',t,T.ajusto));
    setFrame(TX.back, frameOf('fin',t,T.pronto));
  }
  // fileira de entregas
  row.forEach((g,k)=>{ const t0=T.resto+0.05+k*0.16; const u=eo((t-t0)/0.55); g.visible=t>=t0-0.05;
    const [nm,x,z]=LINE[k]; g.position.set(x,lerp(FLOOR-700,TOP+2+320,u)+(u>=1?-4*settle(t-t0-0.55):0),z); g.rotation.y=-x*0.00042;
    if(g.visible) setFrame(TX[nm], loopOf(nm,t,t0)); });
  // foco e brilho
  const subj=new THREE.Vector3(); if(t>=T.grava-0.2 && t<T.voce+0.5) subj.copy(card.position); else if(t>=T.voce+0.5 && t<T.resto+0.3 && txt5) subj.set(-20,-250,Z0+330); else if(t>=T.resto+0.3) subj.set(0,-80,-260); else subj.copy(tgt);
  bokeh.uniforms.focus.value=C.position.distanceTo(subj);
  bokeh.uniforms.aperture.value=0.0000032*(t>=T.grava?1:0.6);
  bloom.strength=0.08+0.1*gauss(t,T.land1+0.05,0.12)+0.08*gauss(t,T.land2+0.05,0.12)+0.12*so+0.06*gauss(t,T.comp1+0.1,0.25);
  composer.render();
  const f=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((f*97)%64))+'px,'+(-((f*61)%64))+'px)';
}
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!BUILT){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
</body>
</html>
