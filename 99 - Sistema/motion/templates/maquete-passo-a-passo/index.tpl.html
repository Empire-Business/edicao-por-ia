  { const pop=bo(K(t,T.nada+0.3,0.5),1.6), fly=eio(K(t,T.cl0+0.05,0.62));

    if(pdf.visible){ const pulse=1+0.07*Math.exp(-Math.pow((t-T.pdfw-0.08)/0.12,2));
      const hx=IMPLODE.x, hy=IMPLODE.y+9*Math.sin((t-T.nada)*1.6), hz=IMPLODE.z;
      pdf.position.set(lerp(hx,SCREEN_L.x,fly), lerp(hy,SCREEN_L.y,fly)+150*Math.sin(Math.PI*fly), lerp(hz,SCREEN_L.z+8,fly));
      pdf.rotation.set(lerp(0.04*Math.sin(t*0.9),-0.2,fly), lerp(-0.42+0.72*sm(K(t,T.nada+0.3,T.cl0-T.nada-0.3)),0,fly), lerp(0.03*Math.sin(t*1.2),0,fly));
      pdf.scale.setScalar(Math.max(0.001,pop)*pulse*lerp(1,0.18,fly)); } }
  drawScreen(t);
  // pastas saem da tela do notebook e formam um arco
  // pastas saem da tela do notebook e formam um arco; nos planos fechados voltam para dentro do notebook (e saem de novo quando são usadas)
  const tuck = eio(K(t,T.convidado+0.3,0.55))*(1-eo(K(t,T.raw0-0.15,0.5))) + eio(K(t,T.hero0+0.12,0.45))*(1-eo(K(t,T.cta0+0.3,0.6)));
  folders.forEach((g,i)=>{ const t0=T.pas0+0.42+i*0.11; const u=K(t,t0,0.56); const tk=clamp(tuck+0.0*i,0,1);
    g.visible = t>t0 && tk<0.985;
    if(!g.visible) return; const [x,y,z,ry]=FSLOT[i]; const e=eo(u)*(1-tk), b=bo(u,1.5)*(1-tk);
    let bump=0; if(i===0) bump+=Math.exp(-Math.pow((t-T.raw1-0.05)/0.09,2)); if(i===1) bump+=Math.exp(-Math.pow((t-T.hero0+0.02)/0.09,2));
    if(i===1) for(let k=0;k<3;k++) bump+=0.8*Math.exp(-Math.pow((t-T.cta0-0.75-k*0.16)/0.08,2));
    g.position.set(lerp(SCREEN_L.x,x,e), lerp(SCREEN_L.y,y,e)+(t>T.convidado?30:110)*Math.sin(Math.PI*e)*(1-e*0.2)+5*Math.sin(t*1.4+i)*e+18*bump, lerp(SCREEN_L.z,z,e));
    g.rotation.set(0.05*Math.sin(t*1.1+i)*e, ry*e + (1-e)*0.8, 0.02*Math.sin(t*0.9+i*2));
    g.scale.setScalar(Math.max(0.001,lerp(0.18,1,b))*(1+0.07*bump));
    g.userData.front.rotation.x = 0.12 + 0.5*bump; });
  // Convidado: cartão (foto parada enquanto o Apresentador fala dele; vídeo da live quando ele fala)
  { const up=bo(K(t,T.convidado-0.12,0.55),1.5), out=ei(K(t,T.cta0+0.05,0.4));
    jo.visible = t>T.convidado-0.12 && out<0.999;
    if(jo.visible){ jo.position.x = -282 - 270*eio(K(t,T.ele-0.1,0.7))*(1-eio(K(t,T.raw0-0.45,0.6)));   // abre espaço para a tela do notebook
      jo.scale.set(Math.max(.001,up*(1-out)),Math.max(.001,up*(1-out)),Math.max(.001,up*(1-out))); jo.rotation.y=0.18*(1-eo(K(t,T.convidado-0.12,0.9)))+0.04*Math.sin(t*0.6);
      setFrame(joTx, t>=T.fala0 ? frameOf('convidado_live',t,T.fala0,false) : SEQ.convidado_still[0]);
      const bb=bo(K(t,T.comprou,0.45),1.8); joBadge.visible=bb>0.01; joBadge.scale.setScalar(Math.max(.001,bb)); } }
  // antes → depois: o bruto entra na pasta 01; a pasta 02 devolve o vídeo editado
  { const a=bo(K(t,T.raw0,0.42),1.4), f=eio(K(t,T.raw1-0.42,0.42));
    raw.visible = t>T.raw0 && t<T.raw1+0.02;
    if(raw.visible){ const sl=FSLOT[0]; raw.position.set(lerp(SPOT.x,sl[0],f), lerp(SPOT.y,sl[1]-40,f)+90*Math.sin(Math.PI*f), lerp(SPOT.z,sl[2],f));
      raw.rotation.set(0,lerp(-0.2,0,f),lerp(0,0.3,f)); raw.scale.setScalar(Math.max(.001,a*lerp(1,0.2,f))); setFrame(raw.userData.tx,frameOf('raw',t,T.raw0-0.6,true)); } }
  { const e=eo(K(t,T.hero0,0.55)), b=bo(K(t,T.hero0,0.6),1.3), out=ei(K(t,T.cta0+0.05,0.4)); const sl=FSLOT[1];
    hero.visible = t>T.hero0 && out<0.999;
    if(hero.visible){ hero.position.set(lerp(sl[0],SPOT.x,e), lerp(sl[1]-40,SPOT.y,e)+130*Math.sin(Math.PI*e), lerp(sl[2],SPOT.z,e));
      hero.rotation.set(0,lerp(0.6,-0.2,e)+0.03*Math.sin(t*0.8),0); hero.scale.setScalar(Math.max(.001,lerp(0.2,1,b)*(1-out)));
      setFrame(hero.userData.tx,frameOf('hero',t,T.hero0,true)); } }
  // cartão final: três vídeos editados pelo Cortez saem da pasta 02
  ctaT.forEach((g,i)=>{ const t0=T.cta0+0.75+i*0.16; const e=eo(K(t,t0,0.6)), b=bo(K(t,t0,0.62),1.3); g.visible=t>t0; if(!g.visible) return;
    const sl=FSLOT[1]; const k=i-1; const tx=k*250, tz=170+(k===0?40:0);
    g.position.set(lerp(sl[0],tx,e), lerp(sl[1]-40,DY,e)+140*Math.sin(Math.PI*e)+ (e>=1? 5*Math.sin(t*1.3+i):0), lerp(sl[2],tz,e));
    g.rotation.set(0,lerp(0.5,-k*0.3,e)+0.04*Math.sin((t-T.cta0)*0.7+i),0); g.scale.setScalar(Math.max(.001,lerp(0.2,1,b)));
    setFrame(g.userData.tx,frameOf(['c2','c1','c3'][i],t,t0,true)); });
  composer.render();
  const fr=Math.floor(t*30+1e-6); document.getElementById('grain').style.transform='translate('+(-((fr*97)%64))+'px,'+(-((fr*61)%64))+'px)';
}

function prepare(){ if(READY) return READY;
  const jobs=[document.fonts.ready, ...['800 66px Inter','700 32px Inter','600 31px Inter','500 26px Inter','500 27px "IBM Plex Mono"','700 18px "IBM Plex Mono"'].map(f=>document.fonts.load(f))];
  Object.entries(DATA.seq).forEach(([name,n])=>{ SEQ[name]=new Array(n); for(let i=0;i<n;i++) jobs.push(loadImg(`assets/seq/${name}/${String(i).padStart(4,'0')}.jpg`).then(im=>SEQ[name][i]=im)); });
  jobs.push(loadImg('assets/convidado_still.jpg').then(im=>SEQ.convidado_still=[im]));
  READY=Promise.all(jobs).then(()=>{ DRAWS.forEach(fn=>fn()); scrKey=''; BUILT=true; }); return READY; }
window.addEventListener('hf-seek', e=>{ const t=e.detail.time; if(!BUILT){ e.detail.waitUntil(prepare().then(()=>render(t))); } else render(t); });
</script>
