name: Verificar pacote e preservação de dados
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Preparar dependência dos testes
        run: python -m pip install 'PyYAML==6.0.3' 'Pillow==12.3.0' 'numpy>=2,<3'
      - name: Preparar FFmpeg para testes de mídia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Conferir pacote e testar instalação limpa e regressão
        working-directory: 99 - Sistema
        run: python tools/check_release.py --tests
